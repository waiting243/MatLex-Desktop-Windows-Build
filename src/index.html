<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>MatLex Desktop</title>
<meta name="matlex-version" content="11.4.2-desktop">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f4f8fd;--surface:#ffffff;--surface-soft:rgba(255,255,255,.84);--text:#0d1b34;--muted:#8796aa;
  --hair:rgba(50,75,105,.10);--hair-strong:rgba(50,75,105,.16);--accent:#1878f5;--accent2:#55a8ff;
  --accent-soft:rgba(24,120,245,.085);--ok:#24a875;--bad:#e35c70;--warn:#ef9c48;
  --shadow:0 10px 28px rgba(49,82,124,.07);--glass-shadow:0 16px 42px rgba(48,84,132,.10);
  --ease:cubic-bezier(.22,.84,.22,1);--safe-bottom:max(10px,env(safe-area-inset-bottom));
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Roboto","Noto Sans SC","PingFang SC","Microsoft YaHei UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{background:radial-gradient(78vw 34vh at 8% -4%,rgba(85,168,255,.13),transparent 66%),radial-gradient(64vw 28vh at 100% 4%,rgba(119,150,255,.07),transparent 70%),linear-gradient(180deg,#f1f7ff 0%,#f7f9fc 56%,#f5f7fa 100%)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.hidden{display:none!important}
svg{display:block}
.app{height:100%;width:100%;max-width:720px;margin:0 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;padding:18px 18px calc(92px + var(--safe-bottom));scrollbar-width:none}
.app::-webkit-scrollbar{display:none}
.view{display:none;opacity:0;transform:translate3d(0,8px,0)}.view.active{display:block;animation:viewIn .24s var(--ease) forwards}@keyframes viewIn{to{opacity:1;transform:none}}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:4px 2px 18px}.page-title{margin:0;font-size:34px;line-height:1.04;letter-spacing:-.055em;font-weight:760}
.primary{height:52px;border:0;border-radius:18px;background:linear-gradient(135deg,#4399ff,#176df5);color:#fff;font-size:16px;font-weight:680;box-shadow:0 10px 22px rgba(24,120,245,.17);transition:transform .13s ease,filter .18s ease,opacity .18s ease}.primary:active{transform:scale(.986);filter:brightness(.98)}.primary:disabled{opacity:.42;box-shadow:none}.primary .btn-icon{width:21px;height:21px;margin-right:8px;vertical-align:-4px;display:inline-block}
.home-start{width:100%;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:16px}.stat{height:92px;border:1px solid rgba(255,255,255,.92);border-radius:20px;background:var(--surface-soft);box-shadow:var(--shadow),inset 0 1px 0 #fff;padding:13px 13px 12px;display:flex;flex-direction:column;justify-content:space-between;backdrop-filter:blur(16px) saturate(120%);-webkit-backdrop-filter:blur(16px) saturate(120%)}.stat-top{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.stat-icon{width:17px;height:17px;color:var(--accent)}.stat:nth-child(2) .stat-icon{color:var(--ok)}.stat:nth-child(3) .stat-icon{color:var(--bad)}.stat b{font-size:27px;line-height:1;font-weight:710;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.spelling-card{display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:11px;margin:0 0 22px;padding:12px 13px;border:1px solid rgba(255,255,255,.92);border-radius:20px;background:var(--surface-soft);box-shadow:var(--shadow),inset 0 1px 0 #fff;backdrop-filter:blur(16px) saturate(120%);-webkit-backdrop-filter:blur(16px) saturate(120%)}.spelling-mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(24,120,245,.14),rgba(85,168,255,.06));border:1px solid rgba(24,120,245,.12);color:var(--accent);font-size:17px;font-weight:750}.spelling-copy{min-width:0;display:flex;flex-direction:column;gap:3px}.spelling-copy b{font-size:15px;font-weight:680;letter-spacing:-.02em}.spelling-copy span{font-size:11px;color:var(--muted);line-height:1.35}.spelling-copy strong{color:var(--text);font-weight:650}.spelling-start{height:38px;min-width:58px;padding:0 12px;border:1px solid rgba(24,120,245,.14);border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:680}
.section-title{font-size:20px;line-height:1.2;font-weight:720;letter-spacing:-.035em;margin:0 2px 10px}.settings-grid{display:grid;grid-template-columns:1fr;gap:18px}.settings-col{min-width:0}.panel{border:1px solid rgba(255,255,255,.92);border-radius:21px;background:var(--surface-soft);box-shadow:var(--shadow),inset 0 1px 0 #fff;padding:0 15px;backdrop-filter:blur(16px) saturate(120%);-webkit-backdrop-filter:blur(16px) saturate(120%)}.setting{min-height:58px;border-bottom:.5px solid var(--hair);display:grid;grid-template-columns:minmax(88px,1fr) auto;align-items:center;gap:10px}.setting:last-child{border-bottom:0}.setting label{font-size:14px;font-weight:590;white-space:nowrap}.select,.number{height:38px;border:1px solid var(--hair-strong);border-radius:12px;background:rgba(255,255,255,.64);outline:none;padding:0 11px;font-size:14px}.select{width:min(194px,48vw)}.number{width:86px}.segment{height:35px;min-width:138px;padding:2px;border:1px solid var(--hair);border-radius:12px;background:rgba(113,132,157,.065);display:grid;grid-template-columns:1fr 1fr;gap:2px}.segment button{border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:12px;transition:background .18s ease,color .18s ease,box-shadow .18s ease}.segment button.active{background:#fff;color:var(--text);font-weight:650;box-shadow:0 2px 7px rgba(27,47,72,.06)}.switch{width:46px;height:28px;border-radius:999px;background:rgba(118,133,153,.19);position:relative;transition:background .2s ease}.switch i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.13);transition:transform .22s var(--ease)}.switch.on{background:var(--accent)}.switch.on i{transform:translateX(18px)}.secondary{height:38px;padding:0 13px;border:1px solid var(--hair-strong);border-radius:12px;background:rgba(255,255,255,.55);font-size:13px;font-weight:620}

/* Review */
.review-overview{border:1px solid rgba(255,255,255,.92);border-radius:22px;background:var(--surface-soft);box-shadow:var(--shadow),inset 0 1px 0 #fff;padding:16px;margin-bottom:12px;backdrop-filter:blur(16px) saturate(120%);-webkit-backdrop-filter:blur(16px) saturate(120%)}.review-main{display:flex;align-items:center;justify-content:space-between;gap:14px}.review-main-copy span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.review-main-copy b{font-size:34px;line-height:1;font-weight:720;letter-spacing:-.05em}.review-start-all{height:44px;padding:0 18px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:14px;font-weight:680}.review-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.review-mini{min-height:72px;border:1px solid var(--hair);border-radius:16px;background:rgba(255,255,255,.48);padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.review-mini .mini-copy span{display:block;font-size:11px;color:var(--muted)}.review-mini .mini-copy b{display:block;margin-top:3px;font-size:22px;line-height:1;font-weight:700}.review-mini button{height:34px;padding:0 11px;border:1px solid var(--hair-strong);border-radius:11px;background:#fff;font-size:11px;font-weight:620}.review-settings{margin-top:12px}

/* Wrong / familiar / excluded */
.wrong-filter{height:42px;padding:3px;margin-bottom:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border:1px solid var(--hair);border-radius:15px;background:rgba(120,137,158,.065)}.wrong-filter button{border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:12px;font-weight:570;transition:.2s ease}.wrong-filter button.active{background:#fff;color:var(--text);font-weight:660;box-shadow:0 2px 8px rgba(34,57,86,.07)}.wrong-pane{display:none}.wrong-pane.active{display:block;animation:paneIn .2s ease both}@keyframes paneIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}.wrong-list{display:grid;gap:8px}.wrong-row{padding:13px 14px;border:1px solid rgba(255,255,255,.92);border-radius:18px;background:var(--surface-soft);box-shadow:var(--shadow),inset 0 1px 0 #fff;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}.wrong-title-line{display:flex;align-items:center;gap:7px;min-width:0}.wrong-row h3{margin:0;font-size:16px;line-height:1.2;font-weight:680;letter-spacing:-.02em;min-width:0;overflow-wrap:anywhere}.word-step{flex:none;padding:3px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:680;font-variant-numeric:tabular-nums}.wrong-meta{margin-top:5px;font-size:11px;line-height:1.5;color:var(--muted)}.wrong-actions{display:flex;gap:6px}.icon-btn{width:38px;height:36px;border:1px solid var(--hair-strong);border-radius:11px;background:rgba(255,255,255,.55);display:grid;place-items:center;padding:0}.icon-btn svg{width:18px;height:18px}.retry{width:auto!important;padding:0 11px!important;font-size:11px;font-weight:620}.empty{min-height:170px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;border:1px solid rgba(255,255,255,.92);border-radius:20px;background:var(--surface-soft);box-shadow:var(--shadow),inset 0 1px 0 #fff}.manage-inline-row{padding:13px 14px;border-bottom:.5px solid var(--hair);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.manage-inline-row:last-child{border-bottom:0}.manage-inline-row b{font-size:14px;font-weight:650}.manage-inline-row span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.manage-inline-row button{height:34px;padding:0 11px;border:1px solid var(--hair-strong);border-radius:10px;background:#fff;font-size:11px;font-weight:620}.manage-inline-list{border:1px solid rgba(255,255,255,.92);border-radius:20px;background:var(--surface-soft);box-shadow:var(--shadow),inset 0 1px 0 #fff;overflow:hidden}

/* Bottom tab */
.tab-shell{position:fixed;left:50%;bottom:calc(9px + var(--safe-bottom));transform:translate3d(-50%,0,0);width:min(286px,calc(100vw - 42px));height:58px;padding:4px;border:1px solid rgba(255,255,255,.88);border-radius:24px;background:rgba(255,255,255,.69);box-shadow:inset 0 1px 0 rgba(255,255,255,.98),var(--glass-shadow);backdrop-filter:blur(25px) saturate(135%);-webkit-backdrop-filter:blur(25px) saturate(135%);z-index:60;contain:layout paint style;transition:opacity .18s ease,transform .22s var(--ease)}.tabbar{height:50px;position:relative;display:grid;grid-template-columns:repeat(3,1fr)}.tab-indicator{position:absolute;inset:0 auto 0 0;width:33.3333%;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(226,241,255,.62));border:1px solid rgba(255,255,255,.98);box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(43,90,145,.08);transform:translate3d(calc(var(--tab-index,0)*100%),0,0);transition:transform .30s var(--ease);pointer-events:none}.tab{position:relative;z-index:1;border:0;background:transparent;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);font-size:10px;transition:color .18s ease,transform .12s ease}.tab svg{width:21px;height:21px}.tab.on{color:var(--accent);font-weight:660}.tab:active{transform:scale(.96)}body.study-active .tab-shell{opacity:0;pointer-events:none;transform:translate3d(-50%,16px,0)}

/* Study */
.overlay{position:fixed;inset:0;z-index:100;display:none;overflow:hidden;background:radial-gradient(80vw 34vh at 15% -5%,rgba(83,167,255,.14),transparent 70%),linear-gradient(180deg,#f2f8ff 0%,#f7f9fc 100%)}.overlay.show{display:block;animation:overlayIn .20s ease both}@keyframes overlayIn{from{opacity:0}to{opacity:1}}.study{height:100%;width:min(100%,620px);margin:0 auto;overflow-y:auto;padding:10px 14px calc(22px + var(--safe-bottom));scrollbar-width:none}.study::-webkit-scrollbar{display:none}.study-top{height:46px;display:grid;grid-template-columns:40px minmax(0,1fr) 44px;align-items:center;gap:10px;margin:0 0 5px}.close{width:38px;height:38px;border:1px solid rgba(255,255,255,.95);border-radius:13px;background:rgba(255,255,255,.82);box-shadow:0 6px 16px rgba(47,83,132,.06);font-size:21px}.progress{height:5px;border-radius:999px;background:rgba(99,119,146,.14);overflow:hidden}.progress i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .22s var(--ease)}.progress-text{text-align:right;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.study-body{width:100%;margin:0 auto}.study-screen{width:100%;transform-origin:center top}.study-screen.enter{animation:screenIn .24s var(--ease) both}.study-screen.leave{animation:screenOut .11s ease both}@keyframes screenIn{from{opacity:0;transform:translate3d(12px,3px,0) scale(.995)}to{opacity:1;transform:none}}@keyframes screenOut{to{opacity:0;transform:translate3d(-8px,0,0) scale(.997)}}.stage{display:flex;justify-content:center;gap:7px;margin:8px 0 10px}.stage i{width:26px;height:4px;border-radius:999px;background:rgba(103,123,149,.16)}.stage i.now{background:var(--accent)}.stage i.done{background:rgba(36,168,117,.72)}.quiz-card,.lesson-card{width:100%;border:1px solid rgba(255,255,255,.94);border-radius:24px;background:rgba(255,255,255,.86);box-shadow:0 14px 38px rgba(48,82,126,.10),inset 0 1px 0 #fff;backdrop-filter:blur(16px) saturate(120%);-webkit-backdrop-filter:blur(16px) saturate(120%)}.quiz-card{padding:16px 14px 14px}.prompt{min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 5px 14px}.term-line,.lesson-title-row{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}.term{font-size:36px;line-height:1.06;letter-spacing:-.045em;font-weight:720;text-align:center;text-wrap:balance}.term.short{white-space:nowrap}.term.medium{font-size:31px}.term.long{font-size:26px}.zh-prompt{font-size:29px;line-height:1.16;letter-spacing:-.035em;font-weight:700;max-width:92%;text-wrap:balance}.prompt-progress{position:absolute;right:22px}.meta-row,.lesson-meta{display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px}.meta-pill{min-height:26px;padding:0 9px;border:1px solid var(--hair);border-radius:999px;display:flex;align-items:center;color:var(--muted);font-size:11px}.inline-speaker{width:34px;height:34px;border:1px solid rgba(24,120,245,.13);border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;padding:0}.inline-speaker svg{width:17px;height:17px}.audio-prompt{width:62px;height:62px;border:1px solid rgba(24,120,245,.15);border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;padding:0}.audio-prompt svg{width:26px;height:26px}.options{display:grid;gap:8px}.option{min-height:54px;border:1px solid var(--hair-strong);border-radius:15px;background:rgba(255,255,255,.50);text-align:center;padding:11px 13px;font-size:15px;font-weight:560;line-height:1.3;transition:background .16s ease,border-color .16s ease,color .16s ease,transform .11s ease}.option:active{transform:scale(.987)}.option.correct{background:rgba(36,168,117,.075);border-color:rgba(36,168,117,.28);color:var(--ok)}.option.wrong{background:rgba(227,92,112,.075);border-color:rgba(227,92,112,.27);color:var(--bad)}.option small{display:block;margin-top:2px;color:var(--muted);font-size:10px;font-weight:500}.word-manage{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px;padding-top:11px;border-top:.5px solid var(--hair)}.word-manage button{height:38px;border-radius:12px;border:1px solid var(--hair-strong);background:rgba(255,255,255,.42);font-size:12px;font-weight:600;color:var(--muted);transition:.14s ease}.word-manage button:active{transform:scale(.987)}.word-manage .familiar{color:var(--accent);background:rgba(24,120,245,.055);border-color:rgba(24,120,245,.14)}.word-manage .exclude{color:#8d98a7}.feedback{width:max-content;margin:0 auto 8px;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:650}.feedback.ok{background:rgba(36,168,117,.08);color:var(--ok)}.feedback.bad{background:rgba(227,92,112,.08);color:var(--bad)}.lesson-card{padding:19px 16px 20px}.lesson-word{font-size:32px;line-height:1.08;letter-spacing:-.04em;font-weight:720;text-align:center;text-wrap:balance}.lesson-block{margin-top:15px;padding-top:15px;border-top:.5px solid var(--hair)}.lesson-label{font-size:10px;color:var(--muted);margin-bottom:7px}.meanings{display:flex;gap:7px;flex-wrap:wrap}.meaning{padding:5px 9px;border-radius:999px;background:rgba(118,136,159,.07);font-size:12px}.example-en{font-size:14px;line-height:1.6;font-weight:500}.example-zh{margin-top:5px;font-size:12px;line-height:1.55;color:var(--muted)}.audio-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.audio-actions button{height:38px;border:1px solid var(--hair-strong);border-radius:11px;background:rgba(255,255,255,.4);font-size:11px}.continue{display:block;width:min(260px,84%);height:48px;margin:19px auto 0;border:0;border-radius:15px;background:var(--accent);color:#fff;font-size:14px;font-weight:680;box-shadow:0 8px 18px rgba(24,120,245,.14)}.summary{text-align:center;padding:46px 10px 16px}.summary h2{margin:0;font-size:30px;letter-spacing:-.04em}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.summary-item{padding:16px;border:1px solid var(--hair);border-radius:18px;background:var(--surface)}.summary-item b{display:block;font-size:26px}.summary-item span{font-size:11px;color:var(--muted)}.speak-word{cursor:pointer;border-radius:4px}.speak-word:active{background:var(--accent-soft)}

/* Spelling */
.spelling-mode-label{width:max-content;margin:8px auto 11px;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:650}.spelling-prompt{min-height:124px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 5px 12px}.spelling-hint{font-size:11px;color:var(--muted);margin-top:8px}.spelling-audio{width:36px;height:36px;margin-top:10px;border:1px solid rgba(24,120,245,.13);border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;padding:0}.spelling-audio svg{width:18px;height:18px}.recall-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.recall-input{height:48px;border:1px solid var(--hair-strong);border-radius:14px;background:#fff;padding:0 13px;outline:none;font-size:15px}.recall-input:focus{border-color:rgba(24,120,245,.45);box-shadow:0 0 0 3px rgba(24,120,245,.08)}.recall-submit{height:48px;padding:0 15px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:13px;font-weight:680}.spelling-feedback-word{margin:5px auto;text-align:center;font-size:30px;font-weight:720;letter-spacing:-.04em;line-height:1.08;text-wrap:balance}.spelling-feedback-zh{text-align:center;color:var(--muted);font-size:12px;margin-bottom:9px}

.toast{position:fixed;left:50%;bottom:calc(76px + var(--safe-bottom));transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:rgba(19,31,50,.92);color:#fff;font-size:11px;opacity:0;pointer-events:none;z-index:180;transition:opacity .14s ease}.toast.show{opacity:1}

/* Compact / short screens */
@media(max-width:380px){.app{padding-left:14px;padding-right:14px}.page-title{font-size:31px}.stats{gap:7px}.stat{height:86px;padding:11px}.stat b{font-size:24px}.spelling-card{grid-template-columns:42px minmax(0,1fr) auto;gap:8px;padding:10px}.spelling-mark{width:39px;height:39px}.spelling-copy span{font-size:10px}.select{width:160px}.segment{min-width:128px}.setting{min-height:54px}.quiz-card{padding:14px 12px 12px}.term{font-size:32px}.term.medium{font-size:28px}.term.long{font-size:24px}.option{min-height:50px}.word-manage button{height:36px}.tab-shell{width:min(278px,calc(100vw - 34px))}}
@media(max-height:740px){.app{padding-top:11px}.page-head{margin-bottom:13px}.home-start{margin-bottom:12px}.primary{height:48px}.stats{margin-bottom:12px}.stat{height:84px}.spelling-card{margin-bottom:16px}.settings-grid{gap:13px}.section-title{font-size:18px;margin-bottom:7px}.setting{min-height:52px}.study{padding-top:6px}.study-top{height:42px}.stage{margin:4px 0 7px}.prompt{min-height:105px;padding:5px 4px 10px}.option{min-height:48px}.quiz-card{padding-top:12px}.word-manage{margin-top:8px;padding-top:8px}.lesson-card{padding-top:15px}.lesson-block{margin-top:11px;padding-top:11px}.continue{margin-top:14px;height:44px}}
@media(min-width:600px){.app{padding-left:24px;padding-right:24px}.settings-grid{grid-template-columns:1fr 1fr}.page-title{font-size:36px}.review-overview,.wrong-filter,.wrong-list,.manage-inline-list{max-width:620px}.study{padding-left:22px;padding-right:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== Materia Lex v5 mobile polish ===== */
:root{--top-breath:46px;--bottom-room:126px}
.app{padding:var(--top-breath) 16px calc(var(--bottom-room) + var(--safe-bottom));}

/* ===== MatLex v10.2 — unified geometry, hierarchy and navigation ===== */
:root{
  --v102-title:30px; --v102-title-w:710;
  --v102-section:19px; --v102-section-w:660;
  --v102-card-title:17px; --v102-card-w:640;
  --v102-body:14px; --v102-caption:11.5px;

  --v102-r-xl:25px; --v102-r-lg:21px; --v102-r-md:16px; --v102-r-sm:13px;
  --v102-glass:linear-gradient(145deg,rgba(255,255,255,.56),rgba(240,248,255,.34));
  --v102-line:rgba(255,255,255,.88);
  --v102-shadow:inset 0 1px 0 rgba(255,255,255,.98),0 8px 22px rgba(44,69,98,.055);
  --v102-ease:cubic-bezier(.2,.78,.24,1);
}
html,body,button,input,textarea,select{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif!important}
body{font-weight:400}

/* All first-level module pages start at the same visual height. */
.app{padding-top:66px!important}
.v10-module-scroll{padding-top:66px!important;padding-left:16px!important;padding-right:16px!important;padding-bottom:calc(128px + var(--android-bottom-inset,0px) + env(safe-area-inset-bottom))!important}
.page-head,.v10-topbar{height:50px!important;min-height:50px!important;margin:0 2px 22px!important;align-items:center!important}
.page-title,.v10-topbar h1{font-size:var(--v102-title)!important;line-height:1.08!important;font-weight:var(--v102-title-w)!important;letter-spacing:-.038em!important;color:var(--v102-ink)!important;white-space:nowrap!important;overflow:visible!important;text-overflow:clip!important}
.v10-topbar{display:grid!important;grid-template-columns:46px minmax(0,1fr) 46px!important;gap:12px!important}
.v10-topbar h1{align-self:center!important}
.v101-more{display:none!important}

/* One back-arrow geometry everywhere. */
.v10-back,.v10-module-back-inline{width:46px!important;height:46px!important;border-radius:16px!important;font-size:0!important;position:relative!important;background:rgba(255,255,255,.55)!important;border:1px solid rgba(255,255,255,.9)!important;box-shadow:var(--v102-shadow)!important}
.v10-back::before,.v10-module-back-inline::before{content:"";width:10px;height:10px;border-left:2px solid #26364a;border-bottom:2px solid #26364a;transform:rotate(45deg);position:absolute;left:19px;top:17px;border-radius:1px}

/* Standardized forward/down chevrons. */
.library-chevron,.sound-summary-chevron,.v10-module-arrow,.v101-library-entry .chev,.v101-filter-row .chev{font-size:0!important;width:20px!important;height:20px!important;display:inline-block!important;position:relative!important;flex:none!important;color:#8393a7!important}
.library-chevron::before,.v10-module-arrow::before,.v101-library-entry .chev::before{content:"";position:absolute;width:8px;height:8px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg);left:4px;top:5px;border-radius:1px}
.sound-summary-chevron::before,.v101-filter-row .chev::before{content:"";position:absolute;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);left:4px;top:3px;border-radius:1px}
.sound-disclosure[open] .sound-summary-chevron::before{transform:rotate(225deg);top:8px}

/* Typography/hierarchy aligned between English, Interview and Concepts. */
.section-title{font-size:var(--v102-section)!important;font-weight:var(--v102-section-w)!important}
.v101-hero{border-radius:var(--v102-r-xl)!important;background:var(--v102-glass)!important;box-shadow:var(--v102-shadow)!important;padding:17px!important}
.v101-hero-label,.v10-list-card .cat,.v101-row-status,.v101-stat span,.v101-library-entry small{font-size:var(--v102-caption)!important;font-weight:500!important;color:var(--v102-sub)!important}
.v101-hero strong{font-size:29px!important;font-weight:680!important;color:var(--v102-ink)!important}
.v101-primary{height:46px!important;border-radius:var(--v102-r-md)!important;font-size:14px!important;font-weight:650!important}
.v101-stats{gap:8px!important;margin-bottom:14px!important}.v101-stat{height:72px!important;border-radius:var(--v102-r-lg)!important;background:rgba(255,255,255,.48)!important;padding:11px!important}.v101-stat strong{font-size:22px!important;font-weight:660!important;color:var(--v102-ink)!important}
.v101-library-entry{height:68px!important;border-radius:var(--v102-r-xl)!important;background:rgba(255,255,255,.48)!important;box-shadow:var(--v102-shadow)!important;padding:0 17px!important}.v101-library-entry b{font-size:16px!important;font-weight:650!important}.v101-library-entry svg{width:24px!important;height:24px!important}
.v10-list{gap:9px!important}.v10-list-card{border-radius:var(--v102-r-lg)!important;background:rgba(255,255,255,.55)!important;box-shadow:var(--v102-shadow)!important;padding:15px 16px!important}.v10-list-card h3{font-size:var(--v102-card-title)!important;line-height:1.44!important;font-weight:var(--v102-card-w)!important;letter-spacing:-.015em!important;color:var(--v102-ink)!important;overflow-wrap:anywhere!important}.v10-list-card p{font-size:var(--v102-body)!important;line-height:1.65!important;font-weight:430!important;color:#55677d!important;margin-top:8px!important}.v101-en{font-size:13px!important;font-weight:500!important;color:#8190a3!important}.v101-clamp{display:block!important;overflow:visible!important;-webkit-line-clamp:unset!important}
.v101-filter-row{min-height:50px!important;height:auto!important;border-radius:var(--v102-r-md)!important;padding:10px 14px!important;background:rgba(255,255,255,.5)!important}.v101-filter-row .label{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;line-height:1.35!important;font-size:13.5px!important;font-weight:600!important}
.v10-search{height:48px!important;border-radius:var(--v102-r-md)!important;font-size:14px!important;font-weight:450!important}.v101-manage-title{font-size:16px!important;font-weight:660!important}.v101-tool{font-size:13px!important;font-weight:600!important;border-radius:var(--v102-r-sm)!important}

.tab-shell{display:none!important}
body.v102-english-module .tab-shell{display:block!important}

/* Matching module navigation for Interview and Concepts. */
.v102-module-nav{position:fixed;left:50%;bottom:calc(16px + var(--android-bottom-inset,0px) + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(266px,calc(100vw - 58px));height:56px;padding:4px;border-radius:24px;border:1px solid rgba(255,255,255,.9);background:linear-gradient(145deg,rgba(255,255,255,.75),rgba(238,247,255,.52));box-shadow:inset 0 1px 0 #fff,0 9px 24px rgba(41,64,91,.10);-webkit-backdrop-filter:blur(22px) saturate(135%);backdrop-filter:blur(22px) saturate(135%);display:grid;grid-template-columns:repeat(3,1fr);z-index:2780}
.v102-module-nav::before{content:"";position:absolute;left:4px;top:4px;width:calc((100% - 8px)/3);height:48px;border-radius:19px;background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(228,242,255,.66));border:1px solid rgba(255,255,255,.98);box-shadow:inset 0 1px 0 #fff,0 3px 10px rgba(45,72,102,.06);transform:translateX(calc(var(--v102-nav-index,0)*100%));transition:transform .26s var(--v102-ease);pointer-events:none}
.v102-module-nav button{position:relative;z-index:1;border:0;background:transparent;color:#8795a6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9.5px;font-weight:520;padding:0}
.v102-module-nav button.on{color:var(--v102-blue);font-weight:650}.v102-module-nav svg{width:20px;height:20px;display:block}.v102-module-nav button:active{transform:scale(.96)}

/* Compact, useful stat-list sheet instead of full-size cards. */
.v102-stat-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:2px 2px 12px}
.v102-stat-summary div{min-height:58px;padding:10px 12px;border-radius:17px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.88);color:#78879a;font-size:11px;display:flex;flex-direction:column;justify-content:center}
.v102-stat-summary strong{display:block;color:#172335;font-size:20px;font-weight:670;margin-top:2px}
.v102-word-list{display:grid;gap:0;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.36);border-radius:20px;overflow:hidden}

.v102-word-line{display:flex;align-items:center;gap:7px;min-width:0}.v102-word-line b{font-size:16px;line-height:1.25;font-weight:650;color:#172335;overflow-wrap:anywhere}.v102-step{padding:2px 6px;border-radius:999px;background:rgba(29,130,242,.08);color:#1478e9;font-size:10px;font-weight:650;flex:none}.v102-word-zh{font-size:12.5px;line-height:1.4;color:#617185;margin-top:4px}.v102-speak{width:38px;height:38px;border:0;border-radius:13px;background:rgba(29,130,242,.075);color:#1478e9;display:grid;place-items:center}.v102-speak svg{width:18px;height:18px}

.study{padding-top:92px!important}

<script>
const BASE_CARDS=[{"id":1,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"atom","zh":"原子","note":"材料微观结构的基本组成单位","source":"教材主干","example_en":"Atoms are the basic building blocks of materials.","example_zh":"原子是材料的基本组成单元。","pos":"n.","meanings":["原子"],"ipa":""},{"id":2,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"nucleus","zh":"原子核","note":"由质子和中子组成","source":"教材主干","example_en":"The nucleus contains almost all of an atom's mass.","example_zh":"原子核几乎包含了原子的全部质量。","pos":"n.","meanings":["原子核"],"ipa":""},{"id":3,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"proton","zh":"质子","note":"带正电","source":"教材主干","example_en":"The number of protons determines the atomic number of an element.","example_zh":"质子数决定元素的原子序数。","pos":"n.","meanings":["质子"],"ipa":""},{"id":4,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"neutron","zh":"中子","note":"不带电","source":"教材主干","example_en":"Isotopes of the same element have different numbers of neutrons.","example_zh":"同一元素的不同同位素具有不同的中子数。","pos":"n.","meanings":["中子"],"ipa":""},{"id":5,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"electron","zh":"电子","note":"带负电","source":"教材主干","example_en":"Electron transfer and sharing determine how atoms form chemical bonds.","example_zh":"电子的转移与共享决定了原子如何形成化学键。","pos":"n.","meanings":["电子"],"ipa":""},{"id":6,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"valence electron","zh":"价电子","note":"决定许多化学与键合行为","source":"教材主干","example_en":"Valence electrons largely control the bonding behavior of an atom.","example_zh":"价电子在很大程度上决定原子的成键行为。","pos":"n. phr.","meanings":["价电子"],"ipa":""},{"id":7,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"electron configuration","zh":"电子排布","note":"核外电子的排列方式","source":"教材主干","example_en":"Electron configuration helps explain periodic trends in chemical behavior.","example_zh":"电子排布有助于解释元素化学性质的周期性变化。","pos":"n. phr.","meanings":["电子排布"],"ipa":""},{"id":8,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"principal quantum number","zh":"主量子数","note":"描述电子层级","source":"教材主干","example_en":"The principal quantum number identifies the main energy level of an electron.","example_zh":"主量子数表示电子所在的主能级。","pos":"n. phr.","meanings":["主量子数"],"ipa":""},{"id":9,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"Pauli exclusion principle","zh":"泡利不相容原理","note":"同一原子中两个电子不能具有完全相同的四个量子数","source":"教材主干","example_en":"The Pauli exclusion principle prevents two electrons in one atom from sharing all four quantum numbers.","example_zh":"泡利不相容原理规定同一原子中两个电子不能具有完全相同的四个量子数。","pos":"n. phr.","meanings":["泡利不相容原理"],"ipa":""},{"id":10,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"Hund's rule","zh":"洪特规则","note":"同能轨道先单占再配对","source":"教材主干","example_en":"Hund's rule predicts that degenerate orbitals fill singly before electron pairing occurs.","example_zh":"洪特规则指出简并轨道先单占后配对。","pos":"n. phr.","meanings":["洪特规则"],"ipa":""},{"id":11,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"periodic table","zh":"元素周期表","note":"元素性质呈周期性变化","source":"教材主干","example_en":"The periodic table groups elements with similar valence-electron configurations and properties.","example_zh":"元素周期表把价电子排布和性质相近的元素归在相应位置。","pos":"n. phr.","meanings":["元素周期表"],"ipa":""},{"id":12,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"atomic number","zh":"原子序数","note":"等于核内质子数","source":"教材主干","example_en":"Silver has an atomic number of 47 because each silver atom contains 47 protons.","example_zh":"银的原子序数为47，因为每个银原子含有47个质子。","pos":"n. phr.","meanings":["原子序数"],"ipa":""},{"id":13,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"atomic radius","zh":"原子半径","note":"晶体结构尺寸关系常用参数","source":"教材主干","example_en":"Atomic radius affects interatomic spacing and many trends in crystal structure.","example_zh":"原子半径会影响原子间距以及晶体结构中的许多规律。","pos":"n. phr.","meanings":["原子半径"],"ipa":""},{"id":14,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"interatomic bonding","zh":"原子间键合","note":"材料结构与性能的基础","source":"教材主干","example_en":"Interatomic bonding strongly influences stiffness, melting point, and electrical behavior.","example_zh":"原子间键合会显著影响刚度、熔点和电学行为。","pos":"n. phr.","meanings":["原子间键合"],"ipa":""},{"id":15,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"primary bond","zh":"主键","note":"金属键、离子键、共价键","source":"教材主干","example_en":"Metallic, ionic, and covalent bonds are the main types of primary bonds in materials.","example_zh":"金属键、离子键和共价键是材料中主要的主键类型。","pos":"n. phr.","meanings":["主键"],"ipa":""},{"id":16,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"secondary bond","zh":"次级键","note":"范德华力和氢键等","source":"教材主干","example_en":"Secondary bonds are weaker than primary bonds but can strongly affect polymers and molecular solids.","example_zh":"次级键弱于主键，但会显著影响聚合物和分子晶体的性质。","pos":"n. phr.","meanings":["次级键"],"ipa":""},{"id":17,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"metallic bond","zh":"金属键","note":"正离子实与共有化价电子之间的结合","source":"教材主干","example_en":"Metallic bonding helps explain the good electrical conductivity of metals.","example_zh":"金属键有助于解释金属良好的导电性。","pos":"n. phr.","meanings":["金属键"],"ipa":""},{"id":18,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"ionic bond","zh":"离子键","note":"电子转移后正负离子的静电吸引","source":"教材主干","example_en":"An ionic bond is formed by electrostatic attraction between oppositely charged ions.","example_zh":"离子键由带相反电荷离子之间的静电吸引形成。","pos":"n. phr.","meanings":["离子键"],"ipa":""},{"id":19,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"covalent bond","zh":"共价键","note":"相邻原子共享电子形成的键","source":"教材主干","example_en":"Covalent bonds have strong directionality in many materials.","example_zh":"许多材料中的共价键具有明显方向性。","pos":"n. phr.","meanings":["共价键"],"ipa":""},{"id":20,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"van der Waals force","zh":"范德华力","note":"由偶极相互作用产生的较弱作用力","source":"教材主干","example_en":"Van der Waals forces help hold weakly bonded molecular layers together.","example_zh":"范德华力有助于维持弱键合分子层之间的结合。","pos":"n. phr.","meanings":["范德华力"],"ipa":""},{"id":21,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"hydrogen bond","zh":"氢键","note":"涉及氢原子的较强分子间作用","source":"教材主干","example_en":"Hydrogen bonding can raise the strength and thermal stability of some polymers.","example_zh":"氢键能够提高某些聚合物的强度和热稳定性。","pos":"n. phr.","meanings":["氢键"],"ipa":""},{"id":22,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"bond energy","zh":"键能","note":"破坏化学键所需的能量尺度","source":"教材主干","example_en":"A high bond energy usually corresponds to a strong bond and a high melting temperature.","example_zh":"较高的键能通常对应较强的化学键和较高的熔化温度。","pos":"n. phr.","meanings":["键能"],"ipa":""},{"id":23,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"electronegativity","zh":"电负性","note":"原子吸引成键电子的能力","source":"教材主干","example_en":"A large electronegativity difference between two atoms favors ionic bonding.","example_zh":"两个原子之间较大的电负性差异有利于形成离子键。","pos":"n.","meanings":["电负性"],"ipa":""},{"id":24,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"polarization","zh":"极化","note":"正负电荷中心发生相对位移","source":"教材主干","example_en":"Polarization describes the displacement of positive and negative charge centers in an electric field.","example_zh":"极化描述电场中正负电荷中心发生相对位移的现象。","pos":"n.","meanings":["极化"],"ipa":""},{"id":25,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"dipole","zh":"偶极","note":"正负电荷中心分离形成的电偶极","source":"教材主干","example_en":"A permanent dipole forms when positive and negative charge centers do not coincide.","example_zh":"当正负电荷中心不重合时会形成永久偶极。","pos":"n.","meanings":["偶极"],"ipa":""},{"id":763,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"isotope","zh":"同位素","note":"同位素：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Isotope is a standard term used when discussing atomic bonding and electronic structure.","example_zh":"“同位素”是讨论原子键合和电子结构时的常用术语。","pos":"n.","meanings":["同位素"],"ipa":""},{"id":764,"category":"01 原子结构与键合","type":"phrase","typeLabel":"短语","en":"atomic mass","zh":"原子质量","note":"原子质量：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Atomic mass is a standard term used when discussing atomic bonding and electronic structure.","example_zh":"“原子质量”是讨论原子键合和电子结构时的常用术语。","pos":"n. phr.","meanings":["原子质量"],"ipa":""},{"id":765,"category":"01 原子结构与键合","type":"phrase","typeLabel":"短语","en":"relative atomic mass","zh":"相对原子质量","note":"相对原子质量：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Relative atomic mass is a standard term used when discussing atomic bonding and electronic structure.","example_zh":"“相对原子质量”是讨论原子键合和电子结构时的常用术语。","pos":"n. phr.","meanings":["相对原子质量"],"ipa":""},{"id":766,"category":"01 原子结构与键合","type":"phrase","typeLabel":"短语","en":"electron shell","zh":"电子层","note":"电子层：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Electron shell is a standard term used when discussing atomic bonding and electronic structure.","example_zh":"“电子层”是讨论原子键合和电子结构时的常用术语。","pos":"n. phr.","meanings":["电子层"],"ipa":""},{"id":767,"category":"01 原子结构与键合","type":"phrase","typeLabel":"短语","en":"electron orbital","zh":"电子轨道","note":"电子轨道：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Electron orbital is a standard term used when discussing atomic bonding and electronic structure.","example_zh":"“电子轨道”是讨论原子键合和电子结构时的常用术语。","pos":"n. phr.","meanings":["电子轨道"],"ipa":""},{"id":768,"category":"01 原子结构与键合","type":"phrase","typeLabel":"短语","en":"ground state","zh":"基态","note":"基态：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Ground state is a standard term used when discussing atomic bonding and electronic structure.","example_zh":"“基态”是讨论原子键合和电子结构时的常用术语。","pos":"n. phr.","meanings":["基态"],"ipa":""},{"id":769,"category":"01 原子结构与键合","type":"phrase","typeLabel":"短语","en":"excited state","zh":"激发态","note":"激发态：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Excited state is a standard term used when discussing atomic bonding and electronic structure.","example_zh":"“激发态”是讨论原子键合和电子结构时的常用术语。","pos":"n. phr.","meanings":["激发态"],"ipa":""},{"id":770,"category":"01 原子结构与键合","type":"phrase","typeLabel":"短语","en":"ionization energy","zh":"电离能","note":"电离能：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Changes in ionization energy can provide useful evidence when interpreting atomic bonding and electronic structure.","example_zh":"“电离能”的变化可为分析原子键合和电子结构提供有用证据。","pos":"n. phr.","meanings":["电离能"],"ipa":""},{"id":771,"category":"01 原子结构与键合","type":"phrase","typeLabel":"短语","en":"electron affinity","zh":"电子亲和能","note":"电子亲和能：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Electron affinity is a standard term used when discussing atomic bonding and electronic structure.","example_zh":"“电子亲和能”是讨论原子键合和电子结构时的常用术语。","pos":"n. phr.","meanings":["电子亲和能"],"ipa":""},{"id":772,"category":"01 原子结构与键合","type":"phrase","typeLabel":"短语","en":"cohesive energy","zh":"内聚能","note":"内聚能：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Changes in cohesive energy can provide useful evidence when interpreting atomic bonding and electronic structure.","example_zh":"“内聚能”的变化可为分析原子键合和电子结构提供有用证据。","pos":"n. phr.","meanings":["内聚能"],"ipa":""},{"id":773,"category":"01 原子结构与键合","type":"phrase","typeLabel":"短语","en":"bond length","zh":"键长","note":"键长：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Changes in bond length can provide useful evidence when interpreting atomic bonding and electronic structure.","example_zh":"“键长”的变化可为分析原子键合和电子结构提供有用证据。","pos":"n. phr.","meanings":["键长"],"ipa":""},{"id":774,"category":"01 原子结构与键合","type":"phrase","typeLabel":"短语","en":"bond angle","zh":"键角","note":"键角：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Changes in bond angle can provide useful evidence when interpreting atomic bonding and electronic structure.","example_zh":"“键角”的变化可为分析原子键合和电子结构提供有用证据。","pos":"n. phr.","meanings":["键角"],"ipa":""},{"id":775,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"polarizability","zh":"极化率","note":"极化率：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Polarizability is a standard term used when discussing atomic bonding and electronic structure.","example_zh":"“极化率”是讨论原子键合和电子结构时的常用术语。","pos":"n.","meanings":["极化率"],"ipa":""},{"id":776,"category":"01 原子结构与键合","type":"phrase","typeLabel":"短语","en":"lattice energy","zh":"晶格能","note":"晶格能：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Changes in lattice energy can provide useful evidence when interpreting atomic bonding and electronic structure.","example_zh":"“晶格能”的变化可为分析原子键合和电子结构提供有用证据。","pos":"n. phr.","meanings":["晶格能"],"ipa":""},{"id":777,"category":"01 原子结构与键合","type":"term","typeLabel":"单词","en":"hybridization","zh":"杂化","note":"杂化：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Hybridization is a standard term used when discussing atomic bonding and electronic structure.","example_zh":"“杂化”是讨论原子键合和电子结构时的常用术语。","pos":"n.","meanings":["杂化"],"ipa":""},{"id":778,"category":"01 原子结构与键合","type":"phrase","typeLabel":"短语","en":"coordination polyhedron","zh":"配位多面体","note":"配位多面体：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Coordination polyhedron is a standard term used when discussing atomic bonding and electronic structure.","example_zh":"“配位多面体”是讨论原子键合和电子结构时的常用术语。","pos":"n. phr.","meanings":["配位多面体"],"ipa":""},{"id":779,"category":"01 原子结构与键合","type":"phrase","typeLabel":"短语","en":"ionic radius","zh":"离子半径","note":"离子半径：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Changes in ionic radius can provide useful evidence when interpreting atomic bonding and electronic structure.","example_zh":"“离子半径”的变化可为分析原子键合和电子结构提供有用证据。","pos":"n. phr.","meanings":["离子半径"],"ipa":""},{"id":26,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"crystal","zh":"晶体","note":"具有长程有序结构","source":"教材主干","example_en":"A crystal has a long-range ordered atomic structure.","example_zh":"晶体具有长程有序的原子结构。","pos":"n.","meanings":["晶体"],"ipa":""},{"id":27,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"crystalline material","zh":"晶态材料","note":"原子具有周期性排列","source":"教材主干","example_en":"A crystalline metal produces sharp diffraction peaks because its atoms repeat periodically over long distances.","example_zh":"晶态金属由于原子在长距离上周期性重复，会产生尖锐的衍射峰。","pos":"n. phr.","meanings":["晶态材料"],"ipa":""},{"id":28,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"amorphous material","zh":"非晶态材料","note":"缺乏长程周期性","source":"教材主干","example_en":"Metallic glass is an amorphous material because it lacks long-range periodic atomic order.","example_zh":"金属玻璃属于非晶态材料，因为它缺乏长程周期性的原子排列。","pos":"n. phr.","meanings":["非晶态材料"],"ipa":""},{"id":29,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"long-range order","zh":"长程有序","note":"较大尺度上的周期性排列","source":"教材主干","example_en":"Long-range order allows a crystal lattice to repeat over many unit cells.","example_zh":"长程有序使晶体点阵能够跨越许多晶胞周期性重复。","pos":"n. phr.","meanings":["长程有序"],"ipa":""},{"id":30,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"short-range order","zh":"短程有序","note":"近邻原子存在一定有序关系","source":"教材主干","example_en":"A glass can retain short-range order among neighboring atoms even without a periodic lattice.","example_zh":"玻璃即使没有周期点阵，近邻原子之间仍可保持短程有序。","pos":"n. phr.","meanings":["短程有序"],"ipa":""},{"id":31,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"lattice","zh":"点阵","note":"晶体周期性的抽象几何表示","source":"教材主干","example_en":"A lattice represents the periodic positions that are repeated throughout a crystal.","example_zh":"点阵表示在晶体中周期性重复的一组几何位置。","pos":"n.","meanings":["点阵"],"ipa":""},{"id":32,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"space lattice","zh":"空间点阵","note":"三维周期性点阵","source":"教材主干","example_en":"A space lattice extends the periodic arrangement of lattice points in three dimensions.","example_zh":"空间点阵把阵点的周期性排列扩展到三维空间。","pos":"n. phr.","meanings":["空间点阵"],"ipa":""},{"id":33,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"lattice point","zh":"阵点","note":"点阵中的等价几何点","source":"教材主干","example_en":"Every lattice point in an ideal lattice has an equivalent surrounding environment.","example_zh":"理想点阵中的每个阵点都具有等价的周围环境。","pos":"n. phr.","meanings":["阵点"],"ipa":""},{"id":34,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"basis","zh":"基元","note":"附着在每个阵点上的原子或原子组","source":"教材主干","example_en":"Placing the same atomic basis on every lattice point generates a crystal structure.","example_zh":"在每个阵点上放置相同基元即可构成晶体结构。","pos":"n.","meanings":["基元"],"ipa":""},{"id":35,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"crystal structure","zh":"晶体结构","note":"点阵加基元","source":"教材主干","example_en":"The crystal structure of FCC copper can be described by an FCC lattice and a one-atom basis.","example_zh":"FCC铜的晶体结构可以由面心立方点阵和单原子基元描述。","pos":"n. phr.","meanings":["晶体结构"],"ipa":""},{"id":36,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"unit cell","zh":"晶胞","note":"表征晶体周期性的基本重复单元","source":"教材主干","example_en":"A unit cell is the basic repeating unit of a crystal.","example_zh":"晶胞是晶体的基本重复单元。","pos":"n. phr.","meanings":["晶胞"],"ipa":""},{"id":37,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"primitive cell","zh":"初基晶胞","note":"有效包含一个阵点的最小晶胞","source":"教材主干","example_en":"A primitive cell contains the minimum volume needed to reproduce the entire lattice by translation.","example_zh":"初基晶胞包含通过平移复制整个点阵所需的最小体积。","pos":"n. phr.","meanings":["初基晶胞"],"ipa":""},{"id":38,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"lattice parameter","zh":"点阵常数","note":"描述晶胞尺寸和形状的参数","source":"教材主干","example_en":"The lattice parameter of FCC silver changes slightly with temperature because of thermal expansion.","example_zh":"由于热膨胀，FCC银的点阵常数会随温度发生轻微变化。","pos":"n. phr.","meanings":["点阵常数"],"ipa":""},{"id":39,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"Bravais lattice","zh":"布拉维点阵","note":"十四种三维布拉维点阵","source":"教材主干","example_en":"The fourteen Bravais lattices classify all possible three-dimensional translational lattices.","example_zh":"十四种布拉维点阵涵盖了三维平移点阵的全部可能类型。","pos":"n. phr.","meanings":["布拉维点阵"],"ipa":""},{"id":40,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"crystal system","zh":"晶系","note":"按对称性划分的七类晶系","source":"教材主干","example_en":"Cubic, tetragonal, and hexagonal are three of the seven crystal systems.","example_zh":"立方、四方和六方是七种晶系中的三种。","pos":"n. phr.","meanings":["晶系"],"ipa":""},{"id":41,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"crystallographic direction","zh":"晶向","note":"晶体中的方向","source":"教材主干","example_en":"In a cubic crystal, the [110] crystallographic direction runs along a face diagonal.","example_zh":"在立方晶体中，[110]晶向沿着一个面的对角线方向。","pos":"n. phr.","meanings":["晶向"],"ipa":""},{"id":42,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"direction indices","zh":"晶向指数","note":"用整数标记晶向","source":"教材主干","example_en":"Direction indices such as [111] specify a crystallographic direction using the smallest integer components.","example_zh":"[111]这类晶向指数用最小整数分量表示晶体中的方向。","pos":"n. phr.","meanings":["晶向指数"],"ipa":""},{"id":43,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"crystallographic plane","zh":"晶面","note":"晶体中的平面","source":"教材主干","example_en":"A crystallographic plane cuts the lattice at positions determined by its orientation and spacing.","example_zh":"晶面的取向和间距决定它在点阵中的截取位置。","pos":"n. phr.","meanings":["晶面"],"ipa":""},{"id":44,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"Miller indices","zh":"米勒指数","note":"晶面指数的标准表示","source":"教材主干","example_en":"Miller indices (111) identify one family member of close-packed planes in an FCC crystal.","example_zh":"米勒指数(111)可表示FCC晶体中的一个密排晶面。","pos":"n. phr.","meanings":["米勒指数"],"ipa":""},{"id":45,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"family of directions","zh":"晶向族","note":"对称等价晶向的集合","source":"教材主干","example_en":"The family of directions ⟨110⟩ contains symmetry-equivalent directions in a cubic crystal.","example_zh":"在立方晶体中，⟨110⟩晶向族包含一组对称等价的晶向。","pos":"n. phr.","meanings":["晶向族"],"ipa":""},{"id":46,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"family of planes","zh":"晶面族","note":"对称等价晶面的集合","source":"教材主干","example_en":"The family of planes {111} contains symmetry-equivalent planes in an FCC crystal.","example_zh":"FCC晶体中的{111}晶面族包含一组对称等价晶面。","pos":"n. phr.","meanings":["晶面族"],"ipa":""},{"id":47,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"stereographic projection","zh":"极射投影","note":"表达晶体取向关系的方法","source":"教材主干","example_en":"A stereographic projection can display the angular relationship between crystal planes on a two-dimensional chart.","example_zh":"极射投影可以在二维图上表示晶面之间的角度关系。","pos":"n. phr.","meanings":["极射投影"],"ipa":""},{"id":48,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"symmetry","zh":"对称性","note":"晶体的重要几何特征","source":"教材主干","example_en":"Crystal symmetry determines which directions and planes are equivalent under symmetry operations.","example_zh":"晶体对称性决定哪些晶向和晶面在对称操作下彼此等价。","pos":"n.","meanings":["对称性"],"ipa":""},{"id":49,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"coordination number","zh":"配位数","note":"一个原子的最近邻原子数","source":"教材主干","example_en":"Each atom in an ideal FCC structure has a coordination number of 12.","example_zh":"理想FCC结构中，每个原子的配位数为12。","pos":"n. phr.","meanings":["配位数"],"ipa":""},{"id":50,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"atomic packing factor","zh":"原子堆积因子","note":"晶胞中原子所占体积分数","source":"教材主干","example_en":"FCC and HCP structures have an atomic packing factor of 0.74, while BCC is about 0.68.","example_zh":"FCC和HCP结构的原子堆积因子为0.74，而BCC约为0.68。","pos":"n. phr.","meanings":["原子堆积因子"],"ipa":""},{"id":51,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"close-packed plane","zh":"密排面","note":"原子面密度最高的晶面","source":"教材主干","example_en":"The {111} planes are the close-packed planes in an FCC crystal.","example_zh":"在FCC晶体中，{111}晶面是密排面。","pos":"n. phr.","meanings":["密排面"],"ipa":""},{"id":52,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"close-packed direction","zh":"密排方向","note":"原子线密度最高的方向","source":"教材主干","example_en":"The ⟨110⟩ directions are close-packed directions in FCC metals.","example_zh":"在FCC金属中，⟨110⟩晶向是密排方向。","pos":"n. phr.","meanings":["密排方向"],"ipa":""},{"id":53,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"face-centered cubic","zh":"面心立方","note":"FCC","source":"教材主干","example_en":"Silver has a face-centered cubic structure in its bulk form.","example_zh":"块体银具有面心立方结构。","pos":"n. phr.","meanings":["面心立方"],"ipa":""},{"id":54,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"body-centered cubic","zh":"体心立方","note":"BCC","source":"教材主干","example_en":"Ferrite has a body-centered cubic structure.","example_zh":"铁素体具有体心立方结构。","pos":"n. phr.","meanings":["体心立方"],"ipa":""},{"id":55,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"hexagonal close-packed","zh":"密排六方","note":"HCP","source":"教材主干","example_en":"HCP and FCC are both close-packed structures.","example_zh":"HCP和FCC都是密排结构。","pos":"n. phr.","meanings":["密排六方"],"ipa":""},{"id":56,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"stacking sequence","zh":"堆垛序列","note":"密排原子层的排列顺序","source":"教材主干","example_en":"FCC and HCP differ mainly in their stacking sequences.","example_zh":"FCC和HCP的主要区别之一是堆垛序列不同。","pos":"n. phr.","meanings":["堆垛序列"],"ipa":""},{"id":57,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"ABC stacking","zh":"ABC堆垛","note":"FCC密排层典型序列","source":"教材主干","example_en":"ABC stacking of close-packed atomic layers produces the FCC structure.","example_zh":"密排原子层按ABC顺序堆垛可形成FCC结构。","pos":"n. phr.","meanings":["ABC堆垛"],"ipa":""},{"id":58,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"AB stacking","zh":"AB堆垛","note":"HCP密排层典型序列","source":"教材主干","example_en":"AB stacking of close-packed layers produces the ideal HCP structure.","example_zh":"密排原子层按AB顺序堆垛可形成理想HCP结构。","pos":"n. phr.","meanings":["AB堆垛"],"ipa":""},{"id":59,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"tetrahedral site","zh":"四面体间隙","note":"由四个近邻原子围成的间隙","source":"教材主干","example_en":"A small interstitial atom can occupy a tetrahedral site surrounded by four host atoms.","example_zh":"小尺寸间隙原子可以占据由四个基体原子围成的四面体间隙。","pos":"n. phr.","meanings":["四面体间隙"],"ipa":""},{"id":60,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"octahedral site","zh":"八面体间隙","note":"由六个近邻原子围成的间隙","source":"教材主干","example_en":"An octahedral site is surrounded by six nearest host atoms.","example_zh":"八面体间隙由六个最近邻基体原子围成。","pos":"n. phr.","meanings":["八面体间隙"],"ipa":""},{"id":61,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"interstitial site","zh":"间隙位置","note":"晶体中可容纳小原子的空隙","source":"教材主干","example_en":"Carbon occupies interstitial sites in iron because carbon atoms are much smaller than iron atoms.","example_zh":"由于碳原子远小于铁原子，碳可以占据铁晶格中的间隙位置。","pos":"n. phr.","meanings":["间隙位置"],"ipa":""},{"id":62,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"polymorphism","zh":"多晶型性","note":"同一物质可具有不同晶体结构","source":"教材主干","example_en":"Polymorphism allows the same compound to crystallize in more than one crystal structure.","example_zh":"多晶型性使同一种化合物能够形成一种以上的晶体结构。","pos":"n.","meanings":["多晶型性"],"ipa":""},{"id":63,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"allotropy","zh":"同素异构","note":"元素具有不同晶体结构","source":"教材主干","example_en":"Iron exhibits allotropy because its stable crystal structure changes from BCC to FCC with temperature.","example_zh":"铁具有同素异构现象，因为其稳定晶体结构会随温度由BCC转变为FCC。","pos":"n.","meanings":["同素异构"],"ipa":""},{"id":64,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"solid solution","zh":"固溶体","note":"溶质原子溶入溶剂晶格形成单相","source":"教材主干","example_en":"A solid solution contains solute atoms dissolved in a solvent lattice.","example_zh":"固溶体中溶质原子溶入溶剂晶格。","pos":"n. phr.","meanings":["固溶体"],"ipa":""},{"id":65,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"substitutional solid solution","zh":"置换固溶体","note":"溶质原子占据溶剂阵点","source":"教材主干","example_en":"In a substitutional solid solution, solute atoms replace host atoms on normal lattice sites.","example_zh":"在置换固溶体中，溶质原子取代正常阵点上的溶剂原子。","pos":"n. phr.","meanings":["置换固溶体"],"ipa":""},{"id":66,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"interstitial solid solution","zh":"间隙固溶体","note":"小溶质原子进入晶格间隙","source":"教材主干","example_en":"Carbon in ferrite forms an interstitial solid solution by occupying small sites in the BCC iron lattice.","example_zh":"铁素体中的碳通过占据BCC铁晶格的小间隙形成间隙固溶体。","pos":"n. phr.","meanings":["间隙固溶体"],"ipa":""},{"id":67,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"intermediate phase","zh":"中间相","note":"合金中位于端际固溶体之间的相","source":"教材主干","example_en":"An intermediate phase can appear between terminal solid solutions in a binary alloy system.","example_zh":"在二元合金系中，中间相可出现在两个端际固溶体之间。","pos":"n. phr.","meanings":["中间相"],"ipa":""},{"id":68,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"intermetallic compound","zh":"金属间化合物","note":"具有一定组成和结构的金属间相","source":"教材主干","example_en":"Intermetallic compounds often have ordered structures and properties distinct from their constituent metals.","example_zh":"金属间化合物通常具有有序结构，其性能与组成它的金属明显不同。","pos":"n. phr.","meanings":["金属间化合物"],"ipa":""},{"id":69,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"ordered solid solution","zh":"有序固溶体","note":"原子呈规则占位","source":"教材主干","example_en":"In an ordered solid solution, different atomic species preferentially occupy specific lattice sites.","example_zh":"在有序固溶体中，不同原子种类优先占据特定阵点。","pos":"n. phr.","meanings":["有序固溶体"],"ipa":""},{"id":70,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"disordered solid solution","zh":"无序固溶体","note":"原子随机占位","source":"教材主干","example_en":"In a disordered solid solution, solute and solvent atoms occupy equivalent lattice sites statistically at random.","example_zh":"在无序固溶体中，溶质与溶剂原子以统计随机方式占据等价阵点。","pos":"n. phr.","meanings":["无序固溶体"],"ipa":""},{"id":71,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"ionic crystal","zh":"离子晶体","note":"以离子键为主要结合方式","source":"教材主干","example_en":"Sodium chloride is an ionic crystal held together mainly by electrostatic attraction between oppositely charged ions.","example_zh":"氯化钠是典型离子晶体，主要依靠异号离子之间的静电吸引结合。","pos":"n. phr.","meanings":["离子晶体"],"ipa":""},{"id":72,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"covalent crystal","zh":"共价晶体","note":"以共价键为主要结合方式","source":"教材主干","example_en":"Diamond is a covalent crystal in which each carbon atom forms strong directional covalent bonds.","example_zh":"金刚石是共价晶体，其中每个碳原子都形成强而具有方向性的共价键。","pos":"n. phr.","meanings":["共价晶体"],"ipa":""},{"id":73,"category":"02 固体结构与晶体学","type":"term","typeLabel":"单词","en":"polymer crystal","zh":"聚合物晶体","note":"高分子链局部规则排列形成的晶态结构","source":"教材主干","example_en":"Polyethylene can form polymer crystals when segments of its long chains pack into ordered regions.","example_zh":"聚乙烯长链的部分链段规则堆积时，可以形成聚合物晶体区域。","pos":"n. phr.","meanings":["聚合物晶体"],"ipa":""},{"id":780,"category":"02 固体结构与晶体学","type":"phrase","typeLabel":"短语","en":"conventional cell","zh":"常规晶胞","note":"常规晶胞：上海交大《材料科学基础》+MIT OCW筛选的常用术语。","source":"上海交大《材料科学基础》+MIT OCW","example_en":"Conventional cell is a standard term used when discussing crystal structure and crystallography.","example_zh":"“常规晶胞”是讨论晶体结构与晶体学时的常用术语。","pos":"n. phr.","meanings":["常规晶胞"],"ipa":""},{"id":781,"cate ","example_zh":"布拉格定律把衍射角与晶面间距联系起来。","pos":"n. phr.","meanings":["布拉格定律"],"ipa":""},{"id":280,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"diffraction peak","zh":"衍射峰","note":"衍射图谱中的峰","source":"985表征课程","example_en":"A shift in the diffraction peak can indicate a change in lattice spacing.","example_zh":"衍射峰位置的移动可能表明晶面间距发生变化。","pos":"n. phr.","meanings":["衍射峰"],"ipa":""},{"id":281,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"diffraction pattern","zh":"衍射图谱","note":"XRD或电子衍射产生的图样","source":"985表征课程","example_en":"The diffraction pattern changed after the phase transformation.","example_zh":"相变发生后，衍射图谱出现了明显变化。","pos":"n. phr.","meanings":["衍射图谱"],"ipa":""},{"id":282,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"phase identification","zh":"物相鉴定","note":"根据衍射或谱学判断相组成","source":"985表征课程","example_en":"Phase identification confirmed the coexistence of two crystalline phases.","example_zh":"物相鉴定确认样品中存在两种晶体相。","pos":"n. phr.","meanings":["物相鉴定"],"ipa":""},{"id":283,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"lattice constant","zh":"点阵常数","note":"可通过衍射数据计算","source":"985表征课程","example_en":"The lattice constant was calculated from the measured diffraction angles.","example_zh":"点阵常数由测得的衍射角计算得到。","pos":"n. phr.","meanings":["点阵常数"],"ipa":""},{"id":284,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"crystallite size","zh":"晶粒/晶畴尺寸","note":"常由峰宽估算纳米晶尺寸","source":"985表征课程","example_en":"The crystallite size decreased after high-energy ball milling.","example_zh":"高能球磨后晶畴尺寸减小。","pos":"n. phr.","meanings":["晶粒/晶畴尺寸"],"ipa":""},{"id":285,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"Scherrer equation","zh":"谢乐公式","note":"由衍射峰宽估算晶粒尺寸","source":"985表征课程","example_en":"The Scherrer equation gives an approximate crystallite size from peak broadening.","example_zh":"谢乐公式可根据衍射峰展宽近似估算晶畴尺寸。","pos":"n. phr.","meanings":["谢乐公式"],"ipa":""},{"id":286,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"scanning electron microscopy","zh":"扫描电子显微镜","note":"SEM","source":"985表征课程","example_en":"Scanning electron microscopy revealed pores and fracture features on the sample surface.","example_zh":"扫描电子显微镜显示了样品表面的孔隙和断裂特征。","pos":"n. phr.","meanings":["扫描电子显微镜"],"ipa":""},{"id":287,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"SEM","zh":"扫描电子显微镜","note":"观察表面形貌和微观组织","source":"985表征课程","example_en":"SEM images showed that the second phase was distributed along grain boundaries.","example_zh":"SEM图像显示第二相主要分布在晶界附近。","pos":"n.","meanings":["扫描电子显微镜"],"ipa":""},{"id":288,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"secondary electron","zh":"二次电子","note":"SEM常用成像信号","source":"985表征课程","example_en":"Secondary electrons provide strong topographic contrast in SEM imaging.","example_zh":"二次电子在SEM成像中能够提供明显的表面形貌衬度。","pos":"n. phr.","meanings":["二次电子"],"ipa":""},{"id":289,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"backscattered electron","zh":"背散射电子","note":"与平均原子序数相关","source":"985表征课程","example_en":"Backscattered-electron contrast can highlight regions with different average atomic numbers.","example_zh":"背散射电子衬度可突出平均原子序数不同的区域。","pos":"n. phr.","meanings":["背散射电子"],"ipa":""},{"id":290,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"transmission electron microscopy","zh":"透射电子显微镜","note":"TEM","source":"985表征课程","example_en":"Transmission electron microscopy can reveal nanoscale defects inside a thin specimen.","example_zh":"透射电子显微镜能够揭示薄样品内部的纳米尺度缺陷。","pos":"n. phr.","meanings":["透射电子显微镜"],"ipa":""},{"id":291,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"TEM","zh":"透射电子显微镜","note":"高分辨观察内部微结构","source":"985表征课程","example_en":"TEM can reveal internal microstructural details at high spatial resolution.","example_zh":"TEM能够以较高空间分辨率观察材料内部微观结构。","pos":"n.","meanings":["透射电子显微镜"],"ipa":""},{"id":292,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"high-resolution TEM","zh":"高分辨透射电镜","note":"HRTEM","source":"985表征课程","example_en":"High-resolution TEM can resolve lattice fringes near an interface.","example_zh":"高分辨TEM能够分辨界面附近的晶格条纹。","pos":"n. phr.","meanings":["高分辨透射电镜"],"ipa":""},{"id":293,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"STEM","zh":"扫描透射电子显微镜","note":"扫描式TEM","source":"985表征课程","example_en":"STEM was used to scan the interface while collecting compositional information.","example_zh":"STEM用于扫描界面并同步获取成分信息。","pos":"n.","meanings":["扫描透射电子显微镜"],"ipa":""},{"id":294,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"selected-area electron diffraction","zh":"选区电子衍射","note":"SAED","source":"985表征课程","example_en":"Selected-area electron diffraction helped determine the local crystal structure.","example_zh":"选区电子衍射有助于确定局部晶体结构。","pos":"n. phr.","meanings":["选区电子衍射"],"ipa":""},{"id":295,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"electron diffraction","zh":"电子衍射","note":"利用电子波获取晶体结构信息","source":"985表征课程","example_en":"Electron diffraction confirmed that the nanoparticle was crystalline.","example_zh":"电子衍射证实该纳米颗粒具有晶体结构。","pos":"n. phr.","meanings":["电子衍射"],"ipa":""},{"id":296,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"energy-dispersive X-ray spectroscopy","zh":"能量色散X射线谱","note":"EDS/EDX","source":"985表征课程","example_en":"Energy-dispersive X-ray spectroscopy showed that oxygen was enriched near the surface.","example_zh":"能量色散X射线谱显示氧元素在表面附近富集。","pos":"n. phr.","meanings":["能量色散X射线谱"],"ipa":""},{"id":297,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"EDS","zh":"能谱分析","note":"用于元素成分分析","source":"985表征课程","example_en":"EDS is often combined with SEM to analyze elemental composition.","example_zh":"EDS常与SEM结合进行元素成分分析。","pos":"n.","meanings":["能谱分析"],"ipa":""},{"id":298,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"elemental mapping","zh":"元素面分布","note":"显示元素空间分布","source":"985表征课程","example_en":"Elemental mapping revealed whether the alloying elements were uniformly distributed.","example_zh":"元素面分布显示了合金元素是否分布均匀。","pos":"n. phr.","meanings":["元素面分布"],"ipa":""},{"id":299,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"electron energy-loss spectroscopy","zh":"电子能量损失谱","note":"EELS","source":"985表征课程","example_en":"EELS can probe local composition and electronic structure in the TEM.","example_zh":"EELS可在TEM中探测局部成分和电子结构。","pos":"n. phr.","meanings":["电子能量损失谱"],"ipa":""},{"id":300,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"X-ray photoelectron spectroscopy","zh":"X射线光电子能谱","note":"XPS","source":"985表征课程","example_en":"XPS was used to distinguish different oxidation states on the surface.","example_zh":"XPS用于区分样品表面不同的氧化态。","pos":"n. phr.","meanings":["X射线光电子能谱"],"ipa":""},{"id":301,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"XPS","zh":"X射线光电子能谱","note":"分析表面元素组成和化学态","source":"985表征课程","example_en":"XPS can provide information about surface composition and chemical states.","example_zh":"XPS能够提供表面元素组成和化学态信息。","pos":"n.","meanings":["X射线光电子能谱"],"ipa":""},{"id":302,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"binding energy","zh":"结合能","note":"XPS关键横坐标","source":"985表征课程","example_en":"A change in binding energy can indicate a different chemical environment.","example_zh":"结合能的变化可能表示化学环境发生改变。","pos":"n. phr.","meanings":["结合能"],"ipa":""},{"id":303,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"Auger electron spectroscopy","zh":"俄歇电子能谱","note":"AES","source":"985表征课程","example_en":"Auger electron spectroscopy is useful for surface-sensitive elemental analysis.","example_zh":"俄歇电子能谱适用于表面敏感的元素分析。","pos":"n. phr.","meanings":["俄歇电子能谱"],"ipa":""},{"id":304,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"Raman spectroscopy","zh":"拉曼光谱","note":"振动光谱表征方法","source":"985表征课程","example_en":"Raman spectroscopy can reveal vibrational and structural information.","example_zh":"拉曼光谱能够提供振动和结构信息。","pos":"n. phr.","meanings":["拉曼光谱"],"ipa":""},{"id":305,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"Raman shift","zh":"拉曼位移","note":"拉曼谱横坐标","source":"985表征课程","example_en":"The Raman shift reflects the energy of a vibrational mode in the material.","example_zh":"拉曼位移反映材料中振动模式的能量。","pos":"n. phr.","meanings":["拉曼位移"],"ipa":""},{"id":306,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"Fourier-transform infrared spectroscopy","zh":"傅里叶变换红外光谱","note":"FTIR","source":"985表征课程","example_en":"FTIR was used to identify functional groups introduced by surface treatment.","example_zh":"FTIR用于识别表面处理后引入的官能团。","pos":"n. phr.","meanings":["傅里叶变换红外光谱"],"ipa":""},{"id":307,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"FTIR","zh":"傅里叶变换红外光谱","note":"分析分子振动和化学键","source":"985表征课程","example_en":"FTIR spectra showed the appearance of a new absorption band after modification.","example_zh":"FTIR谱显示改性后出现了新的吸收峰。","pos":"n.","meanings":["傅里叶变换红外光谱"],"ipa":""},{"id":308,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"UV-Vis spectroscopy","zh":"紫外可见吸收光谱","note":"光学吸收表征","source":"985表征课程","example_en":"UV-Vis spectroscopy was used to estimate the optical absorption edge.","example_zh":"紫外可见光谱用于估算材料的光学吸收边。","pos":"n. phr.","meanings":["紫外可见吸收光谱"],"ipa":""},{"id":309,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"photoluminescence","zh":"光致发光","note":"PL","source":"985表征课程","example_en":"Strong photoluminescence can indicate efficient radiative recombination.","example_zh":"较强的光致发光可能说明辐射复合效率较高。","pos":"n.","meanings":["光致发光"],"ipa":""},{"id":310,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"PL spectroscopy","zh":"光致发光光谱","note":"研究发光和缺陷相关过程","source":"985表征课程","example_en":"PL spectroscopy helped compare carrier recombination in the two films.","example_zh":"PL光谱有助于比较两种薄膜中的载流子复合行为。","pos":"n. phr.","meanings":["光致发光光谱"],"ipa":""},{"id":311,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"atomic force microscopy","zh":"原子力显微镜","note":"AFM","source":"985表征课程","example_en":"Atomic force microscopy measured the nanoscale surface topography of the film.","example_zh":"原子力显微镜测量了薄膜的纳米尺度表面形貌。","pos":"n. phr.","meanings":["原子力显微镜"],"ipa":""},{"id":312,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"AFM","zh":"原子力显微镜","note":"测量表面形貌","source":"985表征课程","example_en":"AFM showed that the deposited film had a lower surface roughness.","example_zh":"AFM显示沉积薄膜具有更低的表面粗糙度。","pos":"n.","meanings":["原子力显微镜"],"ipa":""},{"id":313,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"scanning tunneling microscopy","zh":"扫描隧道显微镜","note":"STM","source":"985表征课程","example_en":"Scanning tunneling microscopy can image conductive surfaces with atomic-scale resolution.","example_zh":"扫描隧道显微镜能够以原子尺度分辨率观察导电表面。","pos":"n. phr.","meanings":["扫描隧道显微镜"],"ipa":""},{"id":314,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"surface roughness","zh":"表面粗糙度","note":"表面起伏程度","source":"985表征课程","example_en":"Lower surface roughness can improve contact quality in a thin-film device.","example_zh":"较低的表面粗糙度有助于改善薄膜器件的接触质量。","pos":"n. phr.","meanings":["表面粗糙度"],"ipa":""},{"id":315,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"differential scanning calorimetry","zh":"差示扫描量热法","note":"DSC","source":"985表征课程","example_en":"Differential scanning calorimetry detected an exothermic peak during crystallization.","example_zh":"差示扫描量热法检测到结晶过程中的放热峰。","pos":"n. phr.","meanings":["差示扫描量热法"],"ipa":""},{"id":316,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"DSC","zh":"差示扫描量热","note":"分析热效应和相变","source":"985表征课程","example_en":"The DSC curve showed the temperature range of the phase transformation.","example_zh":"DSC曲线显示了相变发生的温度范围。","pos":"n.","meanings":["差示扫描量热"],"ipa":""},{"id":317,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"thermogravimetric analysis","zh":"热重分析","note":"TGA","source":"985表征课程","example_en":"Thermogravimetric analysis measured the mass loss during heating.","example_zh":"热重分析测量了样品加热过程中的质量损失。","pos":"n. phr.","meanings":["热重分析"],"ipa":""},{"id":318,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"TGA","zh":"热重分析","note":"测量质量随温度变化","source":"985表征课程","example_en":"The TGA curve indicated that the material remained stable below 400 degrees Celsius.","example_zh":"TGA曲线表明该材料在400摄氏度以下保持稳定。","pos":"n.","meanings":["热重分析"],"ipa":""},{"id":319,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"differential thermal analysis","zh":"差热分析","note":"DTA","source":"985表征课程","example_en":"Differential thermal analysis revealed a thermal event near the transformation temperature.","example_zh":"差热分析在相变温度附近显示出明显的热效应。","pos":"n. phr.","meanings":["差热分析"],"ipa":""},{"id":320,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"thermal analysis","zh":"热分析","note":"利用温度变化研究材料行为","source":"985表征课程","example_en":"Thermal analysis helps determine how a material responds to heating and cooling.","example_zh":"热分析有助于判断材料在加热和冷却过程中的响应。","pos":"n. phr.","meanings":["热分析"],"ipa":""},{"id":321,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"optical microscopy","zh":"光学显微镜","note":"OM","source":"985表征课程","example_en":"Optical microscopy was used to examine the overall grain morphology.","example_zh":"光学显微镜用于观察整体晶粒形貌。","pos":"n. phr.","meanings":["光学显微镜"],"ipa":""},{"id":322,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"metallography","zh":"金相学","note":"研究金属显微组织","source":"985表征课程","example_en":"Metallography revealed ferrite and pearlite in the steel sample.","example_zh":"金相观察显示钢样中存在铁素体和珠光体。","pos":"n.","meanings":["金相学"],"ipa":""},{"id":323,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"metallographic sample preparation","zh":"金相制样","note":"研磨抛光腐蚀等步骤","source":"985表征课程","example_en":"Good metallographic sample preparation is essential for revealing the true microstructure.","example_zh":"良好的金相制样是准确显示真实组织的基础。","pos":"n. phr.","meanings":["金相制样"],"ipa":""},{"id":324,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"polishing","zh":"抛光","note":"制备光滑样品表面","source":"985表征课程","example_en":"Polishing removes fine scratches before microscopic observation.","example_zh":"抛光用于在显微观察前去除细小划痕。","pos":"n.","meanings":["抛光"],"ipa":""},{"id":325,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"grinding","zh":"磨制","note":"使用磨料去除表面材料","source":"985表征课程","example_en":"Grinding gradually removes deformation and damage from the cut surface.","example_zh":"磨制逐步去除切割表面的变形层和损伤。","pos":"n.","meanings":["磨制"],"ipa":""},{"id":326,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"etching","zh":"浸蚀","note":"显现金相组织","source":"985表征课程","example_en":"Etching makes grain boundaries visible under an optical microscope.","example_zh":"浸蚀能够使晶界在光学显微镜下显现出来。","pos":"n.","meanings":["浸蚀"],"ipa":""},{"id":327,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"sample preparation","zh":"样品制备","note":"测试前的样品处理","source":"985表征课程","example_en":"Careful sample preparation prevents artifacts from being mistaken for real features.","example_zh":"仔细的样品制备可避免把制样伪影误认为真实组织。","pos":"n. phr.","meanings":["样品制备"],"ipa":""},{"id":328,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"cross section","zh":"截面","note":"样品切面","source":"985表征课程","example_en":"A cross section was prepared to examine the coating thickness and interface.","example_zh":"我们制备截面来观察涂层厚度和界面。","pos":"n. phr.","meanings":["截面"],"ipa":""},{"id":329,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"fractography","zh":"断口分析","note":"研究断裂表面特征","source":"985表征课程","example_en":"Fractography helped identify whether the crack propagated by fatigue or overload.","example_zh":"断口分析有助于判断裂纹是由疲劳还是过载扩展。","pos":"n.","meanings":["断口分析"],"ipa":""},{"id":330,"category":"08 材料表征与分析","type":"term","typeLabel":"单词","en":"fracture surface","zh":"断口","note":"材料断裂后形成的表面","source":"985表征课程","example_en":"Beach marks on the fracture surface can indicate fatigue crack growth.","example_zh":"断口上的贝壳纹可能表明疲劳裂纹扩展。","pos":"
