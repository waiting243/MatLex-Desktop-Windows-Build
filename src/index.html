ature”.","en":"review the literature","source":"由专业英语迁移"},{"id":"enphrase-605","category":"英文面试·科研表达","q":"如何用英文表达“总结研究进展”？","a":"summarize the research progress。示例：A useful research expression is “summarize the research progress”.","en":"summarize the research progress","source":"由专业英语迁移"},{"id":"enphrase-606","category":"英文面试·科研表达","q":"如何用英文表达“撰写科研论文”？","a":"write a research paper。示例：A useful research expression is “write a research paper”.","en":"write a research paper","source":"由专业英语迁移"},{"id":"enphrase-607","category":"英文面试·科研表达","q":"如何用英文表达“汇报结果”？","a":"present the results。示例：A useful research expression is “present the results”.","en":"present the results","source":"由专业英语迁移"},{"id":"enphrase-608","category":"英文面试·科研表达","q":"如何用英文表达“回答追问”？","a":"answer follow-up questions。示例：A useful research expression is “answer follow-up questions”.","en":"answer follow-up questions","source":"由专业英语迁移"},{"id":"enphrase-609","category":"英文面试·科研表达","q":"如何用英文表达“独立开展工作”？","a":"work independently。示例：A useful research expression is “work independently”.","en":"work independently","source":"由专业英语迁移"},{"id":"enphrase-610","category":"英文面试·科研表达","q":"如何用英文表达“团队协作”？","a":"work as part of a team。示例：A useful research expression is “work as part of a team”.","en":"work as part of a team","source":"由专业英语迁移"},{"id":"enphrase-611","category":"英文面试·科研表达","q":"如何用英文表达“解决实际问题”？","a":"solve practical problems。示例：A useful research expression is “solve practical problems”.","en":"solve practical problems","source":"由专业英语迁移"},{"id":"enphrase-612","category":"英文面试·科研表达","q":"如何用英文表达“培养科研能力”？","a":"develop research skills。示例：A useful research expression is “develop research skills”.","en":"develop research skills","source":"由专业英语迁移"},{"id":"enphrase-613","category":"英文面试·科研表达","q":"如何用英文表达“打下扎实基础”？","a":"build a solid foundation。示例：A useful research expression is “build a solid foundation”.","en":"build a solid foundation","source":"由专业英语迁移"},{"id":"enphrase-614","category":"英文面试·科研表达","q":"如何用英文表达“对……感兴趣”？","a":"be interested in。示例：A useful research expression is “be interested in”.","en":"be interested in","source":"由专业英语迁移"},{"id":"enphrase-615","category":"英文面试·科研表达","q":"如何用英文表达“聚焦于”？","a":"focus on。示例：A useful research expression is “focus on”.","en":"focus on","source":"由专业英语迁移"},{"id":"enphrase-616","category":"英文面试·科研表达","q":"如何用英文表达“负责”？","a":"be responsible for。示例：A useful research expression is “be responsible for”.","en":"be responsible for","source":"由专业英语迁移"},{"id":"enphrase-617","category":"英文面试·科研表达","q":"如何用英文表达“参与”？","a":"take part in。示例：A useful research expression is “take part in”.","en":"take part in","source":"由专业英语迁移"},{"id":"enphrase-618","category":"英文面试·科研表达","q":"如何用英文表达“担任队长”？","a":"serve as the team leader。示例：A useful research expression is “serve as the team leader”.","en":"serve as the team leader","source":"由专业英语迁移"},{"id":"enphrase-619","category":"英文面试·科研表达","q":"如何用英文表达“获得实践经验”？","a":"gain hands-on experience。示例：A useful research expression is “gain hands-on experience”.","en":"gain hands-on experience","source":"由专业英语迁移"},{"id":"enphrase-620","category":"英文面试·科研表达","q":"如何用英文表达“将模拟与实验结合”？","a":"combine simulation with experiments。示例：A useful research expression is “combine simulation with experiments”.","en":"combine simulation with experiments","source":"由专业英语迁移"},{"id":"ensentence-621","category":"英文面试·专业表达","q":"请用英文表达：晶体结构会显著影响材料的力学和物理性能。","a":"The crystal structure can strongly influence the mechanical and physical properties of a material.","en":"The crystal structure can strongly influence the mechanical and physical properties of a material.","source":"由专业英语迁移"},{"id":"ensentence-622","category":"英文面试·专业表达","q":"请用英文表达：FCC和HCP都是密排结构，但它们具有不同的堆垛序列。","a":"FCC and HCP are both close-packed structures, but they have different stacking sequences.","en":"FCC and HCP are both close-packed structures, but they have different stacking sequences.","source":"由专业英语迁移"},{"id":"ensentence-623","category":"英文面试·专业表达","q":"请用英文表达：FCC具有ABCABC堆垛，而HCP具有ABAB堆垛。","a":"FCC has an ABCABC stacking sequence, while HCP has an ABAB stacking sequence.","en":"FCC has an ABCABC stacking sequence, while HCP has an ABAB stacking sequence.","source":"由专业英语迁移"},{"id":"ensentence-624","category":"英文面试·专业表达","q":"请用英文表达：BCC没有真正意义上的密排面。","a":"BCC does not have a truly close-packed plane.","en":"BCC does not have a truly close-packed plane.","source":"由专业英语迁移"},{"id":"ensentence-625","category":"英文面试·专业表达","q":"请用英文表达：一个滑移系由滑移面和滑移方向组成。","a":"A slip system consists of a slip plane and a slip direction.","en":"A slip system consists of a slip plane and a slip direction.","source":"由专业英语迁移"},{"id":"ensentence-626","category":"英文面试·专业表达","q":"请用英文表达：金属的塑性变形主要与位错运动有关。","a":"Plastic deformation in metals is mainly associated with dislocation motion.","en":"Plastic deformation in metals is mainly associated with dislocation motion.","source":"由专业英语迁移"},{"id":"ensentence-627","category":"英文面试·专业表达","q":"请用英文表达：柏氏矢量描述与位错相关的晶格畸变大小和方向。","a":"The Burgers vector describes the magnitude and direction of lattice distortion associated with a dislocation.","en":"The Burgers vector describes the magnitude and direction of lattice distortion associated with a dislocation.","source":"由专业英语迁移"},{"id":"ensentence-628","category":"英文面试·专业表达","q":"请用英文表达：晶界能够阻碍位错运动，因此可以产生强化作用。","a":"Grain boundaries can hinder dislocation motion and therefore contribute to strengthening.","en":"Grain boundaries can hinder dislocation motion and therefore contribute to strengthening.","source":"由专业英语迁移"},{"id":"ensentence-629","category":"英文面试·专业表达","q":"请用英文表达：根据Hall-Petch关系，晶粒尺寸减小时屈服强度通常升高。","a":"According to the Hall-Petch relation, the yield strength generally increases as the grain size decreases.","en":"According to the Hall-Petch relation, the yield strength generally increases as the grain size decreases.","source":"由专业英语迁移"},{"id":"ensentence-630","category":"英文面试·专业表达","q":"请用英文表达：扩散是热激活过程，因此扩散系数通常随温度快速增大。","a":"Diffusion is thermally activated, so the diffusion coefficient usually increases rapidly with temperature.","en":"Diffusion is thermally activated, so the diffusion coefficient usually increases rapidly with temperature.","source":"由专业英语迁移"},{"id":"ensentence-631","category":"英文面试·专业表达","q":"请用英文表达：菲克第一定律描述稳态扩散。","a":"Fick's first law describes steady-state diffusion.","en":"Fick's first law describes steady-state diffusion.","source":"由专业英语迁移"},{"id":"ensentence-632","category":"英文面试·专业表达","q":"请用英文表达：菲克第二定律描述浓度如何随位置和时间变化。","a":"Fick's second law describes how concentration changes with both position and time.","en":"Fick's second law describes how concentration changes with both position and time.","source":"由专业英语迁移"},{"id":"ensentence-633","category":"英文面试·专业表达","q":"请用英文表达：加工硬化主要由塑性变形过程中位错数量增加及相互作用造成。","a":"Work hardening is mainly caused by the increase and interaction of dislocations during plastic deformation.","en":"Work hardening is mainly caused by the increase and interaction of dislocations during plastic deformation.","source":"由专业英语迁移"},{"id":"ensentence-634","category":"英文面试·专业表达","q":"请用英文表达：回复降低储存能和内应力，但不会形成完全新的晶粒。","a":"Recovery reduces stored energy and internal stress without forming completely new grains.","en":"Recovery reduces stored energy and internal stress without forming completely new grains.","source":"由专业英语迁移"},{"id":"ensentence-635","category":"英文面试·专业表达","q":"请用英文表达：再结晶形成位错密度显著较低的新晶粒。","a":"Recrystallization forms new grains with a much lower dislocation density.","en":"Recrystallization forms new grains with a much lower dislocation density.","source":"由专业英语迁移"},{"id":"ensentence-636","category":"英文面试·专业表达","q":"请用英文表达：相图表示不同温度和成分条件下的平衡相。","a":"A phase diagram shows the equilibrium phases under different temperatures and compositions.","en":"A phase diagram shows the equilibrium phases under different temperatures and compositions.","source":"由专业英语迁移"},{"id":"ensentence-637","category":"英文面试·专业表达","q":"请用英文表达：杠杆定律可用于计算两相区内两相的相对含量。","a":"The lever rule can be used to calculate the relative amounts of two phases in a two-phase region.","en":"The lever rule can be used to calculate the relative amounts of two phases in a two-phase region.","source":"由专业英语迁移"},{"id":"ensentence-638","category":"英文面试·专业表达","q":"请用英文表达：共晶反应是一个液相转变为两个固相。","a":"A eutectic reaction transforms one liquid phase into two solid phases.","en":"A eutectic reaction transforms one liquid phase into two solid phases.","source":"由专业英语迁移"},{"id":"ensentence-639","category":"英文面试·专业表达","q":"请用英文表达：共析反应是一个固相转变为两个不同固相。","a":"A eutectoid reaction transforms one solid phase into two different solid phases.","en":"A eutectoid reaction transforms one solid phase into two different solid phases.","source":"由专业英语迁移"},{"id":"ensentence-640","category":"英文面试·专业表达","q":"请用英文表达：包晶反应涉及一个液相与一个固相反应形成新的固相。","a":"A peritectic reaction involves a liquid phase and a solid phase reacting to form a new solid phase.","en":"A peritectic reaction involves a liquid phase and a solid phase reacting to form a new solid phase.","source":"由专业英语迁移"},{"id":"ensentence-641","category":"英文面试·专业表达","q":"请用英文表达：凝固通常包括形核和晶体长大两个基本过程。","a":"Solidification generally involves nucleation and crystal growth.","en":"Solidification generally involves nucleation and crystal growth.","source":"由专业英语迁移"},{"id":"ensentence-642","category":"英文面试·专业表达","q":"请用英文表达：较大的过冷度通常会提高形核的热力学驱动力。","a":"A larger undercooling usually increases the thermodynamic driving force for nucleation.","en":"A larger undercooling usually increases the thermodynamic driving force for nucleation.","source":"由专业英语迁移"},{"id":"ensentence-643","category":"英文面试·专业表达","q":"请用英文表达：非均匀形核通常比均匀形核需要更低的能垒。","a":"Heterogeneous nucleation usually requires a lower energy barrier than homogeneous nucleation.","en":"Heterogeneous nucleation usually requires a lower energy barrier than homogeneous nucleation.","source":"由专业英语迁移"},{"id":"ensentence-644","category":"英文面试·专业表达","q":"请用英文表达：马氏体转变是一种以协同原子位移为主的无扩散相变。","a":"Martensitic transformation is a diffusionless transformation dominated by coordinated atomic displacement.","en":"Martensitic transformation is a diffusionless transformation dominated by coordinated atomic displacement.","source":"由专业英语迁移"},{"id":"ensentence-645","category":"英文面试·专业表达","q":"请用英文表达：珠光体是由铁素体和渗碳体组成的组织组成物。","a":"Pearlite is a microconstituent composed of ferrite and cementite.","en":"Pearlite is a microconstituent composed of ferrite and cementite.","source":"由专业英语迁移"},{"id":"ensentence-646","category":"英文面试·专业表达","q":"请用英文表达：XRD常用于物相鉴定和晶体结构分析。","a":"XRD is commonly used for phase identification and crystal structure analysis.","en":"XRD is commonly used for phase identification and crystal structure analysis.","source":"由专业英语迁移"},{"id":"ensentence-647","category":"英文面试·专业表达","q":"请用英文表达：SEM主要用于观察表面形貌和微观组织。","a":"SEM is mainly used to observe surface morphology and microstructure.","en":"SEM is mainly used to observe surface morphology and microstructure.","source":"由专业英语迁移"},{"id":"ensentence-648","category":"英文面试·专业表达","q":"请用英文表达：TEM可以提供更高的空间分辨率，并揭示材料内部微观结构细节。","a":"TEM can provide much higher spatial resolution and reveal internal microstructural details.","en":"TEM can provide much higher spatial resolution and reveal internal microstructural details.","source":"由专业英语迁移"},{"id":"ensentence-649","category":"英文面试·专业表达","q":"请用英文表达：EDS常与SEM或TEM结合用于元素成分分析。","a":"EDS is often combined with SEM or TEM to analyze elemental composition.","en":"EDS is often combined with SEM or TEM to analyze elemental composition.","source":"由专业英语迁移"},{"id":"ensentence-650","category":"英文面试·专业表达","q":"请用英文表达：XPS具有表面敏感性，可提供元素组成和化学态信息。","a":"XPS is surface-sensitive and can provide information about elemental composition and chemical states.","en":"XPS is surface-sensitive and can provide information about elemental composition and chemical states.","source":"由专业英语迁移"},{"id":"ensentence-651","category":"英文面试·专业表达","q":"请用英文表达：拉曼光谱可提供振动模式、化学键及结构有序度等信息。","a":"Raman spectroscopy can provide information about vibrational modes, bonding, and structural order.","en":"Raman spectroscopy can provide information about vibrational modes, bonding, and structural order.","source":"由专业英语迁移"},{"id":"ensentence-652","category":"英文面试·专业表达","q":"请用英文表达：DSC可用于检测相变、熔化等热事件。","a":"DSC is useful for detecting thermal events such as phase transitions and melting.","en":"DSC is useful for detecting thermal events such as phase transitions and melting.","source":"由专业英语迁移"},{"id":"ensentence-653","category":"英文面试·专业表达","q":"请用英文表达：表征方法的选择取决于我们希望获得的具体信息。","a":"The choice of characterization method depends on the specific information we want to obtain.","en":"The choice of characterization method depends on the specific information we want to obtain.","source":"由专业英语迁移"},{"id":"ensentence-654","category":"英文面试·专业表达","q":"请用英文表达：在我的主要项目中，我使用分子动力学模拟研究银纳米团簇在降温过程中的结构演化。","a":"In my main project, I used molecular dynamics simulation to study the structural evolution of a silver nanocluster during cooling.","en":"In my main project, I used molecular dynamics simulation to study the structural evolution of a silver nanocluster during cooling.","source":"由专业英语迁移"},{"id":"ensentence-655","category":"英文面试·专业表达","q":"请用英文表达：我比较了逐步降温和直接降温，以评估冷却路径对结构稳定性的影响。","a":"I compared stepwise cooling with direct cooling to evaluate how the cooling path affects structural stability.","en":"I compared stepwise cooling with direct cooling to evaluate how the cooling path affects structural stability.","source":"由专业英语迁移"},{"id":"ensentence-656","category":"英文面试·专业表达","q":"请用英文表达：我分析了势能、径向分布函数、形状因子和局域原子构型。","a":"I analyzed the potential energy, radial distribution function, shape factor, and local atomic configurations.","en":"I analyzed the potential energy, radial distribution function, shape factor, and local atomic configurations.","source":"由专业英语迁移"},{"id":"ensentence-657","category":"英文面试·专业表达","q":"请用英文表达：这个项目提高了我建立模拟模型、处理数据和解释结构变化的能力。","a":"This project improved my ability to build simulation models, process data, and interpret structural changes.","en":"This project improved my ability to build simulation models, process data, and interpret structural changes.","source":"由专业英语迁移"},{"id":"ensentence-658","category":"英文面试·专业表达","q":"请用英文表达：我还研究了Cu-Ag纳米团簇，以理解成分对结构稳定性和相变的影响。","a":"I also studied Cu-Ag nanoclusters to understand how composition affects structural stability and phase transformation.","en":"I also studied Cu-Ag nanoclusters to understand how composition affects structural stability and phase transformation.","source":"由专业英语迁移"},{"id":"ensentence-659","category":"英文面试·专业表达","q":"请用英文表达：在WC-Co项目中，我获得了粉末制备、球磨、SPS烧结和材料表征方面的实践经验。","a":"In the WC-Co project, I gained hands-on experience in powder preparation, ball milling, SPS sintering, and material characterization.","en":"In the WC-Co project, I gained hands-on experience in powder preparation, ball milling, SPS sintering, and material characterization.","source":"由专业英语迁移"},{"id":"ensentence-660","category":"英文面试·专业表达","q":"请用英文表达：我们使用硬度、相对密度、断裂韧性、SEM-EDS和XRD评价样品。","a":"We used hardness, relative density, fracture toughness, SEM-EDS, and XRD to evaluate the samples.","en":"We used hardness, relative density, fracture toughness, SEM-EDS, and XRD to evaluate the samples.","source":"由专业英语迁移"},{"id":"ensentence-661","category":"英文面试·专业表达","q":"请用英文表达：在失效分析竞赛中，我们研究了碳钢辊轴在实际服役条件下的失效。","a":"In the failure analysis competition, we studied the failure of a carbon steel roller under actual service conditions.","en":"In the failure analysis competition, we studied the failure of a carbon steel roller under actual service conditions.","source":"由专业英语迁移"},{"id":"ensentence-662","category":"英文面试·专业表达","q":"请用英文表达：我们结合断口观察、金相、材料测试和有限元分析确定失效机理。","a":"We combined fracture observation, metallography, material testing, and finite element analysis to identify the failure mechanism.","en":"We combined fracture observation, metallography, material testing, and finite element analysis to identify the failure mechanism.","source":"由专业英语迁移"},{"id":"ensentence-663","category":"英文面试·专业表达","q":"请用英文表达：科研让我最重要的收获是学会把实验或模拟结果与其内在机理联系起来。","a":"The most important thing I learned from research is how to connect experimental or simulation results with the underlying mechanism.","en":"The most important thing I learned from research is how to connect experimental or simulation results with the underlying mechanism.","source":"由专业英语迁移"},{"id":"ensentence-664","category":"英文面试·专业表达","q":"请用英文表达：我对功能材料和半导体材料感兴趣，尤其关注微观结构与性能之间的关系。","a":"I am interested in functional materials and semiconductor materials, especially the relationship between microstructure and properties.","en":"I am interested in functional materials and semiconductor materials, especially the relationship between microstructure and properties.","source":"由专业英语迁移"},{"id":"ensentence-665","category":"英文面试·专业表达","q":"请用英文表达：我希望加强实验能力，并学习如何把模拟与实验表征结合起来。","a":"I hope to strengthen my experimental skills and learn how to combine simulation with experimental characterization.","en":"I hope to strengthen my experimental skills and learn how to combine simulation with experimental characterization.","source":"由专业英语迁移"},{"id":"ensentence-666","category":"英文面试·专业表达","q":"请用英文表达：薄膜质量会显著影响载流子传输和器件性能。","a":"Thin-film quality strongly affects carrier transport and device performance.","en":"Thin-film quality strongly affects carrier transport and device performance.","source":"由专业英语迁移"},{"id":"ensentence-667","category":"英文面试·专业表达","q":"请用英文表达：缺陷和界面可能引入陷阱态并影响载流子复合。","a":"Defects and interfaces can introduce trap states and affect carrier recombination.","en":"Defects and interfaces can introduce trap states and affect carrier recombination.","source":"由专业英语迁移"},{"id":"ensentence-668","category":"英文面试·专业表达","q":"请用英文表达：界面工程是提高光电子器件效率和稳定性的重要策略。","a":"Interface engineering is an important strategy for improving the efficiency and stability of optoelectronic devices.","en":"Interface engineering is an important strategy for improving the efficiency and stability of optoelectronic devices.","source":"由专业英语迁移"},{"id":"ensentence-669","category":"英文面试·专业表达","q":"请用英文表达：异质结可用于调控界面处的电荷分离与传输。","a":"A heterojunction can be used to control charge separation and transport across an interface.","en":"A heterojunction can be used to control charge separation and transport across an interface.","source":"由专业英语迁移"},{"id":"ensentence-670","category":"英文面试·专业表达","q":"请用英文表达：带隙决定半导体能够吸收哪些光子，并显著影响其光学响应。","a":"The band gap determines which photons a semiconductor can absorb and strongly influences its optical response.","en":"The band gap determines which photons a semiconductor can absorb and strongly influences its optical response.","source":"由专业英语迁移"},{"id":"v101-web-1","category":"专业基础·表征","q":"请解释XRD的基本原理，并说明Bragg定律在其中的作用。","a":"XRD利用晶体周期结构对X射线产生相干散射。Bragg定律2d sinθ=nλ给出相邻晶面散射波发生相长干涉的条件，因此可由衍射角反推晶面间距，再结合峰位和强度进行物相与结构分析。","en":"","source":"材料保研/复试高频主题筛选"},{"id":"v101-web-2","category":"专业基础·表征","q":"SEM、TEM和AFM分别更适合解决什么问题？","a":"SEM适合快速观察表面或截面形貌并结合EDS做微区成分分析；TEM通过透射薄样品获得更高空间分辨率的内部结构、晶格和缺陷信息；AFM通过探针扫描获得纳米尺度表面形貌和粗糙度，并不要求样品导电。","en":"","source":"材料保研/复试高频主题筛选"},{"id":"v101-web-3","category":"专业基础·表征","q":"如果XRD峰发生偏移，你会从哪些方面分析原因？","a":"先排除仪器零点、样品高度和拟合方法等实验因素，再考虑晶格参数变化、固溶、残余应力、成分变化或相变。仅凭单个峰位变化通常不足以直接给出唯一机理。","en":"","source":"材料保研/复试高频主题筛选"},{"id":"v101-web-4","category":"专业基础·力学","q":"请解释完整应力-应变曲线中弹性、屈服、加工硬化、颈缩和断裂阶段。","a":"弹性阶段卸载后可恢复；达到屈服后产生显著塑性变形；随后位错增殖使材料加工硬化；达到抗拉强度后局部发生颈缩，工程应力下降，最终在损伤累积后断裂。","en":"","source":"材料保研/复试高频主题筛选"},{"id":"v101-web-5","category":"专业基础·相图","q":"面对一张陌生二元相图，你会按什么顺序分析？","a":"先确认横纵坐标、组元与各单相区，再找两相区和三相不变反应；对指定合金成分画垂线判断冷却路径，在两相区用系线确定两相成分、用杠杆定律求相分数，最后区分“相”和“组织组成物”。","en":"","source":"材料保研/复试高频主题筛选"},{"id":"v101-web-6","category":"科研方法","q":"老师追问一个你没有做过的实验参数时，你怎么回答？","a":"先明确说明该参数并非由自己直接操作或当前没有可靠数值，再说明它为什么会影响结果、自己会如何查原始记录或补做验证。重点是保持事实边界清楚，不用猜测填补数据。","en":"","source":"材料保研/复试高频主题筛选"},{"id":"v101-web-7","category":"科研方法","q":"如果你的项目只有相关性证据，如何进一步证明因果机制？","a":"先设计能单独改变关键变量的对照实验或模拟，再用独立表征验证中间机制；必要时通过时间序列、原位表征或参数敏感性分析建立从变量变化到结构变化再到性能变化的证据链。","en":"","source":"材料保研/复试高频主题筛选"},{"id":"v101-web-8","category":"英文面试","q":"请用英语简要解释你的研究项目。","a":"A concise answer should cover the research question, the method you used, the most important result, your own contribution, and what you learned from the project. Keep the logic clear and avoid listing procedures without explaining why they mattered.","en":"","source":"材料保研/复试高频主题筛选"}];
const V10_CONCEPT_BASE=[{"id":"c-1","category":"01 原子结构与键合","title":"原子","en":"atom","explanation":"原子是保持元素化学性质的基本微观单元，由原子核和核外电子组成。材料中的键合、晶体结构和缺陷行为最终都建立在原子与电子相互作用之上。原子是材料的基本组成单元。","source":"教材主干"},{"id":"c-2","category":"01 原子结构与键合","title":"原子核","en":"nucleus","explanation":"由质子和中子组成。原子核几乎包含了原子的全部质量。","source":"教材主干"},{"id":"c-3","category":"01 原子结构与键合","title":"质子","en":"proton","explanation":"带正电。质子数决定元素的原子序数。","source":"教材主干"},{"id":"c-4","category":"01 原子结构与键合","title":"中子","en":"neutron","explanation":"不带电。同一元素的不同同位素具有不同的中子数。","source":"教材主干"},{"id":"c-5","category":"01 原子结构与键合","title":"电子","en":"electron","explanation":"带负电。电子的转移与共享决定了原子如何形成化学键。","source":"教材主干"},{"id":"c-6","category":"01 原子结构与键合","title":"价电子","en":"valence electron","explanation":"决定许多化学与键合行为。价电子在很大程度上决定原子的成键行为。","source":"教材主干"},{"id":"c-7","category":"01 原子结构与键合","title":"电子排布","en":"electron configuration","explanation":"核外电子的排列方式。电子排布有助于解释元素化学性质的周期性变化。","source":"教材主干"},{"id":"c-8","category":"01 原子结构与键合","title":"主量子数","en":"principal quantum number","explanation":"描述电子层级。主量子数表示电子所在的主能级。","source":"教材主干"},{"id":"c-9","category":"01 原子结构与键合","title":"泡利不相容原理","en":"Pauli exclusion principle","explanation":"同一原子中两个电子不能具有完全相同的四个量子数。泡利不相容原理规定同一原子中两个电子不能具有完全相同的四个量子数。","source":"教材主干"},{"id":"c-10","category":"01 原子结构与键合","title":"洪特规则","en":"Hund's rule","explanation":"同能轨道先单占再配对。洪特规则指出简并轨道先单占后配对。","source":"教材主干"},{"id":"c-11","category":"01 原子结构与键合","title":"元素周期表","en":"periodic table","explanation":"元素性质呈周期性变化。元素周期表把价电子排布和性质相近的元素归在相应位置。","source":"教材主干"},{"id":"c-12","category":"01 原子结构与键合","title":"原子序数","en":"atomic number","explanation":"等于核内质子数。银的原子序数为47，因为每个银原子含有47个质子。","source":"教材主干"},{"id":"c-13","category":"01 原子结构与键合","title":"原子半径","en":"atomic radius","explanation":"晶体结构尺寸关系常用参数。原子半径会影响原子间距以及晶体结构中的许多规律。","source":"教材主干"},{"id":"c-14","category":"01 原子结构与键合","title":"原子间键合","en":"interatomic bonding","explanation":"材料结构与性能的基础。原子间键合会显著影响刚度、熔点和电学行为。","source":"教材主干"},{"id":"c-15","category":"01 原子结构与键合","title":"主键","en":"primary bond","explanation":"金属键、离子键、共价键。金属键、离子键和共价键是材料中主要的主键类型。","source":"教材主干"},{"id":"c-16","category":"01 原子结构与键合","title":"次级键","en":"secondary bond","explanation":"范德华力和氢键等。次级键弱于主键，但会显著影响聚合物和分子晶体的性质。","source":"教材主干"},{"id":"c-17","category":"01 原子结构与键合","title":"金属键","en":"metallic bond","explanation":"正离子实与共有化价电子之间的结合。金属键有助于解释金属良好的导电性。","source":"教材主干"},{"id":"c-18","category":"01 原子结构与键合","title":"离子键","en":"ionic bond","explanation":"电子转移后正负离子的静电吸引。离子键由带相反电荷离子之间的静电吸引形成。","source":"教材主干"},{"id":"c-19","category":"01 原子结构与键合","title":"共价键","en":"covalent bond","explanation":"相邻原子共享电子形成的键。许多材料中的共价键具有明显方向性。","source":"教材主干"},{"id":"c-20","category":"01 原子结构与键合","title":"范德华力","en":"van der Waals force","explanation":"由偶极相互作用产生的较弱作用力。范德华力有助于维持弱键合分子层之间的结合。","source":"教材主干"},{"id":"c-21","category":"01 原子结构与键合","title":"氢键","en":"hydrogen bond","explanation":"涉及氢原子的较强分子间作用。氢键能够提高某些聚合物的强度和热稳定性。","source":"教材主干"},{"id":"c-22","category":"01 原子结构与键合","title":"键能","en":"bond energy","explanation":"破坏化学键所需的能量尺度。较高的键能通常对应较强的化学键和较高的熔化温度。","source":"教材主干"},{"id":"c-23","category":"01 原子结构与键合","title":"电负性","en":"electronegativity","explanation":"原子吸引成键电子的能力。两个原子之间较大的电负性差异有利于形成离子键。","source":"教材主干"},{"id":"c-24","category":"01 原子结构与键合","title":"极化","en":"polarization","explanation":"正负电荷中心发生相对位移。极化描述电场中正负电荷中心发生相对位移的现象。","source":"教材主干"},{"id":"c-25","category":"01 原子结构与键合","title":"偶极","en":"dipole","explanation":"正负电荷中心分离形成的电偶极。当正负电荷中心不重合时会形成永久偶极。","source":"教材主干"},{"id":"c-26","category":"02 固体结构与晶体学","title":"晶体","en":"crystal","explanation":"具有长程有序结构。晶体具有长程有序的原子结构。","source":"教材主干"},{"id":"c-27","category":"02 固体结构与晶体学","title":"晶态材料","en":"crystalline material","explanation":"原子具有周期性排列。晶态金属由于原子在长距离上周期性重复，会产生尖锐的衍射峰。","source":"教材主干"},{"id":"c-28","category":"02 固体结构与晶体学","title":"非晶态材料","en":"amorphous material","explanation":"缺乏长程周期性。金属玻璃属于非晶态材料，因为它缺乏长程周期性的原子排列。","source":"教材主干"},{"id":"c-29","category":"02 固体结构与晶体学","title":"长程有序","en":"long-range order","explanation":"较大尺度上的周期性排列。长程有序使晶体点阵能够跨越许多晶胞周期性重复。","source":"教材主干"},{"id":"c-30","category":"02 固体结构与晶体学","title":"短程有序","en":"short-range order","explanation":"近邻原子存在一定有序关系。玻璃即使没有周期点阵，近邻原子之间仍可保持短程有序。","source":"教材主干"},{"id":"c-31","category":"02 固体结构与晶体学","title":"点阵","en":"lattice","explanation":"晶体周期性的抽象几何表示。点阵表示在晶体中周期性重复的一组几何位置。","source":"教材主干"},{"id":"c-32","category":"02 固体结构与晶体学","title":"空间点阵","en":"space lattice","explanation":"三维周期性点阵。空间点阵把阵点的周期性排列扩展到三维空间。","source":"教材主干"},{"id":"c-33","category":"02 固体结构与晶体学","title":"阵点","en":"lattice point","explanation":"点阵中的等价几何点。理想点阵中的每个阵点都具有等价的周围环境。","source":"教材主干"},{"id":"c-34","category":"02 固体结构与晶体学","title":"基元","en":"basis","explanation":"附着在每个阵点上的原子或原子组。在每个阵点上放置相同基元即可构成晶体结构。","source":"教材主干"},{"id":"c-35","category":"02 固体结构与晶体学","title":"晶体结构","en":"crystal structure","explanation":"点阵加基元。FCC铜的晶体结构可以由面心立方点阵和单原子基元描述。","source":"教材主干"},{"id":"c-36","category":"02 固体结构与晶体学","title":"晶胞","en":"unit cell","explanation":"晶胞是晶体周期结构的基本重复单元。通过沿三个晶格矢量平移晶胞，可以生成整个晶体结构；选择晶胞时需同时描述晶格参数和基元。晶胞是晶体的基本重复单元。","source":"教材主干"},{"id":"c-37","category":"02 固体结构与晶体学","title":"初基晶胞","en":"primitive cell","explanation":"有效包含一个阵点的最小晶胞。初基晶胞包含通过平移复制整个点阵所需的最小体积。","source":"教材主干"},{"id":"c-38","category":"02 固体结构与晶体学","title":"点阵常数","en":"lattice parameter","explanation":"描述晶胞尺寸和形状的参数。由于热膨胀，FCC银的点阵常数会随温度发生轻微变化。","source":"教材主干"},{"id":"c-39","category":"02 固体结构与晶体学","title":"布拉维点阵","en":"Bravais lattice","explanation":"十四种三维布拉维点阵。十四种布拉维点阵涵盖了三维平移点阵的全部可能类型。","source":"教材主干"},{"id":"c-40","category":"02 固体结构与晶体学","title":"晶系","en":"crystal system","explanation":"按对称性划分的七类晶系。立方、四方和六方是七种晶系中的三种。","source":"教材主干"},{"id":"c-41","category":"02 固体结构与晶体学","title":"晶向","en":"crystallographic direction","explanation":"晶体中的方向。在立方晶体中，[110]晶向沿着一个面的对角线方向。","source":"教材主干"},{"id":"c-42","category":"02 固体结构与晶体学","title":"晶向指数","en":"direction indices","explanation":"用整数标记晶向。[111]这类晶向指数用最小整数分量表示晶体中的方向。","source":"教材主干"},{"id":"c-43","category":"02 固体结构与晶体学","title":"晶面","en":"crystallographic plane","explanation":"晶体中的平面。晶面的取向和间距决定它在点阵中的截取位置。","source":"教材主干"},{"id":"c-44","category":"02 固体结构与晶体学","title":"米勒指数","en":"Miller indices","explanation":"晶面指数的标准表示。米勒指数(111)可表示FCC晶体中的一个密排晶面。","source":"教材主干"},{"id":"c-45","category":"02 固体结构与晶体学","title":"晶向族","en":"family of directions","explanation":"对称等价晶向的集合。在立方晶体中，⟨110⟩晶向族包含一组对称等价的晶向。","source":"教材主干"},{"id":"c-46","category":"02 固体结构与晶体学","title":"晶面族","en":"family of planes","explanation":"对称等价晶面的集合。FCC晶体中的{111}晶面族包含一组对称等价晶面。","source":"教材主干"},{"id":"c-47","category":"02 固体结构与晶体学","title":"极射投影","en":"stereographic projection","explanation":"表达晶体取向关系的方法。极射投影可以在二维图上表示晶面之间的角度关系。","source":"教材主干"},{"id":"c-48","category":"02 固体结构与晶体学","title":"对称性","en":"symmetry","explanation":"晶体的重要几何特征。晶体对称性决定哪些晶向和晶面在对称操作下彼此等价。","source":"教材主干"},{"id":"c-49","category":"02 固体结构与晶体学","title":"配位数","en":"coordination number","explanation":"一个原子的最近邻原子数。理想FCC结构中，每个原子的配位数为12。","source":"教材主干"},{"id":"c-50","category":"02 固体结构与晶体学","title":"原子堆积因子","en":"atomic packing factor","explanation":"原子堆积因子是晶胞内原子实际占据体积与晶胞总体积之比，用于衡量结构的几何致密程度。FCC/HCP约为0.74，BCC约为0.68。FCC和HCP结构的原子堆积因子为0.74，而BCC约为0.68。","source":"教材主干"},{"id":"c-51","category":"02 固体结构与晶体学","title":"密排面","en":"close-packed plane","explanation":"原子面密度最高的晶面。在FCC晶体中，{111}晶面是密排面。","source":"教材主干"},{"id":"c-52","category":"02 固体结构与晶体学","title":"密排方向","en":"close-packed direction","explanation":"原子线密度最高的方向。在FCC金属中，⟨110⟩晶向是密排方向。","source":"教材主干"},{"id":"c-53","category":"02 固体结构与晶体学","title":"面心立方","en":"face-centered cubic","explanation":"面心立方晶胞的角点和六个面心都有晶格点，常规晶胞含4个等效原子，配位数12，原子堆积因子0.74，密排面为{111}。块体银具有面心立方结构。","source":"教材主干"},{"id":"c-54","category":"02 固体结构与晶体学","title":"体心立方","en":"body-centered cubic","explanation":"体心立方晶胞由8个角点和1个体心位置构成，常规晶胞含2个等效原子，配位数8，原子堆积因子约0.68；其最密排面通常为{110}。铁素体具有体心立方结构。","source":"教材主干"},{"id":"c-55","category":"02 固体结构与晶体学","title":"密排六方","en":"hexagonal close-packed","explanation":"密排六方结构采用ABAB层状堆垛，理想配位数12，原子堆积因子0.74，基面{0001}为密排面；理想c/a约1.633。HCP和FCC都是密排结构。","source":"教材主干"},{"id":"c-56","category":"02 固体结构与晶体学","title":"堆垛序列","en":"stacking sequence","explanation":"密排原子层的排列顺序。FCC和HCP的主要区别之一是堆垛序列不同。","source":"教材主干"},{"id":"c-57","category":"02 固体结构与晶体学","title":"ABC堆垛","en":"ABC stacking","explanation":"FCC密排层典型序列。密排原子层按ABC顺序堆垛可形成FCC结构。","source":"教材主干"},{"id":"c-58","category":"02 固体结构与晶体学","title":"AB堆垛","en":"AB stacking","explanation":"HCP密排层典型序列。密排原子层按AB顺序堆垛可形成理想HCP结构。","source":"教材主干"},{"id":"c-59","category":"02 固体结构与晶体学","title":"四面体间隙","en":"tetrahedral site","explanation":"由四个近邻原子围成的间隙。小尺寸间隙原子可以占据由四个基体原子围成的四面体间隙。","source":"教材主干"},{"id":"c-60","category":"02 固体结构与晶体学","title":"八面体间隙","en":"octahedral site","explanation":"由六个近邻原子围成的间隙。八面体间隙由六个最近邻基体原子围成。","source":"教材主干"},{"id":"c-61","category":"02 固体结构与晶体学","title":"间隙位置","en":"interstitial site","explanation":"晶体中可容纳小原子的空隙。由于碳原子远小于铁原子，碳可以占据铁晶格中的间隙位置。","source":"教材主干"},{"id":"c-62","category":"02 固体结构与晶体学","title":"多晶型性","en":"polymorphism","explanation":"同一物质可具有不同晶体结构。多晶型性使同一种化合物能够形成一种以上的晶体结构。","source":"教材主干"},{"id":"c-63","category":"02 固体结构与晶体学","title":"同素异构","en":"allotropy","explanation":"元素具有不同晶体结构。铁具有同素异构现象，因为其稳定晶体结构会随温度由BCC转变为FCC。","source":"教材主干"},{"id":"c-64","category":"02 固体结构与晶体学","title":"固溶体","en":"solid solution","explanation":"溶质原子溶入溶剂晶格形成单相。固溶体中溶质原子溶入溶剂晶格。","source":"教材主干"},{"id":"c-65","category":"02 固体结构与晶体学","title":"置换固溶体","en":"substitutional solid solution","explanation":"溶质原子占据溶剂阵点。在置换固溶体中，溶质原子取代正常阵点上的溶剂原子。","source":"教材主干"},{"id":"c-66","category":"02 固体结构与晶体学","title":"间隙固溶体","en":"interstitial solid solution","explanation":"小溶质原子进入晶格间隙。铁素体中的碳通过占据BCC铁晶格的小间隙形成间隙固溶体。","source":"教材主干"},{"id":"c-67","category":"02 固体结构与晶体学","title":"中间相","en":"intermediate phase","explanation":"合金中位于端际固溶体之间的相。在二元合金系中，中间相可出现在两个端际固溶体之间。","source":"教材主干"},{"id":"c-68","category":"02 固体结构与晶体学","title":"金属间化合物","en":"intermetallic compound","explanation":"具有一定组成和结构的金属间相。金属间化合物通常具有有序结构，其性能与组成它的金属明显不同。","source":"教材主干"},{"id":"c-69","category":"02 固体结构与晶体学","title":"有序固溶体","en":"ordered solid solution","explanation":"原子呈规则占位。在有序固溶体中，不同原子种类优先占据特定阵点。","source":"教材主干"},{"id":"c-70","category":"02 固体结构与晶体学","title":"无序固溶体","en":"disordered solid solution","explanation":"原子随机占位。在无序固溶体中，溶质与溶剂原子以统计随机方式占据等价阵点。","source":"教材主干"},{"id":"c-71","category":"02 固体结构与晶体学","title":"离子晶体","en":"ionic crystal","explanation":"以离子键为主要结合方式。氯化钠是典型离子晶体，主要依靠异号离子之间的静电吸引结合。","source":"教材主干"},{"id":"c-72","category":"02 固体结构与晶体学","title":"共价晶体","en":"covalent crystal","explanation":"以共价键为主要结合方式。金刚石是共价晶体，其中每个碳原子都形成强而具有方向性的共价键。","source":"教材主干"},{"id":"c-73","category":"02 固体结构与晶体学","title":"聚合物晶体","en":"polymer crystal","explanation":"高分子链局部规则排列形成的晶态结构。聚乙烯长链的部分链段规则堆积时，可以形成聚合物晶体区域。","source":"教材主干"},{"id":"c-74","category":"03 晶体缺陷与界面","title":"晶体缺陷","en":"crystal defect","explanation":"实际晶体偏离理想周期结构的区域。例如，冷加工金属中的位错、空位和晶界都会使局部原子排列偏离理想周期结构。","source":"教材主干"},{"id":"c-75","category":"03 晶体缺陷与界面","title":"点缺陷","en":"point defect","explanation":"零维缺陷。例如，空位、间隙原子和置换原子都属于点缺陷。","source":"教材主干"},{"id":"c-76","category":"03 晶体缺陷与界面","title":"空位","en":"vacancy","explanation":"空位是正常晶格位置缺少原子形成的点缺陷。平衡空位浓度随温度升高而指数增加，并直接参与置换型扩散、烧结和高温蠕变等过程。","source":"教材主干"},{"id":"c-77","category":"03 晶体缺陷与界面","title":"间隙原子","en":"interstitial atom","explanation":"原子占据晶格间隙。例如，碳原子可进入α-Fe晶格的间隙位置，形成间隙固溶体。","source":"教材主干"},{"id":"c-78","category":"03 晶体缺陷与界面","title":"置换原子","en":"substitutional atom","explanation":"异类原子占据正常阵点。例如，Cu-Ni固溶体中Ni原子可替代Cu原子占据FCC正常阵点。","source":"教材主干"},{"id":"c-79","category":"03 晶体缺陷与界面","title":"自间隙原子","en":"self-interstitial","explanation":"本体原子进入间隙。例如，辐照可把晶格原子击离原位，同时形成空位和自间隙原子。","source":"教材主干"},{"id":"c-80","category":"03 晶体缺陷与界面","title":"肖特基缺陷","en":"Schottky defect","explanation":"离子晶体中成对空位型缺陷。例如，NaCl晶体中可同时形成Na+空位和Cl-空位，以维持整体电中性。","source":"教材主干"},{"id":"c-81","category":"03 晶体缺陷与界面","title":"弗伦克尔缺陷","en":"Frenkel defect","explanation":"空位与间隙离子成对出现。例如，在某些离子晶体中，阳离子离开正常阵位进入间隙后会留下一个空位，形成弗伦克尔缺陷对。","source":"教材主干"},{"id":"c-82","category":"03 晶体缺陷与界面","title":"平衡空位浓度","en":"equilibrium vacancy concentration","explanation":"随温度升高通常增加。例如，高温淬火可把较高温度下的空位浓度部分保留到低温。","source":"教材主干"},{"id":"c-83","category":"03 晶体缺陷与界面","title":"线缺陷","en":"line defect","explanation":"主要指位错。例如，刃型位错和螺型位错都是典型线缺陷。","source":"教材主干"},{"id":"c-84","category":"03 晶体缺陷与界面","title":"位错","en":"dislocation","explanation":"位错是晶体中的线缺陷。真实金属的塑性变形主要通过位错运动实现，因此材料的屈服强度本质上与阻碍位错运动的难易程度密切相关。金属塑性变形与位错运动密切相关。","source":"教材主干"},{"id":"c-85","category":"03 晶体缺陷与界面","title":"刃型位错","en":"edge dislocation","explanation":"柏氏矢量与位错线垂直。例如，一条额外半原子面终止在晶体内部时，其端部可视为刃型位错。","source":"教材主干"},{"id":"c-86","category":"03 晶体缺陷与界面","title":"螺型位错","en":"screw dislocation","explanation":"柏氏矢量与位错线平行。例如，晶体发生剪切后形成螺旋状原子面错排时可产生螺型位错。","source":"教材主干"},{"id":"c-87","category":"03 晶体缺陷与界面","title":"混合位错","en":"mixed dislocation","explanation":"兼有刃型和螺型特征。实际位错线常是弯曲的，因此同一条位错的不同线段可同时具有刃型和螺型分量。","source":"教材主干"},{"id":"c-88","category":"03 晶体缺陷与界面","title":"位错线","en":"dislocation line","explanation":"描述位错几何位置的线。在TEM中观察到的弯曲位错线和位错网络，可以直接反映位错在晶体中的几何分布。","source":"教材主干"},{"id":"c-89","category":"03 晶体缺陷与界面","title":"柏氏矢量","en":"Burgers vector","explanation":"柏氏矢量描述位错造成的晶格闭合差，给出晶格畸变的大小和方向。它与位错滑移方向、位错能量以及位错反应是否允许密切相关。柏氏矢量描述位错周围晶格畸变的大小和方向。","source":"教材主干"},{"id":"c-90","category":"03 晶体缺陷与界面","title":"柏氏回路","en":"Burgers circuit","explanation":"确定柏氏矢量的方法。例如，绕位错按相同晶格步数作回路时无法闭合，闭合差对应柏氏矢量。","source":"教材主干"},{"id":"c-91","category":"03 晶体缺陷与界面","title":"滑移","en":"slip","explanation":"位错运动导致的塑性变形方式。例如，FCC金属常沿{111}<110>滑移系发生塑性变形。","source":"教材主干"},{"id":"c-92","category":"03 晶体缺陷与界面","title":"滑移运动","en":"glide","explanation":"位错在滑移面内运动。当外加剪切应力达到临界值后，位错会沿滑移面移动并留下永久塑性应变。","source":"教材主干"},{"id":"c-93","category":"03 晶体缺陷与界面","title":"攀移","en":"climb","explanation":"刃型位错借助点缺陷扩散离开滑移面。例如，高温蠕变时空位扩散可使刃型位错攀移并绕过障碍。","source":"教材主干"},{"id":"c-94","category":"03 晶体缺陷与界面","title":"交滑移","en":"cross slip","explanation":"螺位错从一个滑移面转移到另一个滑移面。例如，FCC金属中的螺型位错可在共享同一<110>方向的不同{111}面之间交滑移。","source":"教材主干"},{"id":"c-95","category":"03 晶体缺陷与界面","title":"位错密度","en":"dislocation density","explanation":"单位体积内位错线长度。冷加工会显著提高位错密度，因此金属通常会发生加工硬化。","source":"教材主干"},{"id":"c-96","category":"03 晶体缺陷与界面","title":"位错增殖","en":"dislocation multiplication","explanation":"塑性变形中位错数量增加。例如，Frank-Read位错源可以反复放出位错环，使变形过程中位错数量快速增加。","source":"教材主干"},{"id":"c-97","category":"03 晶体缺陷与界面","title":"Frank-Read位错源","en":"Frank-Read source","explanation":"经典位错增殖机制。一段两端被钉扎的位错在剪切应力下弯曲成环并持续释放新位错，就是Frank-Read机制。","source":"教材主干"},{"id":"c-98","category":"03 晶体缺陷与界面","title":"派纳应力","en":"Peierls stress","explanation":"位错在晶格中运动需克服的阻力。派纳应力越低，位错越容易克服晶格周期势垒移动，材料通常越容易发生塑性变形。","source":"教材主干"},{"id":"c-99","category":"03 晶体缺陷与界面","title":"层错","en":"stacking fault","explanation":"密排层正常堆垛次序被破坏。层错会改变密排原子面的正常堆垛顺序。","source":"教材主干"},{"id":"c-100","category":"03 晶体缺陷与界面","title":"层错能","en":"stacking fault energy","explanation":"形成单位面积层错所需能量。FCC金属中层错能较低时，全位错更容易分解为间距较大的两个Shockley不全位错。","source":"教材主干"},{"id":"c-101","category":"03 晶体缺陷与界面","title":"不全位错","en":"partial dislocation","explanation":"柏氏矢量小于完整晶格平移矢量。例如，FCC中的Shockley不全位错可具有a/6<112>型柏氏矢量，并与层错相联系。","source":"教材主干"},{"id":"c-102","category":"03 晶体缺陷与界面","title":"全位错","en":"perfect dislocation","explanation":"柏氏矢量为完整晶格平移矢量。例如，FCC中的a/2<110>位错属于常见全位错，其柏氏矢量对应完整晶格平移。","source":"教材主干"},{"id":"c-103","category":"03 晶体缺陷与界面","title":"面缺陷","en":"planar defect","explanation":"二维缺陷。例如，晶界、相界和自由表面都属于二维面缺陷。","source":"教材主干"},{"id":"c-104","category":"03 晶体缺陷与界面","title":"外表面","en":"surface","explanation":"材料与外界介质的界面。金属自由表面的原子配位数低于晶体内部，因此表面具有额外能量。","source":"教材主干"},{"id":"c-105","category":"03 晶体缺陷与界面","title":"晶界","en":"grain boundary","explanation":"晶界是相邻晶粒取向不同形成的界面。晶界可阻碍位错运动从而产生细晶强化，也常作为扩散、偏聚、腐蚀和相变形核的活跃区域。晶界能够阻碍位错运动并提高强度。","source":"教材主干"},{"id":"c-106","category":"03 晶体缺陷与界面","title":"亚晶界","en":"subgrain boundary","explanation":"小角度取向差亚晶粒之间界面。回复过程中，位错可重新排列形成低角度亚晶界，把一个变形晶粒分成多个亚晶。","source":"教材主干"},{"id":"c-107","category":"03 晶体缺陷与界面","title":"小角度晶界","en":"low-angle grain boundary","explanation":"可由位错阵列描述。典型倾斜小角度晶界可近似看成一列规则排列的同号刃型位错。","source":"教材主干"},{"id":"c-108","category":"03 晶体缺陷与界面","title":"大角度晶界","en":"high-angle grain boundary","explanation":"两晶粒取向差较大。大角度晶界原子排列较无序，通常具有更高界面能，也常表现出更快的晶界扩散。","source":"教材主干"},{"id":"c-109","category":"03 晶体缺陷与界面","title":"孪晶界","en":"twin boundary","explanation":"具有镜面对称取向关系的界面。FCC金属中的Σ3孪晶界是常见特殊晶界，两侧晶格关于孪晶面对称。","source":"教材主干"},{"id":"c-110","category":"03 晶体缺陷与界面","title":"相界","en":"phase boundary","explanation":"不同相之间的界面。例如，钢中铁素体与渗碳体之间的边界就是典型相界。","source":"教材主干"},{"id":"c-111","category":"03 晶体缺陷与界面","title":"相界面","en":"interphase boundary","explanation":"两种不同相之间边界。例如，析出相与基体之间的边界属于相界面，其结构会影响形核和长大。","source":"教材主干"},{"id":"c-112","category":"03 晶体缺陷与界面","title":"界面能","en":"interface energy","explanation":"单位面积界面的附加自由能。细化组织会增加界面总面积，因此界面能可以成为晶粒长大和粗化的驱动力之一。","source":"教材主干"},{"id":"c-113","category":"03 晶体缺陷与界面","title":"晶界偏聚","en":"grain-boundary segregation","explanation":"溶质原子在晶界富集。某些溶质原子会优先富集到晶界，从而改变晶界能、脆化倾向或局部腐蚀行为。","source":"教材主干"},{"id":"c-114","category":"03 晶体缺陷与界面","title":"界面迁移","en":"interface migration","explanation":"界面位置随时间发生变化。再结晶和晶粒长大过程中，高角度晶界通过迁移吞并高能变形组织。","source":"教材主干"},{"id":"c-115","category":"03 晶体缺陷与界面","title":"共格界面","en":"coherent interface","explanation":"两侧晶格保持较好连续性。细小析出相与基体晶格参数接近时可形成共格界面，并在周围产生弹性失配应变。","source":"教材主干"},{"id":"c-116","category":"03 晶体缺陷与界面","title":"半共格界面","en":"semicoherent interface","explanation":"部分共格并由失配位错协调。析出相长大后，共格性难以完全维持，界面可通过失配位错转变为半共格。","source":"教材主干"},{"id":"c-117","category":"03 晶体缺陷与界面","title":"非共格界面","en":"incoherent interface","explanation":"两侧晶格缺乏匹配关系。粗大第二相与基体晶格无法连续匹配时，通常形成非共格界面。","source":"教材主干"},{"id":"c-118","category":"04 扩散与动力学","title":"扩散","en":"diffusion","explanation":"扩散是原子或分子由热运动产生的迁移过程。净传输的驱动力本质上与化学势梯度相关，浓度梯度是许多简单体系中的常用近似描述。温度升高时扩散通常会加快。","source":"教材主干"},{"id":"c-119","category":"04 扩散与动力学","title":"扩散通量","en":"diffusion flux","explanation":"单位时间通过单位面积的物质量。扩散通量有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-120","category":"04 扩散与动力学","title":"浓度梯度","en":"concentration gradient","explanation":"浓度随空间位置变化的梯度。浓度梯度有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-121","category":"04 扩散与动力学","title":"菲克第一定律","en":"Fick's first law","explanation":"菲克第一定律描述稳态扩散：扩散通量与浓度梯度成正比、方向相反，即J=-D∂C/∂x。负号表示原子净迁移通常从高浓度区指向低浓度区。菲克第一定律描述稳态扩散。","source":"教材主干"},{"id":"c-122","category":"04 扩散与动力学","title":"菲克第二定律","en":"Fick's second law","explanation":"菲克第二定律描述非稳态扩散中浓度随时间和位置的演化。当D为常数时，一维形式为∂C/∂t=D∂²C/∂x²。菲克第二定律描述非稳态扩散。","source":"教材主干"},{"id":"c-123","category":"04 扩散与动力学","title":"稳态扩散","en":"steady-state diffusion","explanation":"浓度分布不随时间变化。稳态扩散有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-124","category":"04 扩散与动力学","title":"非稳态扩散","en":"non-steady-state diffusion","explanation":"浓度分布随时间变化。非稳态扩散有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-125","category":"04 扩散与动力学","title":"扩散系数","en":"diffusion coefficient","explanation":"扩散系数D衡量扩散速度，通常满足Arrhenius关系D=D₀exp(-Q/RT)。温度升高或扩散激活能降低都会显著提高D。扩散系数有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-126","category":"04 扩散与动力学","title":"扩散率","en":"diffusivity","explanation":"diffusion coefficient常用同义词。扩散率有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-127","category":"04 扩散与动力学","title":"扩散激活能","en":"activation energy for diffusion","explanation":"原子跃迁需克服的能垒。扩散激活能有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-128","category":"04 扩散与动力学","title":"阿伦尼乌斯方程","en":"Arrhenius equation","explanation":"描述扩散系数与温度关系。阿伦尼乌斯方程有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-129","category":"04 扩散与动力学","title":"空位扩散","en":"vacancy diffusion","explanation":"置换原子借助空位迁移。空位扩散有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-130","category":"04 扩散与动力学","title":"间隙扩散","en":"interstitial diffusion","explanation":"小原子在间隙位置间跃迁。间隙扩散有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-131","category":"04 扩散与动力学","title":"原子跃迁","en":"atomic jump","explanation":"原子从一个位置跳到邻近位置。原子跃迁有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-132","category":"04 扩散与动力学","title":"跃迁频率","en":"jump frequency","explanation":"单位时间原子跃迁次数。跃迁频率有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-133","category":"04 扩散与动力学","title":"无规则行走","en":"random walk","explanation":"扩散原子的随机迁移模型。无规则行走有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-134","category":"04 扩散与动力学","title":"扩散距离","en":"diffusion distance","explanation":"一定时间内的特征扩散尺度。扩散距离有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-135","category":"04 扩散与动力学","title":"自扩散","en":"self-diffusion","explanation":"同种原子之间的扩散。自扩散有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-136","category":"04 扩散与动力学","title":"互扩散","en":"interdiffusion","explanation":"不同组元之间的扩散。互扩散有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-137","category":"04 扩散与动力学","title":"化学扩散","en":"chemical diffusion","explanation":"由化学势梯度驱动的扩散。化学扩散有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-138","category":"04 扩散与动力学","title":"晶界扩散","en":"grain-boundary diffusion","explanation":"沿晶界的快速扩散。晶界扩散有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-139","category":"04 扩散与动力学","title":"表面扩散","en":"surface diffusion","explanation":"沿材料表面的扩散。表面扩散有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-140","category":"04 扩散与动力学","title":"晶格扩散","en":"lattice diffusion","explanation":"通过晶体内部晶格进行扩散。晶格扩散有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-141","category":"04 扩散与动力学","title":"柯肯达尔效应","en":"Kirkendall effect","explanation":"不同组元扩散速率差导致标记面移动。柯肯达尔效应有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-142","category":"04 扩散与动力学","title":"反应扩散","en":"reaction diffusion","explanation":"扩散伴随新相形成。反应扩散有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-143","category":"04 扩散与动力学","title":"化学势","en":"chemical potential","explanation":"扩散的热力学驱动力之一。化学势有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-144","category":"04 扩散与动力学","title":"迁移率","en":"mobility","explanation":"粒子对驱动力响应的运动能力。迁移率有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-145","category":"04 扩散与动力学","title":"速率过程","en":"rate process","explanation":"受动力学控制的材料过程。速率过程有助于描述固体中的原子迁移与扩散。","source":"教材主干"},{"id":"c-146","category":"05 形变、强化与再结晶","title":"弹性变形","en":"elastic deformation","explanation":"卸载后可恢复的变形。弹性变形与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-147","category":"05 形变、强化与再结晶","title":"塑性变形","en":"plastic deformation","explanation":"卸载后不能完全恢复的永久变形。塑性变形与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-148","category":"05 形变、强化与再结晶","title":"弹性模量","en":"elastic modulus","explanation":"描述材料弹性刚度。弹性模量与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-149","category":"05 形变、强化与再结晶","title":"杨氏模量","en":"Young's modulus","explanation":"单轴拉伸下的弹性模量。杨氏模量与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-150","category":"05 形变、强化与再结晶","title":"剪切模量","en":"shear modulus","explanation":"剪切变形下的弹性模量。剪切模量与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-151","category":"05 形变、强化与再结晶","title":"泊松比","en":"Poisson's ratio","explanation":"横向应变与纵向应变比值。泊松比与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-152","category":"05 形变、强化与再结晶","title":"屈服强度","en":"yield strength","explanation":"材料开始明显塑性变形时的应力。屈服强度与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-153","category":"05 形变、强化与再结晶","title":"抗拉强度","en":"ultimate tensile strength","explanation":"拉伸过程中最大工程应力。抗拉强度与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-154","category":"05 形变、强化与再结晶","title":"塑性","en":"ductility","explanation":"发生塑性变形而不断裂的能力。塑性与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-155","category":"05 形变、强化与再结晶","title":"韧性","en":"toughness","explanation":"吸收能量并抵抗断裂的能力。韧性与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-156","category":"05 形变、强化与再结晶","title":"硬度","en":"hardness","explanation":"抵抗局部塑性变形的能力。硬度与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-157","category":"05 形变、强化与再结晶","title":"应力","en":"stress","explanation":"单位面积上的内力。应力与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-158","category":"05 形变、强化与再结晶","title":"应变","en":"strain","explanation":"相对变形量。应变与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-159","category":"05 形变、强化与再结晶","title":"应力应变曲线","en":"stress-strain curve","explanation":"描述材料力学响应。应力应变曲线与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-160","category":"05 形变、强化与再结晶","title":"分切应力","en":"resolved shear stress","explanation":"作用在滑移系上的剪应力分量。分切应力与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-161","category":"05 形变、强化与再结晶","title":"临界分切应力","en":"critical resolved shear stress","explanation":"启动滑移所需临界值。临界分切应力与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-162","category":"05 形变、强化与再结晶","title":"施密德因子","en":"Schmid factor","explanation":"外应力转化为分切应力的几何因子。施密德因子与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-163","category":"05 形变、强化与再结晶","title":"滑移系","en":"slip system","explanation":"滑移系由一个滑移面和该面内的滑移方向组成。晶体优先沿原子排列最密的面和方向滑移；可独立启动的滑移系数量影响多晶材料的塑性。滑移系与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-164","category":"05 形变、强化与再结晶","title":"滑移面","en":"slip plane","explanation":"位错容易运动的晶面。滑移面与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-165","category":"05 形变、强化与再结晶","title":"滑移方向","en":"slip direction","explanation":"位错容易运动的方向。滑移方向与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-166","category":"05 形变、强化与再结晶","title":"孪生","en":"twinning","explanation":"晶体塑性变形机制之一。孪生与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-167","category":"05 形变、强化与再结晶","title":"形变孪晶","en":"deformation twin","explanation":"塑性变形过程中形成的孪晶。形变孪晶与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-168","category":"05 形变、强化与再结晶","title":"加工硬化","en":"work hardening","explanation":"加工硬化是材料随塑性变形程度增加而强度、硬度提高的现象，主要来源于位错密度增加及位错间相互缠结，使后续位错运动更加困难。加工硬化通过增强位错相互作用提高强度。","source":"教材主干"},{"id":"c-169","category":"05 形变、强化与再结晶","title":"应变硬化","en":"strain hardening","explanation":"work hardening同义表达。应变硬化与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-170","category":"05 形变、强化与再结晶","title":"固溶强化","en":"solid-solution strengthening","explanation":"溶质原子阻碍位错运动。固溶强化与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-171","category":"05 形变、强化与再结晶","title":"细晶强化","en":"grain refinement strengthening","explanation":"晶界阻碍位错运动提高强度。细晶强化与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-172","category":"05 形变、强化与再结晶","title":"Hall-Petch关系","en":"Hall-Petch relation","explanation":"强度与晶粒尺寸相关。Hall-Petch关系与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-173","category":"05 形变、强化与再结晶","title":"析出强化","en":"precipitation strengthening","explanation":"析出相阻碍位错运动。析出强化与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-174","category":"05 形变、强化与再结晶","title":"弥散强化","en":"dispersion strengthening","explanation":"弥散第二相阻碍位错运动。弥散强化与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-175","category":"05 形变、强化与再结晶","title":"位错强化","en":"dislocation strengthening","explanation":"提高位错密度增加运动阻力。位错强化与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-176","category":"05 形变、强化与再结晶","title":"Orowan机制","en":"Orowan mechanism","explanation":"位错绕过不可切割颗粒。Orowan机制与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-177","category":"05 形变、强化与再结晶","title":"颗粒切过机制","en":"particle shearing","explanation":"位错切过可切割析出相。颗粒切过机制与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-178","category":"05 形变、强化与再结晶","title":"冷加工","en":"cold working","explanation":"低于再结晶温度进行塑性变形。冷加工与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-179","category":"05 形变、强化与再结晶","title":"热加工","en":"hot working","explanation":"高于再结晶温度进行塑性变形。热加工与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-180","category":"05 形变、强化与再结晶","title":"回复","en":"recovery","explanation":"回复发生在冷变形材料加热的较低温阶段，主要通过点缺陷消除和位错重排降低内应力与储存能，晶粒形貌通常不会发生彻底重构。回复与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-181","category":"05 形变、强化与再结晶","title":"再结晶","en":"recrystallization","explanation":"再结晶是在足够变形储能和适当温度下形成并长大低位错密度新晶粒的过程，可显著消除加工硬化并恢复塑性。再结晶会形成位错密度较低的新晶粒。","source":"教材主干"},{"id":"c-182","category":"05 形变、强化与再结晶","title":"再结晶温度","en":"recrystallization temperature","explanation":"发生再结晶的特征温度。再结晶温度与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-183","category":"05 形变、强化与再结晶","title":"再结晶形核","en":"nucleation of recrystallization","explanation":"新晶粒形成过程。再结晶形核与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-184","category":"05 形变、强化与再结晶","title":"晶粒长大","en":"grain growth","explanation":"再结晶完成后继续加热时，部分晶粒通过晶界迁移长大以降低总晶界面积和界面能。温度、时间、第二相颗粒和织构都会影响晶粒长大。晶粒长大与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-185","category":"05 形变、强化与再结晶","title":"异常晶粒长大","en":"abnormal grain growth","explanation":"少数晶粒异常快速长大。异常晶粒长大与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-186","category":"05 形变、强化与再结晶","title":"织构","en":"texture","explanation":"多晶材料晶粒取向呈统计择优。织构与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-187","category":"05 形变、强化与再结晶","title":"再结晶织构","en":"recrystallization texture","explanation":"再结晶形成的择优取向。再结晶织构与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-188","category":"05 形变、强化与再结晶","title":"退火孪晶","en":"annealing twin","explanation":"退火过程中形成的孪晶。退火孪晶与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-189","category":"05 形变、强化与再结晶","title":"残余应力","en":"residual stress","explanation":"卸载后仍保留在材料内部的应力。残余应力与形变、强化或再结晶密切相关。","source":"教材主干"},{"id":"c-190","category":"06 热力学、相图与凝固","title":"热力学","en":"thermodynamics","explanation":"研究能量与平衡规律。","source":"教材主干"},{"id":"c-191","category":"06 热力学、相图与凝固","title":"相","en":"phase","explanation":"相是在给定尺度上具有均一结构、成分和物理化学性质的区域。一个显微组织可以由一个或多个相以及这些相的形态、尺寸和分布共同构成。","source":"教材主干"},{"id":"c-192","category":"06 热力学、相图与凝固","title":"组元","en":"component","explanation":"构成系统的基本化学成分。","source":"教材主干"},{"id":"c-193","category":"06 热力学、相图与凝固","title":"组织组成物","en":"microconstituent","explanation":"显微组织中可辨识的组成部分。","source":"教材主干"},{"id":"c-194","category":"06 热力学、相图与凝固","title":"相平衡","en":"phase equilibrium","explanation":"各相在给定条件下达到平衡。","source":"教材主干"},{"id":"c-195","category":"06 热力学、相图与凝固","title":"吉布斯自由能","en":"Gibbs free energy","explanation":"判断过程方向的重要势函数。","source":"教材主干"},{"id":"c-196","category":"06 热力学、相图与凝固","title":"焓","en":"enthalpy","explanation":"热力学状态函数。","source":"教材主干"},{"id":"c-197","category":"06 热力学、相图与凝固","title":"熵","en":"entropy","explanation":"与系统微观状态数相关。","source":"教材主干"},{"id":"c-198","category":"06 热力学、相图与凝固","title":"吉布斯相律","en":"Gibbs phase rule","explanation":"相律把平衡体系的自由度F与组元数C和相数P联系起来。常见形式F=C-P+2；在恒压条件下常写为F=C-P+1。","source":"教材主干"},{"id":"c-199","category":"06 热力学、相图与凝固","title":"自由度","en":"degree of freedom","explanation":"系统独立可变的强度变量数。","source":"教材主干"},{"id":"c-200","category":"06 热力学、相图与凝固","title":"相图","en":"phase diagram","explanation":"表示温度成分等条件下平衡相关系。相图表示不同温度和成分下的平衡相。","source":"教材主干"},{"id":"c-201","category":"06 热力学、相图与凝固","title":"二元相图","en":"binary phase diagram","explanation":"含两个组元的相图。","source":"教材主干"},{"id":"c-202","category":"06 热力学、相图与凝固","title":"三元相图","en":"ternary phase diagram","explanation":"含三个组元的相图。","source":"教材主干"},{"id":"c-203","category":"06 热力学、相图与凝固","title":"匀晶相图","en":"isomorphous phase diagram","explanation":"液固两相完全互溶体系。","source":"教材主干"},{"id":"c-204","category":"06 热力学、相图与凝固","title":"共晶相图","en":"eutectic phase diagram","explanation":"含共晶反应的二元相图。","source":"教材主干"},{"id":"c-205","category":"06 热力学、相图与凝固","title":"包晶相图","en":"peritectic phase diagram","explanation":"含包晶反应的二元相图。","source":"教材主干"},{"id":"c-206","category":"06 热力学、相图与凝固","title":"共析反应","en":"eutectoid reaction","explanation":"一个固相转变为两个固相。","source":"教材主干"},{"id":"c-207","category":"06 热力学、相图与凝固","title":"共晶反应","en":"eutectic reaction","explanation":"共晶反应是在共晶温度和成分下，液相同时转变为两个固相，形式为L→α+β。共晶组织的尺度和形貌与凝固速度、界面动力学有关。共晶反应使一个液相转变为两个固相。","source":"教材主干"},{"id":"c-208","category":"06 热力学、相图与凝固","title":"包晶反应","en":"peritectic reaction","explanation":"包晶反应通常表现为液相与一个已有固相反应生成新的固相，形式为L+α→β。反应受固相包围和扩散过程限制时可能不完全。","source":"教材主干"},{"id":"c-209","category":"06 热力学、相图与凝固","title":"包析反应","en":"peritectoid reaction","explanation":"两个固相反应形成另一固相。","source":"教材主干"},{"id":"c-210","category":"06 热力学、相图与凝固","title":"液相线","en":"liquidus","explanation":"液相开始析出固相的边界。","source":"教材主干"},{"id":"c-211","category":"06 热力学、相图与凝固","title":"固相线","en":"solidus","explanation":"液相完全消失的边界。","source":"教材主干"},{"id":"c-212","category":"06 热力学、相图与凝固","title":"固溶度线","en":"solvus","explanation":"固态溶解度极限边界。","source":"教材主干"},{"id":"c-213","category":"06 热力学、相图与凝固","title":"连线","en":"tie line","explanation":"两相区内连接两平衡相成分的线。","source":"教材主干"},{"id":"c-214","category":"06 热力学、相图与凝固","title":"杠杆定律","en":"lever rule","explanation":"杠杆定律用于两相区中计算相的相对含量：某一相的比例等于总成分点到另一相边界成分的距离占整条系线长度的比例。杠杆定律用于计算两相区中的相含量。","source":"教材主干"},{"id":"c-215","category":"06 热力学、相图与凝固","title":"公切线法","en":"common tangent construction","explanation":"由自由能曲线判断多相平衡。","source":"教材主干"},{"id":"c-216","category":"06 热力学、相图与凝固","title":"自由能-成分曲线","en":"free-energy-composition curve","explanation":"相图热力学分析基础。","source":"教材主干"},{"id":"c-217","category":"06 热力学、相图与凝固","title":"溶混间隙","en":"miscibility gap","explanation":"体系分成两个相的成分范围。","source":"教材主干"},{"id":"c-218","category":"06 热力学、相图与凝固","title":"调幅分解","en":"spinodal decomposition","explanation":"无形核势垒的连续分解过程。","source":"教材主干"},{"id":"c-219","category":"06 热力学、相图与凝固","title":"凝固","en":"solidification","explanation":"液态向固态转变。","source":"教材主干"},{"id":"c-220","category":"06 热力学、相图与凝固","title":"结晶","en":"crystallization","explanation":"形成晶体结构的过程。","source":"教材主干"},{"id":"c-221","category":"06 热力学、相图与凝固","title":"形核","en":"nucleation","explanation":"形核是新相从母相中形成稳定微小核心的过程。体积自由能降低提供驱动力，界面能增加形成能垒；超过临界尺寸的晶核才倾向继续长大。凝固通常从形核开始。","source":"教材主干"},{"id":"c-222","category":"06 热力学、相图与凝固","title":"均匀形核","en":"homogeneous nucleation","explanation":"在母相内部自发形成晶核。","source":"教材主干"},{"id":"c-223","category":"06 热力学、相图与凝固","title":"非均匀形核","en":"heterogeneous nucleation","explanation":"在界面或杂质处优先形核。","source":"教材主干"},{"id":"c-224","category":"06 热力学、相图与凝固","title":"临界晶核","en":"critical nucleus","explanation":"临界晶核位于形核自由能曲线的极大值处。小于临界半径的晶胚更容易消失，大于临界半径后体积自由能收益占优，新相可自发长大。","source":"教材主干"},{"id":"c-225","category":"06 热力学、相图与凝固","title":"临界半径","en":"critical radius","explanation":"临界晶核的半径。","source":"教材主干"},{"id":"c-226","category":"06 热力学、相图与凝固","title":"形核势垒","en":"nucleation barrier","explanation":"形成临界晶核需克服的自由能障碍。","source":"教材主干"},{"id":"c-227","category":"06 热力学、相图与凝固","title":"过冷度","en":"undercooling","explanation":"过冷度是实际液体温度低于平衡凝固温度的差值。增大过冷通常提高形核驱动力，同时会改变形核和长大的相对速率，从而影响晶粒尺寸。较大的过冷度通常会提高形核驱动力。","source":"教材主干"},{"id":"c-228","category":"06 热力学、相图与凝固","title":"驱动力","en":"driving force","explanation":"推动相变发生的自由能差。","source":"教材主干"},{"id":"c-229","category":"06 热力学、相图与凝固","title":"晶体长大","en":"crystal growth","explanation":"晶核持续吸收原子而长大。","source":"教材主干"},{"id":"c-230","category":"06 热力学、相图与凝固","title":"长大速率","en":"growth rate","explanation":"晶体尺寸随时间增加的速度。","source":"教材主干"},{"id":"c-231","category":"06 热力学、相图与凝固","title":"凝固界面","en":"solidification front","explanation":"固液两相之间移动的界面。","source":"教材主干"},{"id":"c-232","category":"06 热力学、相图与凝固","title":"枝晶","en":"dendrite","explanation":"树枝状晶体。","source":"教材主干"},{"id":"c-233","category":"06 热力学、相图与凝固","title":"枝晶生长","en":"dendritic growth","explanation":"常见凝固晶体生长形态。","source":"教材主干"},{"id":"c-234","category":"06 热力学、相图与凝固","title":"成分过冷","en":"constitutional undercooling","explanation":"溶质富集导致界面前沿过冷。","source":"教材主干"},{"id":"c-235","category":"06 热力学、相图与凝固","title":"偏析","en":"segregation","explanation":"组元在空间上分布不均匀。","source":"教材主干"},{"id":"c-236","category":"06 热力学、相图与凝固","title":"微观偏析","en":"microsegregation","explanation":"晶粒或枝晶尺度的成分不均匀。","source":"教材主干"},{"id":"c-237","category":"06 热力学、相图与凝固","title":"宏观偏析","en":"macrosegregation","explanation":"铸锭宏观尺度的成分不均匀。","source":"教材主干"},{"id":"c-238","category":"06 热力学、相图与凝固","title":"平衡分配系数","en":"partition coefficient","explanation":"固相与液相平衡成分之比。","source":"教材主干"},{"id":"c-239","category":"06 热力学、相图与凝固","title":"铸态组织","en":"casting structure","explanation":"凝固后形成的典型组织。","source":"教材主干"},{"id":"c-240","category":"06 热力学、相图与凝固","title":"柱状晶","en":"columnar grain","explanation":"沿特定方向长大的细长晶粒。","source":"教材主干"},{"id":"c-241","category":"06 热力学、相图与凝固","title":"等轴晶","en":"equiaxed grain","explanation":"各方向尺寸相近的晶粒。","source":"教材主干"},{"id":"c-242","category":"07 固态相变与热处理","title":"固态相变","en":"solid-state phase transformation","explanation":"固态材料内部发生的相变。例如，钢中奥氏体在冷却时可转变为珠光体、贝氏体或马氏体，这些都属于固态相变。","source":"教材主干"},{"id":"c-243","category":"07 固态相变与热处理","title":"相变动力学","en":"phase transformation kinetics","explanation":"描述相变速率与时间关系。同一钢种在不同温度下完成转变所需时间不同，TTT曲线就是相变动力学的一种表达。","source":"教材主干"},{"id":"c-244","category":"07 固态相变与热处理","title":"形核与长大","en":"nucleation and growth","explanation":"许多相变的基本过程。例如，析出强化时通常先形成稳定晶核，随后第二相颗粒持续长大。","source":"教材主干"},{"id":"c-245","category":"07 固态相变与热处理","title":"奥氏体","en":"austenite","explanation":"钢中高温FCC固溶体。45钢加热进入奥氏体区后，原有铁素体和珠光体会逐步转变为奥氏体。","source":"教材主干"},{"id":"c-246","category":"07 固态相变与热处理","title":"铁素体","en":"ferrite","explanation":"以BCC α-Fe为基础的固溶体。室温低碳钢中的铁素体通常构成软韧的BCC基体。","source":"教材主干"},{"id":"c-247","category":"07 固态相变与热处理","title":"渗碳体","en":"cementite","explanation":"Fe3C化合物。珠光体中的硬脆层片之一就是Fe3C渗碳体。","source":"教材主干"},{"id":"c-248","category":"07 固态相变与热处理","title":"珠光体","en":"pearlite","explanation":"珠光体是奥氏体发生共析转变形成的铁素体与渗碳体两相组织，常呈层片状；转变温度越低，层片间距通常越小，强度和硬度越高。","source":"教材主干"},{"id":"c-249","category":"07 固态相变与热处理","title":"贝氏体","en":"bainite","explanation":"贝氏体是在珠光体与马氏体转变温区之间形成的一类组织，其形成涉及剪切和碳扩散等过程，具体形貌和机制随温度与成分变化。","source":"教材主干"},{"id":"c-250","category":"07 固态相变与热处理","title":"马氏体","en":"martensite","explanation":"马氏体主要通过无扩散、协同剪切型晶格变换形成。在钢中通常具有高位错/高缺陷密度和较高硬度，其形态与碳含量及转变温度相关。马氏体通过无扩散相变形成。","source":"教材主干"},{"id":"c-251","category":"07 固态相变与热处理","title":"马氏体转变","en":"martensitic transformation","explanation":"无扩散切变型相变。钢快速淬火时，奥氏体可通过协同剪切转变为马氏体，碳来不及发生长程扩散。","source":"教材主干"},{"id":"c-252","category":"07 固态相变与热处理","title":"扩散型相变","en":"diffusional transformation","explanation":"依赖长程原子扩散。珠光体转变需要碳重新分配，因此属于扩散型相变。","source":"教材主干"},{"id":"c-253","category":"07 固态相变与热处理","title":"无扩散相变","en":"diffusionless transformation","explanation":"无需长程扩散的相变。马氏体转变依靠原子协同位移完成，不需要碳进行长程扩散。","source":"教材主干"},{"id":"c-254","category":"07 固态相变与热处理","title":"奥氏体分解","en":"austenite decomposition","explanation":"奥氏体向其他组织转变。共析钢冷却到A1以下后，奥氏体可分解成铁素体和渗碳体组成的珠光体。","source":"教材主干"},{"id":"c-255","category":"07 固态相变与热处理","title":"析出","en":"precipitation","explanation":"过饱和固溶体中形成第二相。Al-Cu合金固溶淬火后时效，会从过饱和固溶体中逐步析出富Cu第二相。","source":"教材主干"},{"id":"c-256","category":"07 固态相变与热处理","title":"析出相","en":"precipitate","explanation":"析出形成的第二相颗粒。时效铝合金中的细小弥散析出相可阻碍位错运动并提高强度。","source":"教材主干"},{"id":"c-257","category":"07 固态相变与热处理","title":"过饱和固溶体","en":"supersaturated solid solution","explanation":"溶质含量超过平衡固溶度。高温固溶后快速淬火，可以把超过室温平衡固溶度的溶质暂时保留在基体中。","source":"教材主干"},{"id":"c-258","category":"07 固态相变与热处理","title":"时效硬化","en":"age hardening","explanation":"析出过程使合金强度提高。Al-Cu合金在适当时效温度下形成细小析出物后，硬度会先升高，并在过时效后下降。","source":"教材主干"},{"id":"c-259","category":"07 固态相变与热处理","title":"固溶处理","en":"solution treatment","explanation":"将第二相溶入基体并快速冷却。铝合金固溶处理时先加热使可溶第二相进入基体，再淬火保留过饱和固溶体。","source":"教材主干"},{"id":"c-260","category":"07 固态相变与热处理","title":"淬火","en":"quenching","explanation":"快速冷却获得非平衡组织。中碳钢从奥氏体区快速水冷可抑制扩散型转变并形成马氏体。","source":"教材主干"},{"id":"c-261","category":"07 固态相变与热处理","title":"回火","en":"tempering","explanation":"淬火后加热调整组织性能。淬火钢回火后，部分过饱和碳析出，内应力下降，韧性通常提高。","source":"教材主干"},{"id":"c-262","category":"07 固态相变与热处理","title":"退火","en":"annealing","explanation":"加热保温后适当冷却改善组织性能。冷加工金属退火时可经历回复、再结晶和晶粒长大，硬度下降而塑性恢复。","source":"教材主干"},{"id":"c-263","category":"07 固态相变与热处理","title":"正火","en":"normalizing","explanation":"钢加热奥氏体化后空冷。45钢奥氏体化后空冷通常获得比退火更细的铁素体和珠光体组织。","source":"教材主干"},{"id":"c-264","category":"07 固态相变与热处理","title":"热处理","en":"heat treatment","explanation":"通过加热保温冷却改变组织性能。同一钢材改变加热温度、保温时间和冷却速度，就可能得到完全不同的组织和力学性能。","source":"教材主干"},{"id":"c-265","category":"07 固态相变与热处理","title":"等温转变图","en":"TTT diagram","explanation":"时间-温度-转变图。在TTT图上，把奥氏体迅速冷到某一温度并等温，可读取珠光体或贝氏体转变开始和终了时间。","source":"教材主干"},{"id":"c-266","category":"07 固态相变与热处理","title":"连续冷却转变图","en":"CCT diagram","explanation":"连续冷却条件下的转变图。CCT图用于连续冷却，可判断不同冷却速度下最终得到铁素体、珠光体、贝氏体还是马氏体。","source":"教材主干"},{"id":"c-267","category":"07 固态相变与热处理","title":"粗化","en":"coarsening","explanation":"第二相颗粒随时间长大。高温长时间时效会使第二相颗粒变大、数量减少，常导致析出强化效果下降。","source":"教材主干"},{"id":"c-268","category":"07 固态相变与热处理","title":"奥斯特瓦尔德熟化","en":"Ostwald ripening","explanation":"大颗粒长大、小颗粒溶解。熟化过程中小颗粒因曲率更大而优先溶解，溶质扩散到大颗粒使其继续长大。","source":"教材主干"},{"id":"c-269","category":"07 固态相变与热处理","title":"亚稳相","en":"metastable phase","explanation":"非最稳定但可长期存在的相。快速冷却可把热力学上并非最稳定的马氏体等亚稳相保留下来。","source":"教材主干"},{"id":"c-270","category":"07 固态相变与热处理","title":"亚稳态","en":"metastable state","explanation":"处于局部自由能极小的状态。过饱和固溶体可因动力学受阻暂时停留在局部自由能低谷，随后时效再向更稳定状态演化。","source":"教材主干"},{"id":"c-271","category":"07 固态相变与热处理","title":"纳米晶材料","en":"nanocrystalline material","explanation":"晶粒尺寸处于纳米尺度。纳米晶金属的晶粒可以小到几十纳米，大量晶界会显著影响强度、扩散和热稳定性。","source":"教材主干"},{"id":"c-272","category":"07 固态相变与热处理","title":"准晶","en":"quasicrystal","explanation":"长程有序但无传统平移周期。准晶可以表现五重等传统周期晶体禁止的旋转对称，同时仍具有尖锐衍射斑点。","source":"教材主干"},{"id":"c-273","category":"07 固态相变与热处理","title":"金属玻璃","en":"metallic glass","explanation":"非晶态金属材料。金属熔体以足够快速度冷却可抑制结晶，得到没有长程周期结构的金属玻璃。","source":"教材主干"},{"id":"c-274","category":"07 固态相变与热处理","title":"玻璃化转变","en":"glass transition","explanation":"非晶高分子等状态转变。非晶聚合物经过Tg附近时链段运动明显增强，材料模量会显著下降。","source":"教材主干"},{"id":"c-275","category":"08 材料表征与分析","title":"材料表征","en":"materials characterization","explanation":"获取材料结构和成分信息。材料表征把测量信号与材料的成分、结构和性能联系起来。","source":"985表征课程"},{"id":"c-276","category":"08 材料表征与分析","title":"微观组织表征","en":"microstructural characterization","explanation":"表征材料微观组织。微观组织表征显示热处理后的样品晶粒更细。","source":"985表征课程"},{"id":"c-277","category":"08 材料表征与分析","title":"X射线衍射","en":"X-ray diffraction","explanation":"X射线衍射利用晶体周期结构对X射线的相干散射，可用于物相鉴定、晶格参数和晶面间距分析，并可进一步估算晶粒/晶畴与残余应力等。我们利用X射线衍射鉴定样品中的物相。","source":"985表征课程"},{"id":"c-278","category":"08 材料表征与分析","title":"X射线衍射","en":"XRD","explanation":"常用于物相鉴定和晶体结构分析。XRD常用于物相鉴定和晶体结构分析。","source":"985表征课程"},{"id":"c-279","category":"08 材料表征与分析","title":"布拉格定律","en":"Bragg's law","explanation":"X射线衍射基本关系。布拉格定律把衍射角与晶面间距联系起来。","source":"985表征课程"},{"id":"c-280","category":"08 材料表征与分析","title":"衍射峰","en":"diffraction peak","explanation":"衍射图谱中的峰。衍射峰位置的移动可能表明晶面间距发生变化。","source":"985表征课程"},{"id":"c-281","category":"08 材料表征与分析","title":"衍射图谱","en":"diffraction pattern","explanation":"XRD或电子衍射产生的图样。相变发生后，衍射图谱出现了明显变化。","source":"985表征课程"},{"id":"c-282","category":"08 材料表征与分析","title":"物相鉴定","en":"phase identification","explanation":"根据衍射或谱学判断相组成。物相鉴定确认样品中存在两种晶体相。","source":"985表征课程"},{"id":"c-283","category":"08 材料表征与分析","title":"点阵常数","en":"lattice constant","explanation":"可通过衍射数据计算。点阵常数由测得的衍射角计算得到。","source":"985表征课程"},{"id":"c-284","category":"08 材料表征与分析","title":"晶粒/晶畴尺寸","en":"crystallite size","explanation":"常由峰宽估算纳米晶尺寸。高能球磨后晶畴尺寸减小。","source":"985表征课程"},{"id":"c-285","category":"08 材料表征与分析","title":"谢乐公式","en":"Scherrer equation","explanation":"由衍射峰宽估算晶粒尺寸。谢乐公式可根据衍射峰展宽近似估算晶畴尺寸。","source":"985表征课程"},{"id":"c-286","category":"08 材料表征与分析","title":"扫描电子显微镜","en":"scanning electron microscopy","explanation":"SEM用聚焦电子束扫描样品表面，通过二次电子、背散射电子等信号获取形貌和成分衬度，并可与EDS结合进行微区元素分析。扫描电子显微镜显示了样品表面的孔隙和断裂特征。","source":"985表征课程"},{"id":"c-287","category":"08 材料表征与分析","title":"扫描电子显微镜","en":"SEM","explanation":"观察表面形貌和微观组织。SEM图像显示第二相主要分布在晶界附近。","source":"985表征课程"},{"id":"c-288","category":"08 材料表征与分析","title":"二次电子","en":"secondary electron","explanation":"SEM常用成像信号。二次电子在SEM成像中能够提供明显的表面形貌衬度。","source":"985表征课程"},{"id":"c-289","category":"08 材料表征与分析","title":"背散射电子","en":"backscattered electron","explanation":"与平均原子序数相关。背散射电子衬度可突出平均原子序数不同的区域。","source":"985表征课程"},{"id":"c-290","category":"08 材料表征与分析","title":"透射电子显微镜","en":"transmission electron microscopy","explanation":"TEM要求电子透过足够薄的样品，可获得纳米甚至原子尺度的内部结构、晶格、位错和界面信息，并可结合电子衍射分析晶体结构。透射电子显微镜能够揭示薄样品内部的纳米尺度缺陷。","source":"985表征课程"},{"id":"c-291","category":"08 材料表征与分析","title":"透射电子显微镜","en":"TEM","explanation":"高分辨观察内部微结构。TEM能够以较高空间分辨率观察材料内部微观结构。","source":"985表征课程"},{"id":"c-292","category":"08 材料表征与分析","title":"高分辨透射电镜","en":"high-resolution TEM","explanation":"HRTEM。高分辨TEM能够分辨界面附近的晶格条纹。","source":"985表征课程"},{"id":"c-293","category":"08 材料表征与分析","title":"扫描透射电子显微镜","en":"STEM","explanation":"扫描式TEM。STEM用于扫描界面并同步获取成分信息。","source":"985表征课程"},{"id":"c-294","category":"08 材料表征与分析","title":"选区电子衍射","en":"selected-area electron diffraction","explanation":"SAED。选区电子衍射有助于确定局部晶体结构。","source":"985表征课程"},{"id":"c-295","category":"08 材料表征与分析","title":"电子衍射","en":"electron diffraction","explanation":"利用电子波获取晶体结构信息。电子衍射证实该纳米颗粒具有晶体结构。","source":"985表征课程"},{"id":"c-296","category":"08 材料表征与分析","title":"能量色散X射线谱","en":"energy-dispersive X-ray spectroscopy","explanation":"EDS/EDX。能量色散X射线谱显示氧元素在表面附近富集。","source":"985表征课程"},{"id":"c-297","category":"08 材料表征与分析","title":"能谱分析","en":"EDS","explanation":"用于元素成分分析。EDS常与SEM结合进行元素成分分析。","source":"985表征课程"},{"id":"c-298","category":"08 材料表征与分析","title":"元素面分布","en":"elemental mapping","explanation":"显示元素空间分布。元素面分布显示了合金元素是否分布均匀。","source":"985表征课程"},{"id":"c-299","category":"08 材料表征与分析","title":"电子能量损失谱","en":"electron energy-loss spectroscopy","explanation":"EELS。EELS可在TEM中探测局部成分和电子结构。","source":"985表征课程"},{"id":"c-300","category":"08 材料表征与分析","title":"X射线光电子能谱","en":"X-ray photoelectron spectroscopy","explanation":"XPS利用光电效应测量电子结合能，主要分析材料表面数纳米范围的元素组成和化学价态，对表面污染和充电效应较敏感。XPS用于区分样品表面不同的氧化态。","source":"985表征课程"},{"id":"c-301","category":"08 材料表征与分析","title":"X射线光电子能谱","en":"XPS","explanation":"分析表面元素组成和化学态。XPS能够提供表面元素组成和化学态信息。","source":"985表征课程"},{"id":"c-302","category":"08 材料表征与分析","title":"结合能","en":"binding energy","explanation":"XPS关键横坐标。结合能的变化可能表示化学环境发生改变。","source":"985表征课程"},{"id":"c-303","category":"08 材料表征与分析","title":"俄歇电子能谱","en":"Auger electron spectroscopy","explanation":"AES。俄歇电子能谱适用于表面敏感的元素分析。","source":"985表征课程"},{"id":"c-304","category":"08 材料表征与分析","title":"拉曼光谱","en":"Raman spectroscopy","explanation":"振动光谱表征方法。拉曼光谱能够提供振动和结构信息。","source":"985表征课程"},{"id":"c-305","category":"08 材料表征与分析","title":"拉曼位移","en":"Raman shift","explanation":"拉曼谱横坐标。拉曼位移反映材料中振动模式的能量。","source":"985表征课程"},{"id":"c-306","category":"08 材料表征与分析","title":"傅里叶变换红外光谱","en":"Fourier-transform infrared spectroscopy","explanation":"FTIR。FTIR用于识别表面处理后引入的官能团。","source":"985表征课程"},{"id":"c-307","category":"08 材料表征与分析","title":"傅里叶变换红外光谱","en":"FTIR","explanation":"分析分子振动和化学键。FTIR谱显示改性后出现了新的吸收峰。","source":"985表征课程"},{"id":"c-308","category":"08 材料表征与分析","title":"紫外可见吸收光谱","en":"UV-Vis spectroscopy","explanation":"光学吸收表征。紫外可见光谱用于估算材料的光学吸收边。","source":"985表征课程"},{"id":"c-309","category":"08 材料表征与分析","title":"光致发光","en":"photoluminescence","explanation":"PL。较强的光致发光可能说明辐射复合效率较高。","source":"985表征课程"},{"id":"c-310","category":"08 材料表征与分析","title":"光致发光光谱","en":"PL spectroscopy","explanation":"研究发光和缺陷相关过程。PL光谱有助于比较两种薄膜中的载流子复合行为。","source":"985表征课程"},{"id":"c-311","category":"08 材料表征与分析","title":"原子力显微镜","en":"atomic force microscopy","explanation":"AFM。原子力显微镜测量了薄膜的纳米尺度表面形貌。","source":"985表征课程"},{"id":"c-312","category":"08 材料表征与分析","title":"原子力显微镜","en":"AFM","explanation":"测量表面形貌。AFM显示沉积薄膜具有更低的表面粗糙度。","source":"985表征课程"},{"id":"c-313","category":"08 材料表征与分析","title":"扫描隧道显微镜","en":"scanning tunneling microscopy","explanation":"STM。扫描隧道显微镜能够以原子尺度分辨率观察导电表面。","source":"985表征课程"},{"id":"c-314","category":"08 材料表征与分析","title":"表面粗糙度","en":"surface roughness","explanation":"表面起伏程度。较低的表面粗糙度有助于改善薄膜器件的接触质量。","source":"985表征课程"},{"id":"c-315","category":"08 材料表征与分析","title":"差示扫描量热法","en":"differential scanning calorimetry","explanation":"DSC。差示扫描量热法检测到结晶过程中的放热峰。","source":"985表征课程"},{"id":"c-316","category":"08 材料表征与分析","title":"差示扫描量热","en":"DSC","explanation":"分析热效应和相变。DSC曲线显示了相变发生的温度范围。","source":"985表征课程"},{"id":"c-317","category":"08 材料表征与分析","title":"热重分析","en":"thermogravimetric analysis","explanation":"TGA。热重分析测量了样品加热过程中的质量损失。","source":"985表征课程"},{"id":"c-318","category":"08 材料表征与分析","title":"热重分析","en":"TGA","explanation":"测量质量随温度变化。TGA曲线表明该材料在400摄氏度以下保持稳定。","source":"985表征课程"},{"id":"c-319","category":"08 材料表征与分析","title":"差热分析","en":"differential thermal analysis","explanation":"DTA。差热分析在相变温度附近显示出明显的热效应。","source":"985表征课程"},{"id":"c-320","category":"08 材料表征与分析","title":"热分析","en":"thermal analysis","explanation":"利用温度变化研究材料行为。热分析有助于判断材料在加热和冷却过程中的响应。","source":"985表征课程"},{"id":"c-321","category":"08 材料表征与分析","title":"光学显微镜","en":"optical microscopy","explanation":"OM。光学显微镜用于观察整体晶粒形貌。","source":"985表征课程"},{"id":"c-322","category":"08 材料表征与分析","title":"金相学","en":"metallography","explanation":"研究金属显微组织。金相观察显示钢样中存在铁素体和珠光体。","source":"985表征课程"},{"id":"c-323","category":"08 材料表征与分析","title":"金相制样","en":"metallographic sample preparation","explanation":"研磨抛光腐蚀等步骤。良好的金相制样是准确显示真实组织的基础。","source":"985表征课程"},{"id":"c-324","category":"08 材料表征与分析","title":"抛光","en":"polishing","explanation":"制备光滑样品表面。抛光用于在显微观察前去除细小划痕。","source":"985表征课程"},{"id":"c-325","category":"08 材料表征与分析","title":"磨制","en":"grinding","explanation":"使用磨料去除表面材料。磨制逐步去除切割表面的变形层和损伤。","source":"985表征课程"},{"id":"c-326","category":"08 材料表征与分析","title":"浸蚀","en":"etching","explanation":"显现金相组织。浸蚀能够使晶界在光学显微镜下显现出来。","source":"985表征课程"},{"id":"c-327","category":"08 材料表征与分析","title":"样品制备","en":"sample preparation","explanation":"测试前的样品处理。仔细的样品制备可避免把制样伪影误认为真实组织。","source":"985表征课程"},{"id":"c-328","category":"08 材料表征与分析","title":"截面","en":"cross section","explanation":"样品切面。我们制备截面来观察涂层厚度和界面。","source":"985表征课程"},{"id":"c-329","category":"08 材料表征与分析","title":"断口分析","en":"fractography","explanation":"研究断裂表面特征。断口分析有助于判断裂纹是由疲劳还是过载扩展。","source":"985表征课程"},{"id":"c-330","category":"08 材料表征与分析","title":"断口","en":"fracture surface","explanation":"材料断裂后形成的表面。断口上的贝壳纹可能表明疲劳裂纹扩展。","source":"985表征课程"},{"id":"c-331","category":"08 材料表征与分析","title":"晶粒尺寸测量","en":"grain size measurement","explanation":"组织定量分析。晶粒尺寸测量用于比较两种热处理工艺的影响。","source":"985表征课程"},{"id":"c-332","category":"08 材料表征与分析","title":"图像分析","en":"image analysis","explanation":"从显微图像提取定量信息。图像分析把显微图像转化为相含量等定量数据。","source":"985表征课程"},{"id":"c-333","category":"08 材料表征与分析","title":"信噪比","en":"signal-to-noise ratio","explanation":"信号质量指标。更高的信噪比有助于分辨较弱的光谱特征。","source":"985表征课程"},{"id":"c-334","category":"08 材料表征与分析","title":"空间分辨率","en":"spatial resolution","explanation":"区分邻近空间细节的能力。空间分辨率决定成像系统能够区分的最小空间距离。","source":"985表征课程"},{"id":"c-335","category":"08 材料表征与分析","title":"光谱分辨率","en":"spectral resolution","explanation":"区分邻近光谱特征的能力。光谱分辨率决定两个相邻峰能否被区分。","source":"985表征课程"},{"id":"c-336","category":"08 材料表征与分析","title":"原位表征","en":"in situ characterization","explanation":"外场或反应过程中实时观测。原位表征能够在样品加热过程中跟踪结构变化。","source":"985表征课程"},{"id":"c-337","category":"08 材料表征与分析","title":"工况表征","en":"operando characterization","explanation":"实际工作状态下进行表征。工况表征在器件真实工作状态下测量材料行为。","source":"985表征课程"},{"id":"c-338","category":"09 材料制备、粉末冶金与硬质合金","title":"材料加工与制备","en":"materials processing","explanation":"由原料获得目标材料和结构的过程。","source":"个人项目+工程术语"},{"id":"c-339","category":"09 材料制备、粉末冶金与硬质合金","title":"粉末冶金","en":"powder metallurgy","explanation":"以粉末成形和烧结制备材料。","source":"个人项目+工程术语"},{"id":"c-340","category":"09 材料制备、粉末冶金与硬质合金","title":"粉末制备","en":"powder preparation","explanation":"获得合适粒度与成分粉末。","source":"个人项目+工程术语"},{"id":"c-341","category":"09 材料制备、粉末冶金与硬质合金","title":"混粉","en":"powder mixing","explanation":"不同粉末均匀混合。","source":"个人项目+工程术语"},{"id":"c-342","category":"09 材料制备、粉末冶金与硬质合金","title":"球磨","en":"ball milling","explanation":"利用研磨介质机械混合和细化粉末。","source":"个人项目+工程术语"},{"id":"c-343","category":"09 材料制备、粉末冶金与硬质合金","title":"高能球磨","en":"high-energy ball milling","explanation":"高能量机械合金化或细化。","source":"个人项目+工程术语"},{"id":"c-344","category":"09 材料制备、粉末冶金与硬质合金","title":"机械合金化","en":"mechanical alloying","explanation":"通过高能球磨形成合金化粉末。","source":"个人项目+工程术语"},{"id":"c-345","category":"09 材料制备、粉末冶金与硬质合金","title":"颗粒尺寸","en":"particle size","explanation":"粉末粒径。","source":"个人项目+工程术语"},{"id":"c-346","category":"09 材料制备、粉末冶金与硬质合金","title":"粒径分布","en":"particle size distribution","explanation":"粉末粒径的统计分布。","source":"个人项目+工程术语"},{"id":"c-347","category":"09 材料制备、粉末冶金与硬质合金","title":"压制成形","en":"compaction","explanation":"粉末在压力下形成生坯。","source":"个人项目+工程术语"},{"id":"c-348","category":"09 材料制备、粉末冶金与硬质合金","title":"生坯","en":"green compact","explanation":"烧结前的压制体。","source":"个人项目+工程术语"},{"id":"c-349","category":"09 材料制备、粉末冶金与硬质合金","title":"生坯密度","en":"green density","explanation":"烧结前压坯密度。","source":"个人项目+工程术语"},{"id":"c-350","category":"09 材料制备、粉末冶金与硬质合金","title":"烧结","en":"sintering","explanation":"通过加热促进颗粒结合致密化。","source":"个人项目+工程术语"},{"id":"c-351","category":"09 材料制备、粉末冶金与硬质合金","title":"固相烧结","en":"solid-state sintering","explanation":"烧结过程中主要保持固态。","source":"个人项目+工程术语"},{"id":"c-352","category":"09 材料制备、粉末冶金与硬质合金","title":"液相烧结","en":"liquid-phase sintering","explanation":"存在液相促进致密化。","source":"个人项目+工程术语"},{"id":"c-353","category":"09 材料制备、粉末冶金与硬质合金","title":"放电等离子烧结","en":"spark plasma sintering","explanation":"SPS在外加压力下采用快速电加热实现粉末致密化，升温快、保温短，有利于减少晶粒长大，常用于纳米晶和难烧结材料。","source":"个人项目+工程术语"},{"id":"c-354","category":"09 材料制备、粉末冶金与硬质合金","title":"放电等离子烧结","en":"SPS","explanation":"快速加热加压烧结技术。SPS能够在烧结过程中实现快速加热和致密化。","source":"个人项目+工程术语"},{"id":"c-355","category":"09 材料制备、粉末冶金与硬质合金","title":"致密化","en":"densification","explanation":"孔隙减少、密度提高。","source":"个人项目+工程术语"},{"id":"c-356","category":"09 材料制备、粉末冶金与硬质合金","title":"相对密度","en":"relative density","explanation":"实际密度与理论密度之比。","source":"个人项目+工程术语"},{"id":"c-357","category":"09 材料制备、粉末冶金与硬质合金","title":"孔隙率","en":"porosity","explanation":"孔隙体积分数。","source":"个人项目+工程术语"},{"id":"c-358","category":"09 材料制备、粉末冶金与硬质合金","title":"抑制晶粒长大","en":"grain growth inhibition","explanation":"保持细晶的重要手段。","source":"个人项目+工程术语"},{"id":"c-359","category":"09 材料制备、粉末冶金与硬质合金","title":"硬质合金","en":"cemented carbide","explanation":"硬质相与金属粘结相组成的复合材料。","source":"个人项目+工程术语"},{"id":"c-360","category":"09 材料制备、粉末冶金与硬质合金","title":"碳化钨","en":"tungsten carbide","explanation":"WC。","source":"个人项目+工程术语"},{"id":"c-361","category":"09 材料制备、粉末冶金与硬质合金","title":"钴粘结相","en":"cobalt binder","explanation":"WC-Co中常见金属粘结相。","source":"个人项目+工程术语"},{"id":"c-362","category":"09 材料制备、粉末冶金与硬质合金","title":"粘结相","en":"binder phase","explanation":"连接硬质颗粒的连续相。","source":"个人项目+工程术语"},{"id":"c-363","category":"09 材料制备、粉末冶金与硬质合金","title":"硬质相","en":"hard phase","explanation":"提供高硬度与耐磨性。","source":"个人项目+工程术语"},{"id":"c-364","category":"09 材料制备、粉末冶金与硬质合金","title":"WC-Co硬质合金","en":"WC-Co cemented carbide","explanation":"典型硬质合金体系。","source":"个人项目+工程术语"},{"id":"c-365","category":"09 材料制备、粉末冶金与硬质合金","title":"断裂韧性","en":"fracture toughness","explanation":"断裂韧性衡量含裂纹材料抵抗不稳定裂纹扩展的能力。它不同于强度，强调已有缺陷条件下材料对裂纹扩展的容忍程度。断裂韧性描述材料抵抗裂纹扩展的能力。","source":"个人项目+工程术语"},{"id":"c-366","category":"09 材料制备、粉末冶金与硬质合金","title":"耐磨性","en":"wear resistance","explanation":"抵抗磨损的能
