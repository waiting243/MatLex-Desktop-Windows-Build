 modeling.","example_zh":"“幽灵原子”是原子模拟与计算材料中常见的概念、参数或方法。","pos":"n. phr.","meanings":["幽灵原子"],"ipa":""},{"id":425,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"nanomaterial","zh":"纳米材料","note":"至少一个维度处于纳米尺度","source":"教材亚稳态+研究常用","example_en":"Nanomaterials can exhibit properties that differ from their bulk counterparts because of size and surface effects.","example_zh":"由于尺寸效应和表面效应，纳米材料可能表现出不同于块体材料的性质。","pos":"n.","meanings":["纳米材料"],"ipa":""},{"id":426,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"nanoparticle","zh":"纳米颗粒","note":"纳米尺度颗粒","source":"教材亚稳态+研究常用","example_en":"The nanoparticles became more prone to agglomeration as their surface energy increased.","example_zh":"随着表面能增大，纳米颗粒更容易发生团聚。","pos":"n.","meanings":["纳米颗粒"],"ipa":""},{"id":427,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"nanorod","zh":"纳米棒","note":"一维长径比较大的纳米结构","source":"教材亚稳态+研究常用","example_en":"The optical response of a nanorod depends strongly on its aspect ratio.","example_zh":"纳米棒的光学响应与其长径比密切相关。","pos":"n.","meanings":["纳米棒"],"ipa":""},{"id":428,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"nanowire","zh":"纳米线","note":"细长的一维纳米材料","source":"教材亚稳态+研究常用","example_en":"Nanowires can provide one-dimensional pathways for charge transport.","example_zh":"纳米线能够为电荷传输提供一维通道。","pos":"n.","meanings":["纳米线"],"ipa":""},{"id":429,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"nanosheet","zh":"纳米片","note":"二维纳米结构","source":"教材亚稳态+研究常用","example_en":"The ultrathin nanosheet exposes a large fraction of surface atoms.","example_zh":"超薄纳米片能够暴露较高比例的表面原子。","pos":"n.","meanings":["纳米片"],"ipa":""},{"id":430,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"nanofilm","zh":"纳米薄膜","note":"纳米尺度薄膜","source":"教材亚稳态+研究常用","example_en":"The electrical resistance of a nanofilm can change as the film becomes thinner.","example_zh":"随着薄膜变薄，纳米薄膜的电阻可能发生变化。","pos":"n.","meanings":["纳米薄膜"],"ipa":""},{"id":431,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"quantum dot","zh":"量子点","note":"三维受限的纳米半导体结构","source":"教材亚稳态+研究常用","example_en":"The emission wavelength of a quantum dot can change with particle size.","example_zh":"量子点的发射波长会随颗粒尺寸变化。","pos":"n. phr.","meanings":["量子点"],"ipa":""},{"id":432,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"specific surface area","zh":"比表面积","note":"单位质量材料的表面积","source":"教材亚稳态+研究常用","example_en":"A high specific surface area provides more active sites for surface reactions.","example_zh":"较高的比表面积能够提供更多表面反应活性位点。","pos":"n. phr.","meanings":["比表面积"],"ipa":""},{"id":433,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"surface-to-volume ratio","zh":"表面积体积比","note":"纳米材料的重要尺寸参数","source":"教材亚稳态+研究常用","example_en":"The surface-to-volume ratio rises sharply as particle size decreases.","example_zh":"颗粒尺寸减小时，表面积体积比会显著增大。","pos":"n. phr.","meanings":["表面积体积比"],"ipa":""},{"id":434,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"size effect","zh":"尺寸效应","note":"性能随尺寸改变而变化","source":"教材亚稳态+研究常用","example_en":"The size effect becomes important when a material dimension approaches the nanoscale.","example_zh":"当材料尺寸接近纳米尺度时，尺寸效应会变得显著。","pos":"n. phr.","meanings":["尺寸效应"],"ipa":""},{"id":435,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"quantum confinement","zh":"量子限域","note":"低维尺度导致电子态离散化","source":"教材亚稳态+研究常用","example_en":"Quantum confinement can widen the effective band gap of very small semiconductor nanostructures.","example_zh":"量子限域效应可能增大极小半导体纳米结构的有效带隙。","pos":"n. phr.","meanings":["量子限域"],"ipa":""},{"id":436,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"surface plasmon resonance","zh":"表面等离激元共振","note":"金属纳米结构光学现象","source":"教材亚稳态+研究常用","example_en":"Surface plasmon resonance produces strong optical absorption in some metallic nanostructures.","example_zh":"表面等离激元共振会使某些金属纳米结构产生强烈的光学吸收。","pos":"n. phr.","meanings":["表面等离激元共振"],"ipa":""},{"id":437,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"localized surface plasmon resonance","zh":"局域表面等离激元共振","note":"LSPR","source":"教材亚稳态+研究常用","example_en":"Localized surface plasmon resonance is sensitive to particle shape and the surrounding dielectric environment.","example_zh":"局域表面等离激元共振对颗粒形貌和周围介电环境非常敏感。","pos":"n. phr.","meanings":["局域表面等离激元共振"],"ipa":""},{"id":438,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"self-assembly","zh":"自组装","note":"组元自发形成有序结构","source":"教材亚稳态+研究常用","example_en":"Self-assembly can organize nanoparticles into ordered structures without direct placement of each particle.","example_zh":"自组装能够在无需逐个放置颗粒的情况下形成有序纳米结构。","pos":"n. phr.","meanings":["自组装"],"ipa":""},{"id":439,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"nucleation density","zh":"形核密度","note":"单位面积或体积晶核数量","source":"教材亚稳态+研究常用","example_en":"A higher nucleation density usually leads to a larger number of smaller grains.","example_zh":"较高的形核密度通常会形成数量更多、尺寸更小的晶粒。","pos":"n. phr.","meanings":["形核密度"],"ipa":""},{"id":440,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"particle morphology","zh":"颗粒形貌","note":"颗粒几何外形","source":"教材亚稳态+研究常用","example_en":"Particle morphology changed from nearly spherical to rod-like as the growth conditions changed.","example_zh":"随着生长条件变化，颗粒形貌由近球形转变为棒状。","pos":"n. phr.","meanings":["颗粒形貌"],"ipa":""},{"id":441,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"aspect ratio","zh":"长径比","note":"长度与直径之比","source":"教材亚稳态+研究常用","example_en":"The aspect ratio is the ratio of particle length to its characteristic width or diameter.","example_zh":"长径比表示颗粒长度与其特征宽度或直径之比。","pos":"n. phr.","meanings":["长径比"],"ipa":""},{"id":442,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"monodisperse","zh":"单分散","note":"尺寸分布较窄","source":"教材亚稳态+研究常用","example_en":"A monodisperse nanoparticle sample has a relatively narrow size distribution.","example_zh":"单分散纳米颗粒样品具有较窄的尺寸分布。","pos":"adj.","meanings":["单分散"],"ipa":""},{"id":443,"category":"11 纳米材料","type":"term","typeLabel":"单词","en":"agglomeration","zh":"团聚 phr.","meanings":["集成电路"],"ipa":""},{"id":729,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"quantum material","zh":"量子材料","note":"中大研究方向","source":"985课程+中大方向","example_en":"Quantum materials can show electronic states that cannot be explained by simple classical models.","example_zh":"量子材料可能表现出简单经典模型难以解释的电子态。","pos":"n. phr.","meanings":["量子材料"],"ipa":""},{"id":730,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"flexible electronics","zh":"柔性电子","note":"中大研究方向","source":"985课程+中大方向","example_en":"Flexible electronics require conductive and functional layers that can tolerate repeated bending.","example_zh":"柔性电子需要能够承受反复弯折的导电层和功能层。","pos":"n. phr.","meanings":["柔性电子"],"ipa":""},{"id":731,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"biosensor","zh":"生物传感器","note":"中大研究方向","source":"985课程+中大方向","example_en":"A biosensor converts a biological interaction into a measurable signal.","example_zh":"生物传感器把生物相互作用转化为可测量信号。","pos":"n.","meanings":["生物传感器"],"ipa":""},{"id":732,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"photocatalysis","zh":"光催化","note":"中大研究方向","source":"985课程+中大方向","example_en":"Photocatalysis uses light-generated carriers to drive chemical reactions.","example_zh":"光催化利用光生载流子驱动化学反应。","pos":"n.","meanings":["光催化"],"ipa":""},{"id":733,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"electrocatalysis","zh":"电催化","note":"新能源研究","source":"985课程+中大方向","example_en":"Electrocatalysis lowers the kinetic barrier of an electrochemical reaction at an electrode.","example_zh":"电催化能够降低电极上电化学反应的动力学势垒。","pos":"n.","meanings":["电催化"],"ipa":""},{"id":734,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"energy storage","zh":"储能","note":"新能源材料","source":"985课程+中大方向","example_en":"Energy-storage materials must balance capacity, rate capability, safety, and cycle life.","example_zh":"储能材料需要在容量、倍率性能、安全性和循环寿命之间取得平衡。","pos":"n. phr.","meanings":["储能"],"ipa":""},{"id":735,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"lithium-ion battery","zh":"锂离子电池","note":"新能源材料","source":"985课程+中大方向","example_en":"Lithium-ion batteries store energy through reversible lithium-ion insertion and extraction reactions.","example_zh":"锂离子电池通过可逆的锂离子嵌入和脱出反应储存能量。","pos":"n. phr.","meanings":["锂离子电池"],"ipa":""},{"id":736,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"sodium-ion battery","zh":"钠离子电池","note":"新能源材料","source":"985课程+中大方向","example_en":"Sodium-ion batteries use sodium ions as the main charge carriers between the electrodes.","example_zh":"钠离子电池以钠离子作为电极之间的主要载流离子。","pos":"n. phr.","meanings":["钠离子电池"],"ipa":""},{"id":737,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"aqueous zinc-ion battery","zh":"水系锌离子电池","note":"中大方向","source":"985课程+中大方向","example_en":"Aqueous zinc-ion batteries use a water-based electrolyte and a zinc-containing negative electrode.","example_zh":"水系锌离子电池采用水系电解液和含锌负极。","pos":"n. phr.","meanings":["水系锌离子电池"],"ipa":""},{"id":738,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"electrode material","zh":"电极材料","note":"电池","source":"985课程+中大方向","example_en":"The crystal structure of an electrode material affects ion transport and storage capacity.","example_zh":"电极材料的晶体结构会影响离子传输和储存容量。","pos":"n. phr.","meanings":["电极材料"],"ipa":""},{"id":739,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"electrolyte","zh":"电解质","note":"电池","source":"985课程+中大方向","example_en":"The electrolyte carries ions between the positive and negative electrodes.","example_zh":"电解质负责在正负电极之间传导离子。","pos":"n.","meanings":["电解质"],"ipa":""},{"id":740,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"solid electrolyte","zh":"固态电解质","note":"电池","source":"985课程+中大方向","example_en":"A solid electrolyte conducts ions while remaining electronically insulating in many battery designs.","example_zh":"在许多电池设计中，固态电解质传导离子而保持电子绝缘。","pos":"n. phr.","meanings":["固态电解质"],"ipa":""},{"id":741,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"specific capacity","zh":"比容量","note":"电池性能","source":"985课程+中大方向","example_en":"Specific capacity expresses how much charge can be stored per unit mass of active material.","example_zh":"比容量表示单位质量活性材料能够储存的电荷量。","pos":"n. phr.","meanings":["比容量"],"ipa":""},{"id":742,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"cycle stability","zh":"循环稳定性","note":"电池性能","source":"985课程+中大方向","example_en":"Good cycle stability means that a battery retains most of its capacity after repeated cycling.","example_zh":"良好的循环稳定性意味着电池经过多次循环后仍能保持大部分容量。","pos":"n. phr.","meanings":["循环稳定性"],"ipa":""},{"id":743,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"Coulombic efficiency","zh":"库仑效率","note":"电化学","source":"985课程+中大方向","example_en":"Coulombic efficiency compares the charge recovered during discharge with the charge supplied during charging.","example_zh":"库仑效率比较放电回收电量与充电输入电量。","pos":"n. phr.","meanings":["库仑效率"],"ipa":""},{"id":744,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"cyclic voltammetry","zh":"循环伏安法","note":"CV","source":"985课程+中大方向","example_en":"Cyclic voltammetry can reveal redox reactions and electrochemical reversibility.","example_zh":"循环伏安法能够反映氧化还原反应和电化学可逆性。","pos":"n. phr.","meanings":["循环伏安法"],"ipa":""},{"id":745,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"CV","zh":"循环伏安","note":"电化学测试","source":"985课程+中大方向","example_en":"The CV curve showed a pair of redox peaks during cycling.","example_zh":"CV曲线在循环过程中显示出一对氧化还原峰。","pos":"n.","meanings":["循环伏安"],"ipa":""},{"id":746,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"electrochemical impedance spectroscopy","zh":"电化学阻抗谱","note":"EIS","source":"985课程+中大方向","example_en":"Electrochemical impedance spectroscopy can separate resistive and capacitive contributions over frequency.","example_zh":"电化学阻抗谱能够在不同频率下区分电阻和电容响应。","pos":"n. phr.","meanings":["电化学阻抗谱"],"ipa":""},{"id":747,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"EIS","zh":"电化学阻抗谱","note":"电化学测试","source":"985课程+中大方向","example_en":"EIS was used to compare charge-transfer resistance before and after cycling.","example_zh":"EIS用于比较循环前后的电荷转移电阻。","pos":"n.","meanings":["电化学阻抗谱"],"ipa":""},{"id":748,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"linear sweep voltammetry","zh":"线性扫描伏安","note":"LSV","source":"985课程+中大方向","example_en":"Linear sweep voltammetry can be used to evaluate an electrochemical stability window.","example_zh":"线性扫描伏安法可用于评估电化学稳定窗口。","pos":"n. phr.","meanings":["线性扫描伏安"],"ipa":""},{"id":749,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"BET surface area","zh":"BET比表面积","note":"多孔材料表征","source":"985课程+中大方向","example_en":"BET surface area is commonly obtained from gas-adsorption data for porous materials.","example_zh":"BET比表面积通常由多孔材料的气体吸附数据得到。","pos":"n. phr.","meanings":["BET比表面积"],"ipa":""},{"id":750,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"X-ray computed tomography","zh":"X射线计算机断层扫描","note":"X-CT","source":"985课程+中大方向","example_en":"X-ray computed tomography reconstructs three-dimensional internal features without cutting the sample apart.","example_zh":"X射线计算机断层扫描能够在不切开样品的情况下重建三维内部结构。","pos":"n. phr.","meanings":["X射线计算机断层扫描"],"ipa":""},{"id":751,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"focused ion beam","zh":"聚焦离子束","note":"FIB","source":"985课程+中大方向","example_en":"A focused ion beam can mill a precise cross section for microscopic analysis.","example_zh":"聚焦离子束能够制备精确截面用于显微分析。","pos":"n. phr.","meanings":["聚焦离子束"],"ipa":""},{"id":752,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"FIB-SEM","zh":"聚焦离子束扫描电镜联用","note":"三维微结构表征","source":"985课程+中大方向","example_en":"FIB-SEM can serially section and image a sample to reconstruct its three-dimensional microstructure.","example_zh":"FIB-SEM可连续切片并成像，从而重建样品的三维微观结构。","pos":"n. phr.","meanings":["聚焦离子束扫描电镜联用"],"ipa":""},{"id":753,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"solid-state NMR","zh":"固体核磁共振","note":"中大研究方向","source":"985课程+中大方向","example_en":"Solid-state NMR provides local structural information in crystalline and amorphous solids.","example_zh":"固体核磁共振能够提供晶态和非晶态固体的局部结构信息。","pos":"n. phr.","meanings":["固体核磁共振"],"ipa":""},{"id":754,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"synchrotron radiation","zh":"同步辐射","note":"先进表征","source":"985课程+中大方向","example_en":"Synchrotron radiation provides intense and tunable X-rays for advanced structural characterization.","example_zh":"同步辐射提供高强度、可调谐的X射线用于先进结构表征。","pos":"n. phr.","meanings":["同步辐射"],"ipa":""},{"id":755,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"in situ TEM","zh":"原位TEM","note":"动态表征","source":"985课程+中大方向","example_en":"In situ TEM can directly observe microstructural evolution during heating or loading.","example_zh":"原位TEM能够直接观察加热或加载过程中的微观结构演化。","pos":"n. phr.","meanings":["原位TEM"],"ipa":""},{"id":756,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"electron microscopy","zh":"电子显微学","note":"先进表征","source":"985课程+中大方向","example_en":"Electron microscopy reveals structures much smaller than the resolution limit of optical microscopy.","example_zh":"电子显微学能够观察远小于光学显微镜分辨极限的结构。","pos":"n. phr.","meanings":["电子显微学"],"ipa":""},{"id":757,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"microscopy","zh":"显微学","note":"显微观察技术总称","source":"985课程+中大方向","example_en":"Microscopy converts spatial variations in a sample into images that can be interpreted structurally.","example_zh":"显微学把样品中的空间差异转化为可用于结构分析的图像。","pos":"n.","meanings":["显微学"],"ipa":""},{"id":758,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"spectroscopy","zh":"光谱学","note":"通过能谱或光谱获取信息","source":"985课程+中大方向","example_en":"Spectroscopy identifies materials by analyzing how they interact with energy across a spectrum.","example_zh":"光谱学通过分析材料与不同能量的相互作用来获取材料信息。","pos":"n.","meanings":["光谱学"],"ipa":""},{"id":759,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"diffraction","zh":"衍射","note":"波遇到周期结构产生干涉","source":"985课程+中大方向","example_en":"Diffraction occurs when waves interfere after interacting with a periodic structure.","example_zh":"当波与周期结构相互作用并发生干涉时会产生衍射。","pos":"n.","meanings":["衍射"],"ipa":""},{"id":760,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"microstructure-property relationship","zh":"微观结构-性能关系","note":"材料科学核心逻辑","source":"985课程+中大方向","example_en":"The microstructure-property relationship explains why changes in grain size or phase distribution alter performance.","example_zh":"微观结构-性能关系解释了晶粒尺寸或相分布变化为何会改变材料性能。","pos":"n. phr.","meanings":["微观结构-性能关系"],"ipa":""},{"id":761,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"processing-structure-property relationship","zh":"工艺-结构-性能关系","note":"材料科学核心逻辑","source":"985课程+中大方向","example_en":"Processing changes structure, and the resulting structure determines many material properties.","example_zh":"加工工艺改变材料结构，而形成的结构又决定许多材料性能。","pos":"n. phr.","meanings":["工艺-结构-性能关系"],"ipa":""},{"id":762,"category":"17 前沿与研究平台常见术语","type":"term","typeLabel":"单词","en":"structure-property relationship","zh":"结构-性能关系","note":"材料科学核心逻辑","source":"985课程+中大方向","example_en":"Understanding the structure-property relationship is central to designing materials for a target performance.","example_zh":"理解结构-性能关系是面向目标性能设计材料的核心。","pos":"n. phr.","meanings":["结构-性能关系"],"ipa":""},{"id":1146,"category":"17 前沿与研究平台常见术语","type":"phrase","typeLabel":"短语","en":"high-entropy alloy","zh":"高熵合金","note":"高熵合金：材料前沿研究常用筛选的常用术语。","source":"材料前沿研究常用","example_en":"High-entropy alloy is frequently encountered in current research on advanced or functional materials.","example_zh":"“高熵合金”常见于先进材料或功能材料的前沿研究。","pos":"n. phr.","meanings":["高熵合金"],"ipa":""},{"id":1147,"category":"17 前沿与研究平台常见术语","type":"phrase","typeLabel":"短语","en":"medium-entropy al function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uniqValid(arr){const valid=new Set(CARDS.map(c=>c.id));return [...new Set((Array.isArray(arr)?arr:[]).map(Number).filter(id=>valid.has(id)))]}
function wp(id){
  const k=String(id),p=wordProgress[k]||{};
  const out={learn:Math.max(0,Math.min(TOTAL_STEPS,Number(p.learn)||0)),review:Math.max(0,Math.min(TOTAL_STEPS-1,Number(p.review)||0)),updated:Number(p.updated)||0};
  wordProgress[k]=out;return out;
}
function setLearn(id,n){const p=wp(id);p.learn=Math.max(0,Math.min(TOTAL_STEPS,n));p.updated=Date.now();wordProgress[String(id)]=p;save()}
function setReview(id,n){const p=wp(id);p.review=Math.max(0,Math.min(TOTAL_STEPS-1,n));p.updated=Date.now();wordProgress[String(id)]=p;save()}
function modeProgress(id,mode){return mode==='review'?wp(id).review:wp(id).learn}
function setModeProgress(id,mode,n){if(mode==='review')setReview(id,n);else setLearn(id,n)}

const V10_INTERVIEW_BASE=[{"id":"base-671","category":"专业基础","q":"什么是晶体？","a":"晶体是原子或离子具有长程周期性有序排列的固体。","en":"What is a crystal?","source":"现有题库"},{"id":"base-672","category":"专业基础","q":"晶体和非晶体有什么区别？","a":"晶体具有长程周期有序，而非晶体通常只有短程有序。","en":"What is the difference between a crystal and an amorphous solid?","source":"现有题库"},{"id":"base-673","category":"专业基础","q":"什么是晶胞？","a":"晶胞是通过平移能够生成整个晶体的最小重复结构单元。","en":"What is a unit cell?","source":"现有题库"},{"id":"base-674","category":"专业基础","q":"什么是布拉维点阵？","a":"布拉维点阵是由等价点按周期规律无限重复形成的点阵。","en":"What is a Bravais lattice?","source":"现有题库"},{"id":"base-675","category":"专业基础","q":"FCC、BCC和HCP有什么区别？","a":"FCC和HCP都是配位数为12的密排结构，而BCC配位数为8且不是密排结构。","en":"What is the difference between FCC, BCC, and HCP?","source":"现有题库"},{"id":"base-676","category":"专业基础","q":"为什么FCC金属通常具有较好的塑性？","a":"FCC金属在密排面和密排方向上有12个易启动滑移系，因此通常具有较好的塑性。","en":"Why are FCC metals usually ductile?","source":"现有题库"},{"id":"base-677","category":"专业基础","q":"什么是位错？","a":"位错是一种线缺陷，它使塑性变形能够在远低于理论剪切强度的应力下发生。","en":"What is a dislocation?","source":"现有题库"},{"id":"base-678","category":"专业基础","q":"刃型位错和螺型位错有什么区别？","a":"刃型位错的柏氏矢量垂直于位错线，而螺型位错的柏氏矢量平行于位错线。","en":"What is the difference between an edge dislocation and a screw dislocation?","source":"现有题库"},{"id":"base-679","category":"专业基础","q":"柏氏矢量的物理意义是什么？","a":"柏氏矢量表示位错造成的晶格畸变大小和方向。","en":"What is the physical meaning of the Burgers vector?","source":"现有题库"},{"id":"base-680","category":"专业基础","q":"什么是层错？","a":"层错是原子面的正常堆垛顺序发生中断形成的面缺陷。","en":"What is a stacking fault?","source":"现有题库"},{"id":"base-681","category":"专业基础","q":"什么是晶界？","a":"晶界是取向不同的相邻晶粒之间的界面。","en":"What is a grain boundary?","source":"现有题库"},{"id":"base-682","category":"专业基础","q":"晶粒尺寸如何影响强度？","a":"在许多多晶金属中，减小晶粒尺寸会按照Hall-Petch关系提高屈服强度。","en":"How does grain size affect strength?","source":"现有题库"},{"id":"base-683","category":"专业基础","q":"什么是扩散？","a":"扩散是原子的热激活迁移过程，可沿化学势或浓度梯度产生净物质传输。","en":"What is diffusion?","source":"现有题库"},{"id":"base-684","category":"专业基础","q":"菲克第一定律和第二定律有什么区别？","a":"菲克第一定律描述稳态扩散通量，第二定律描述浓度随时间的变化。","en":"What is the difference between Fick's first and second laws?","source":"现有题库"},{"id":"base-685","category":"专业基础","q":"为什么温度升高会加快扩散？","a":"温度升高后，更多原子获得足够热能克服扩散激活能垒。","en":"Why does diffusion become faster at higher temperatures?","source":"现有题库"},{"id":"base-686","category":"专业基础","q":"金属主要强化机制有哪些？","a":"金属常见强化机制包括细晶强化、固溶强化、析出或第二相强化以及加工硬化。","en":"What are the main strengthening mechanisms in metals?","source":"现有题库"},{"id":"base-687","category":"专业基础","q":"什么是加工硬化？","a":"加工硬化是塑性变形过程中位错累积和相互作用导致强度提高的现象。","en":"What is work hardening?","source":"现有题库"},{"id":"base-688","category":"专业基础","q":"回复和再结晶有什么区别？","a":"回复主要降低储存能和内应力，而再结晶会形成位错密度很低的新晶粒。","en":"What is the difference between recovery and recrystallization?","source":"现有题库"},{"id":"base-689","category":"专业基础","q":"什么是相？","a":"相是结构和成分具有确定特征、物理化学性质均一的区域。","en":"What is a phase?","source":"现有题库"},{"id":"base-690","category":"专业基础","q":"什么是吉布斯相律？","a":"吉布斯相律把平衡体系的自由度与组元数和相数联系起来。","en":"What is the Gibbs phase rule?","source":"现有题库"},{"id":"base-691","category":"专业基础","q":"什么是杠杆定律？","a":"杠杆定律利用合金总成分和两相边界成分计算两相的相对含量。","en":"What is the lever rule?","source":"现有题库"},{"id":"base-692","category":"专业基础","q":"什么是共晶反应？","a":"共晶反应是在特定温度和成分下由一个液相转变为两个固相。","en":"What is a eutectic reaction?","source":"现有题库"},{"id":"base-693","category":"专业基础","q":"共晶和共析反应有什么区别？","a":"共晶反应从液相开始，而共析反应从一个固相开始。","en":"What is the difference between eutectic and eutectoid reactions?","source":"现有题库"},{"id":"base-694","category":"专业基础","q":"什么是过冷度？","a":"过冷度是液体在凝固前低于平衡凝固温度的温度差。","en":"What is undercooling?","source":"现有题库"},{"id":"base-695","category":"专业基础","q":"均匀形核与非均匀形核有什么区别？","a":"均匀形核在体相中无优先位置发生，而非均匀形核在表面或缺陷处发生，通常能垒更低。","en":"What is the difference between homogeneous and heterogeneous nucleation?","source":"现有题库"},{"id":"base-696","category":"专业基础","q":"凝固过程中哪些因素控制晶粒尺寸？","a":"凝固晶粒尺寸取决于形核速率和长大速率的竞争，两者都受过冷度和冷却条件显著影响。","en":"What factors control grain size during solidification?","source":"现有题库"},{"id":"base-697","category":"专业基础","q":"什么是马氏体转变？","a":"马氏体转变是一种由原子协同位移主导的无扩散固态相变。","en":"What is martensitic transformation?","source":"现有题库"},{"id":"base-698","category":"专业基础","q":"XRD有什么用途？","a":"XRD主要用于物相鉴定、晶体结构分析以及晶面间距或晶畴尺寸等测量。","en":"What is XRD used for?","source":"现有题库"},{"id":"base-699","category":"专业基础","q":"SEM和TEM有什么区别？","a":"SEM主要观察表面形貌，而TEM让电子透过薄样品，以更高分辨率观察内部纳米结构。","en":"What is the difference between SEM and TEM?","source":"现有题库"},{"id":"base-700","category":"专业基础","q":"EDS如何与SEM配合使用？","a":"SEM电子束激发特征X射线，EDS通过检测其能量来识别和分布元素。","en":"How does EDS work with SEM?","source":"现有题库"},{"id":"base-701","category":"专业基础","q":"XPS能够提供什么信息？","a":"XPS通过光电子结合能提供表面元素组成和化学态信息。","en":"What information can XPS provide?","source":"现有题库"},{"id":"base-702","category":"专业基础","q":"如果你制备出一种新材料，你会如何表征？","a":"我会根据研究问题组合表征方法，例如XRD分析物相，SEM或TEM观察组织，EDS分析成分，再配合性能测试。","en":"How would you characterize a newly prepared material?","source":"现有题库"},{"id":"base-703","category":"科研项目","q":"为什么选择分子动力学模拟？","a":"分子动力学能够直接跟踪原子运动，并研究实验中较难直接获得的时间和空间尺度上的结构演化。","en":"Why did you choose molecular dynamics simulation?","source":"现有题库"},{"id":"base-704","category":"科研项目","q":"为什么比较逐步降温和直接降温？","a":"我比较两种冷却路径，是为了判断热历史是否会改变纳米团簇的结构转变和最终稳定性。","en":"Why did you compare stepwise cooling and direct cooling?","source":"现有题库"},{"id":"base-705","category":"科研项目","q":"径向分布函数能告诉你什么？","a":"径向分布函数描述以参考原子为中心不同距离处的原子密度变化，可反映短程结构有序。","en":"What does the radial distribution function tell you?","source":"现有题库"},{"id":"base-706","category":"科研项目","q":"你如何判断Ag纳米团簇发生了结构变化？","a":"我结合势能、径向分布函数、形状因子和局部原子构型分析来判断结构变化，而不是只依赖单一指标。","en":"How did you identify structural changes in your Ag nanocluster?","source":"现有题库"},{"id":"base-707","category":"科研项目","q":"你的项目中最大的困难是什么？","a":"项目最大的困难是把多个模拟指标的变化与一致的微观结构解释对应起来。","en":"What was the main difficulty in your project?","source":"现有题库"},{"id":"base-708","category":"科研项目","q":"你从这个项目中学到了什么？","a":"我学会了建立模拟流程、严格检查数据，并把结构变化与其内在机理联系起来。","en":"What did you learn from this project?","source":"现有题库"},{"id":"base-709","category":"科研项目","q":"你会如何改进现在的研究？","a":"我会增加独立模拟次数提高统计可靠性，并在条件允许时用合适的实验表征验证模拟趋势。","en":"How would you improve your current work?","source":"现有题库"},{"id":"base-710","category":"实验与失效","q":"什么是SPS烧结？","a":"放电等离子烧结利用脉冲电流和压力对粉末快速加热并致密化。","en":"What is SPS sintering?","source":"现有题库"},{"id":"base-711","category":"实验与失效","q":"为什么WC-Co硬质合金中使用Co作为粘结相？","a":"Co形成较韧的金属粘结相，能够润湿WC并帮助平衡硬度与抗断裂能力。","en":"Why is cobalt used as a binder in WC-Co cemented carbides?","source":"现有题库"},{"id":"base-712","category":"实验与失效","q":"硬度和断裂韧性通常存在怎样的权衡？","a":"提高硬度往往会使裂纹更容易萌生或扩展，因此若微观结构设计不当，硬度和断裂韧性通常存在此消彼长。","en":"How do hardness and fracture toughness usually trade off?","source":"现有题库"},{"id":"base-713","category":"实验与失效","q":"你会如何分析一个失效零部件？","a":"我会结合服役历史、断口观察、金相、成分与性能测试以及应力分析来判断失效机理。","en":"How would you analyze a failed component?","source":"现有题库"},{"id":"base-714","category":"实验与失效","q":"脆性断裂和韧性断裂有什么区别？","a":"韧性断裂伴随明显塑性变形并常见韧窝，而脆性断裂塑性变形很少并可能出现解理特征。","en":"What is the difference between brittle and ductile fracture?","source":"现有题库"},{"id":"base-715","category":"实验与失效","q":"疲劳断裂有哪些常见特征？","a":"疲劳断口通常包括裂纹源区、带有贝壳纹或条带的扩展区以及最终瞬断区。","en":"What are common features of fatigue fracture?","source":"现有题库"},{"id":"base-716","category":"半导体与规划","q":"为什么你对半导体材料感兴趣？","a":"我关注半导体材料中缺陷、界面和微观结构如何调控载流子输运与器件性能。","en":"Why are you interested in semiconductor materials?","source":"现有题库"},{"id":"base-717","category":"半导体与规划","q":"什么是带隙？","a":"带隙是价带顶与导带底之间的能量差。","en":"What is a band gap?","source":"现有题库"},{"id":"base-718","category":"半导体与规划","q":"n型与p型半导体有什么区别？","a":"n型半导体以电子为多数载流子，而p型半导体以空穴为多数载流子。","en":"What is the difference between n-type and p-type semiconductors?","source":"现有题库"},{"id":"base-719","category":"半导体与规划","q":"什么是异质结？","a":"异质结是两种不同半导体材料或电子结构不同区域之间形成的界面。","en":"What is a heterojunction?","source":"现有题库"},{"id":"base-720","category":"半导体与规划","q":"为什么缺陷对半导体材料很重要？","a":"缺陷可形成陷阱态或复合中心、改变载流子浓度，并显著影响电学和光学性能。","en":"Why are defects important in semiconductor materials?","source":"现有题库"},{"id":"base-721","category":"半导体与规划","q":"界面在薄膜器件中有什么作用？","a":"界面会影响薄膜器件中的电荷转移、复合、附着以及部分稳定性问题。","en":"What is the role of interfaces in thin-film devices?","source":"现有题库"},{"id":"base-722","category":"方向与动机","q":"研究生阶段你想做什么方向？","a":"我希望研究功能材料和半导体材料，尤其关注微观结构与界面对性能和器件表现的影响。","en":"What research direction would you like to pursue in graduate school?","source":"现有题库"},{"id":"base-723","category":"方向与动机","q":"为什么选择中山大学？","a":"我看重中山大学良好的材料科研环境，希望在与兴趣契合的方向上进一步提升实验与科研能力。","en":"Why do you want to study at Sun Yat-sen University?","source":"现有题库"},{"id":"base-724","category":"方向与动机","q":"你计划如何把模拟与实验结合？","a":"我会先用模拟提出机理假设，再设计表征或性能测试去验证这些预测。","en":"How do you plan to combine simulation with experiments?","source":"现有题库"},{"id":"extra-1","category":"自我介绍与动机","q":"请用1分钟介绍一下自己。","a":"可以按“本科背景—核心科研经历—形成的能力—研究兴趣”展开。重点放在Ag561纳米团簇分子动力学、Cu-Ag纳米合金、WC-Co-Al硬质合金与失效分析等经历，最后落到功能材料、半导体材料以及模拟与实验结合的研究兴趣。","en":"","source":"精选补充"},{"id":"extra-2","category":"自我介绍与动机","q":"为什么选择材料科学与工程？","a":"材料研究把微观结构、制备过程和宏观性能联系起来，既有基础科学问题，也能直接服务器件和工程。我在原子模拟、粉末冶金和失效分析项目中越来越明确地感受到“结构决定性能、过程调控结构”的逻辑，因此希望继续在材料方向深入。","en":"","source":"精选补充"},{"id":"extra-3","category":"自我介绍与动机","q":"你认为自己的科研优势是什么？","a":"我的优势是愿意把问题拆成可验证的小问题，并通过多种证据交叉判断。例如在Ag561项目中，我不会只看单一势能曲线，而是结合RDF、形状因子和局部原子结构去判断结构转变。","en":"","source":"精选补充"},{"id":"extra-4","category":"自我介绍与动机","q":"你目前最需要提高的科研能力是什么？","a":"我希望进一步提高实验设计与结果验证能力。已有经历中原子模拟占比较高，下一阶段希望更系统地把模拟预测与显微、结构和性能表征结合起来。","en":"","source":"精选补充"},{"id":"extra-5","category":"自我介绍与动机","q":"为什么要读研究生？","a":"本科科研让我意识到，很多材料问题需要更系统的理论、实验和方法训练才能真正回答。研究生阶段我希望形成独立提出问题、设计验证方案和形成可靠结论的能力，而不仅停留在完成既定任务。","en":"","source":"精选补充"},{"id":"extra-6","category":"自我介绍与动机","q":"如果导师给你的方向和你预期不同，你会怎么处理？","a":"我会先理解课题背后的科学问题和团队需求，再判断与自己已有能力的连接点。如果方向具有明确的研究价值，我愿意先做充分调研和小规模验证，再和导师讨论如何形成既服务课题又能发挥自身优势的切入点。","en":"","source":"精选补充"},{"id":"extra-7","category":"科研方法","q":"你如何阅读一篇材料学论文？","a":"我通常先看摘要、图和结论确定核心问题与主要证据，再回到方法和结果核对关键变量、对照组和表征逻辑。最后记录“研究问题—方法—关键数据—结论—局限—可延伸问题”，避免只记结论。","en":"","source":"精选补充"},{"id":"extra-8","category":"科研方法","q":"你如何判断一组科研数据是否可信？","a":"先检查数据处理流程和单位，再看重复性、误差、异常点和趋势是否具有物理意义；同时用不同指标或独立表征进行交叉验证。模拟数据还需要检查势函数、边界条件、时间尺度与统计采样是否合理。","en":"","source":"精选补充"},{"id":"extra-9","category":"科研方法","q":"如果实验或模拟结果和预期相反，你会怎么办？","a":"先排除输入、参数、脚本和测试流程错误，再判断结果是否揭示了原假设中的遗漏因素。只有在确认数据可靠之后才讨论机理，而不会为了符合预期去筛选数据。","en":"","source":"精选补充"},{"id":"extra-10","category":"科研方法","q":"如何设计一个有说服力的对照实验？","a":"一次尽量只改变一个关键变量，其余条件保持一致；同时设置基准组，并保证测试与数据处理方法完全一致。若变量存在耦合，还应通过补充组或统计分析区分各因素贡献。","en":"","source":"精选补充"},{"id":"extra-11","category":"Ag561项目","q":"为什么选择Ag561纳米团簇作为研究对象？","a":"Ag纳米团簇具有典型的尺寸效应和结构竞争现象，561原子的有限体系又能在可接受计算量下观察冷却过程中的局部结构演化，适合研究热历史对纳米尺度相结构的影响。","en":"","source":"精选补充"},{"id":"extra-12","category":"Ag561项目","q":"你的Ag561模型为什么可以用EAM势？","a":"银属于金属体系，EAM势通过局部电子密度与对势描述金属键合，能够以较低计算成本处理数百原子的结构演化。使用时仍需说明所选参数化势函数的适用范围。","en":"","source":"精选补充"},{"id":"extra-13","category":"Ag561项目","q":"为什么采用NVT系综？","a":"研究重点是给定温度下的结构演化，需要控制体系温度；NVT系综保持粒子数、体积和温度不变，适合有限团簇在设定热处理路径下的比较。团簇体系的具体边界条件仍需在方法中明确。","en":"","source":"精选补充"},{"id":"extra-14","category":"Ag561项目","q":"逐步降温和直接降温各自模拟什么？","a":"逐步降温给体系在中间温区更多弛豫机会，可观察结构逐级调整；直接降温改变了热历史与弛豫时间，可用来判断最终结构和相变路径对冷却过程是否敏感。","en":"","source":"精选补充"},{"id":"extra-15","category":"Ag561项目","q":"势能下降一定代表发生相变吗？","a":"不一定。降温本身就会降低热振动和势能，因此势能突变只能作为线索。还需要结合RDF峰形、局部结构、键对分析或其他结构参数共同判断。","en":"","source":"精选补充"},{"id":"extra-16","category":"Ag561项目","q":"RDF在你的项目中主要看什么？","a":"主要看近邻峰位置、峰宽、峰的分裂以及远距离有序程度。液态或无序结构峰较宽，晶化后近邻峰更清晰，并可能出现更明显的中长程结构特征。","en":"","source":"精选补充"},{"id":"extra-17","category":"Ag561项目","q":"形状因子能说明什么？","a":"形状因子用于量化团簇整体几何形态及其偏离球形的程度。它可以辅助判断冷却过程中是否伴随显著形貌重排，但不能单独判定晶体结构。","en":"","source":"精选补充"},{"id":"extra-18","category":"Ag561项目","q":"为什么FCC银中会出现HCP样局部结构？","a":"纳米尺度下表面、层错和有限尺寸会改变局部稳定性。FCC密排层中出现堆垛顺序改变时，会在局部结构识别中呈现HCP样环境，这并不等同于整个团簇转变为宏观HCP相。","en":"","source":"精选补充"},{"id":"extra-19","category":"Ag561项目","q":"如何提高分子动力学结果的统计可靠性？","a":"可以使用不同初始速度种子进行独立重复，比较转变温度与结构指标的分布，并报告波动范围；同时检查时间步长、平衡时间和冷却速率的敏感性。","en":"","source":"精选补充"},{"id":"extra-20","category":"Cu-Ag项目","q":"Cu-Ag项目与Ag561项目相比增加了什么问题？","a":"从单组元团簇进一步引入组分变量，需要同时考虑合金成分、元素偏聚和局部化学环境对成核、长大和稳定结构的影响，因此问题从“温度路径”扩展到“温度—成分”的共同作用。","en":"","source":"精选补充"},{"id":"extra-21","category":"Cu-Ag项目","q":"为什么合金纳米团簇可能发生表面偏聚？","a":"不同元素的表面能、原子尺寸和混合焓不同。为了降低体系自由能，表面能较低或与局部环境更匹配的元素可能优先占据表面位置。","en":"","source":"精选补充"},{"id":"extra-22","category":"WC-Co-Al项目","q":"WC-Co硬质合金为什么需要兼顾硬度和断裂韧性？","a":"WC硬质相提供高硬度和耐磨性，Co粘结相提供韧性。过度追求硬质相比例或细化可能削弱裂纹钝化能力，因此需要通过相组成、晶粒和界面设计寻找平衡。","en":"","source":"精选补充"},{"id":"extra-23","category":"WC-Co-Al项目","q":"加入Al相关组分的研究思路是什么？","a":"目标是通过原位形成氧化物或界面调控抑制晶粒异常长大并改善组织稳定性。具体效果必须结合XRD确定相组成、SEM/EDS观察分布，并用硬度、密度和断裂韧性共同评价。","en":"","source":"精选补充"},{"id":"extra-24","category":"WC-Co-Al项目","q":"高能球磨的主要作用和潜在问题是什么？","a":"高能球磨可实现粉末混合、细化和机械活化，提高后续烧结均匀性；同时也可能引入污染、过度冷焊或氧化，因此球磨时间、介质和保护气氛需要控制。","en":"","source":"精选补充"},{"id":"extra-25","category":"WC-Co-Al项目","q":"SPS为什么能实现快速致密化？","a":"SPS在压力作用下进行快速电加热，升温速率高、保温时间短，可在促进致密化的同时减少晶粒长大。其机理通常应从热、电流和压力的综合效应谨慎描述。","en":"","source":"精选补充"},{"id":"extra-26","category":"WC-Co-Al项目","q":"如果硬度提高但断裂韧性下降，你如何判断优化是否成功？","a":"不能只看单一指标，需要结合应用目标确定权重，同时检查密度、孔隙、晶粒尺寸和第二相分布。若韧性下降超过可接受范围，就说明强化机制带来的代价过大。","en":"","source":"精选补充"},{"id":"extra-27","category":"失效分析","q":"失效分析为什么必须先了解服役条件？","a":"断口和组织只能反映结果，载荷类型、应力水平、环境、温度和使用周期决定了可能的失效路径。缺少服役信息容易把疲劳、过载、腐蚀等不同机制混淆。","en":"","source":"精选补充"},{"id":"extra-28","category":"失效分析","q":"应力集中为什么容易成为疲劳裂纹源？","a":"几何突变会使局部应力幅高于名义应力，循环载荷下塑性滑移和微裂纹更容易在这些位置积累，最终形成稳定疲劳裂纹源。","en":"","source":"精选补充"},{"id":"extra-29","category":"失效分析","q":"有限元结果能直接证明失效原因吗？","a":"不能。有限元提供的是给定模型和边界条件下的应力或变形分布，需要与真实断口位置、材料组织和服役历史相互印证，才能形成可靠的失效结论。","en":"","source":"精选补充"},{"id":"extra-30","category":"专业基础追问","q":"什么是Schmid定律？","a":"单晶滑移取决于外加载荷在特定滑移面和滑移方向上的分解剪应力。Schmid因子反映晶体取向对该分解剪应力的影响，当其达到临界分解剪应力时滑移开始。","en":"","source":"精选补充"},{"id":"extra-31","category":"专业基础追问","q":"为什么细晶强化存在适用尺度？","a":"常规晶粒尺寸下晶界阻碍位错运动，Hall–Petch关系通常成立；当晶粒细化到极小尺度时，变形机制可能转向晶界滑移、扩散等，简单Hall–Petch外推不再可靠。","en":"","source":"精选补充"},{"id":"extra-32","category":"专业基础追问","q":"空位浓度为什么随温度升高而增加？","a":"形成空位需要形成能，但增加空位也提高构型熵。温度升高时熵项贡献增大，因此平衡空位浓度通常按指数关系上升。","en":"","source":"精选补充"},{"id":"extra-33","category":"专业基础追问","q":"间隙扩散通常为什么比置换扩散快？","a":"小原子可在间隙位置之间迁移，不必等待相邻晶格位置出现空位，且迁移能垒通常较低，因此很多间隙原子的扩散速度更快。","en":"","source":"精选补充"},{"id":"extra-34","category":"专业基础追问","q":"什么是Bragg定律？","a":"当相邻晶面散射波的程差满足2d sinθ=nλ时发生相长干涉。XRD通过衍射角与波长反推出晶面间距和晶体结构信息。","en":"","source":"精选补充"},{"id":"extra-35","category":"专业基础追问","q":"为什么晶界会影响扩散？","a":"晶界原子排列较疏松且无序，扩散激活能通常低于完整晶格，因此在较低温度或细晶材料中，晶界扩散可能成为重要的快速通道。","en":"","source":"精选补充"},{"id":"extra-36","category":"专业基础追问","q":"析出强化的基本机理是什么？","a":"细小析出相阻碍位错运动。位错可切过可剪切析出物，或在较大、不可剪切颗粒之间发生Orowan绕过；最佳强化取决于析出物尺寸、间距和界面性质。","en":"","source":"精选补充"},{"id":"extra-37","category":"专业基础追问","q":"回复、再结晶和晶粒长大的驱动力分别是什么？","a":"回复主要通过位错重排降低储存能；再结晶通过形成低位错密度新晶粒进一步降低变形储能；再结晶完成后，晶粒长大主要由降低晶界总面积和晶界能驱动。","en":"","source":"精选补充"},{"id":"extra-38","category":"专业基础追问","q":"珠光体、贝氏体和马氏体的形成机制有何差别？","a":"珠光体是扩散型共析转变产物；贝氏体形成机制更复杂，兼具剪切与碳扩散等特征；马氏体主要通过无扩散协同位移形成。它们的形成温区和组织形态不同。","en":"","source":"精选补充"},{"id":"extra-39","category":"专业基础追问","q":"XRD、SEM、TEM分别优先解决什么问题？","a":"XRD优先回答物相和晶体结构，SEM擅长表面/截面形貌和微区成分配合，TEM可在更高空间分辨率下观察内部纳米结构、缺陷和晶格信息。","en":"","source":"精选补充"},{"id":"extra-40","category":"专业基础追问","q":"EBSD能提供哪些信息？","a":"EBSD通常与SEM结合，可获得晶粒取向、晶界类型、织构、局部取向差等信息，适合建立微观取向结构与变形或相变之间的关系。","en":"","source":"精选补充"},{"id":"extra-41","category":"专业基础追问","q":"Raman光谱在材料表征中有什么价值？","a":"Raman通过非弹性光散射反映振动模式，可用于识别化学键、晶相、缺陷、应力以及部分二维和碳材料的结构变化。","en":"","source":"精选补充"},{"id":"extra-42","category":"专业基础追问","q":"为什么XPS被称为表面敏感技术？","a":"光电子在固体中的非弹性平均自由程较短，因此能逃逸并被检测的电子主要来自表面几纳米范围，XPS因此特别适合分析表面元素和化学态。","en":"","source":"精选补充"},{"id":"extra-43","category":"半导体与薄膜","q":"PVD、CVD和ALD的核心区别是什么？","a":"PVD主要依赖物理蒸发或溅射输运材料；CVD通过气相前驱体在基底发生化学反应沉积；ALD采用交替自限表面反应，可实现优异的厚度和共形性控制。","en":"","source":"精选补充"},{"id":"extra-44","category":"半导体与薄膜","q":"磁控溅射为什么适合制备薄膜？","a":"等离子体离子轰击靶材产生溅射原子并沉积到基底。磁场提高等离子体约束和离化效率，因此可在较低气压下获得稳定沉积，并适用于多种金属和化合物薄膜。","en":"","source":"精选补充"},{"id":"extra-45","category":"半导体与薄膜","q":"界面态为什么会影响半导体器件？","a":"界面缺陷可在禁带中引入能级，捕获载流子并促进复合，同时改变势垒和局部电场，因此会影响迁移率、开路电压、漏电和稳定性等器件指标。","en":"","source":"精选补充"},{"id":"extra-46","category":"半导体与薄膜","q":"如何把微观结构与器件性能联系起来？","a":"需要建立“制备参数—相组成/缺陷/晶粒/界面—载流子输运或复合—宏观器件指标”的证据链，并通过可控变量实验或模拟减少仅凭相关性下结论。","en":"","source":"精选补充"},{"id":"extra-47","category":"压力与反思","q":"如果老师指出你的结论证据不足，你会怎么回应？","a":"先明确是哪一环证据不足，例如统计重复、对照组或机理表征，然后说明现有证据能支持到什么程度，并提出最直接的补充验证方案，而不是强行维护原结论。","en":"","source":"精选补充"},{"id":"extra-48","category":"压力与反思","q":"科研中你犯过什么值得记住的错误？","a":"可以选择数据检查、图例标注或变量控制方面的真实经历，重点说明如何发现问题、如何纠正以及之后建立了什么检查机制。回答重点应放在改进能力。","en":"","source":"精选补充"},{"id":"extra-49","category":"压力与反思","q":"如果同时有课程、项目和比赛任务，你如何安排？","a":"先按截止时间和任务依赖关系排序，把需要长周期等待的实验或计算优先启动；每天拆分可交付小任务，并保留数据检查和修改时间，避免所有工作都压到最后。","en":"","source":"精选补充"},{"id":"extra-50","category":"压力与反思","q":"团队成员意见不一致时你怎么处理？","a":"先把争议转化为可比较的技术标准或数据，例如成本、性能、可制造性或实验结果；如果仍无法确定，用小规模验证降低争论成本，并明确最终决策和责任分工。","en":"","source":"精选补充"},{"id":"extra-51","category":"方向与动机","q":"研究生阶段如何从“执行任务”走向“独立研究”？","a":"先学会把导师给出的课题拆成可验证假设，主动提出对照和补充实验；随着文献积累，再从异常结果、方法局限和交叉方向中提出自己的问题，并用阶段汇报持续校正。","en":"","source":"精选补充"},{"id":"extra-52","category":"方向与动机","q":"你希望导师如何指导你？","a":"前期希望在研究问题、方法规范和关键节点上得到较明确指导；掌握方法后希望拥有更多自主设计和试错空间，同时通过规律性的讨论及时纠偏。","en":"","source":"精选补充"},{"id":"enphrase-556","category":"英文面试·科研表达","q":"如何用英文表达“开展实验”？","a":"conduct an experiment。示例：A useful research expression is “conduct an experiment”.","en":"conduct an experiment","source":"由专业英语迁移"},{"id":"enphrase-557","category":"英文面试·科研表达","q":"如何用英文表达“设计实验”？","a":"design an experiment。示例：A useful research expression is “design an experiment”.","en":"design an experiment","source":"由专业英语迁移"},{"id":"enphrase-558","category":"英文面试·科研表达","q":"如何用英文表达“制备样品”？","a":"prepare a sample。示例：A useful research expression is “prepare a sample”.","en":"prepare a sample","source":"由专业英语迁移"},{"id":"enphrase-559","category":"英文面试·科研表达","q":"如何用英文表达“表征微观组织”？","a":"characterize the microstructure。示例：A useful research expression is “characterize the microstructure”.","en":"characterize the microstructure","source":"由专业英语迁移"},{"id":"enphrase-560","category":"英文面试·科研表达","q":"如何用英文表达“测试力学性能”？","a":"measure the mechanical properties。示例：A useful research expression is “measure the mechanical properties”.","en":"measure the mechanical properties","source":"由专业英语迁移"},{"id":"enphrase-561","category":"英文面试·科研表达","q":"如何用英文表达“分析数据”？","a":"analyze the data。示例：A useful research expression is “analyze the data”.","en":"analyze the data","source":"由专业英语迁移"},{"id":"enphrase-562","category":"英文面试·科研表达","q":"如何用英文表达“处理数据”？","a":"process the data。示例：A useful research expression is “process the data”.","en":"process the data","source":"由专业英语迁移"},{"id":"enphrase-563","category":"英文面试·科研表达","q":"如何用英文表达“拟合实验数据”？","a":"fit the experimental data。示例：A useful research expression is “fit the experimental data”.","en":"fit the experimental data","source":"由专业英语迁移"},{"id":"enphrase-564","category":"英文面试·科研表达","q":"如何用英文表达“比较不同条件”？","a":"compare different conditions。示例：A useful research expression is “compare different conditions”.","en":"compare different conditions","source":"由专业英语迁移"},{"id":"enphrase-565","category":"英文面试·科研表达","q":"如何用英文表达“研究温度的影响”？","a":"investigate the effect of temperature。示例：A useful research expression is “investigate the effect of temperature”.","en":"investigate the effect of temperature","source":"由专业英语迁移"},{"id":"enphrase-566","category":"英文面试·科研表达","q":"如何用英文表达“研究成分的影响”？","a":"investigate the effect of composition。示例：A useful research expression is “investigate the effect of composition”.","en":"investigate the effect of composition","source":"由专业英语迁移"},{"id":"enphrase-567","category":"英文面试·科研表达","q":"如何用英文表达“研究结构演化”？","a":"study the structural evolution。示例：A useful research expression is “study the structural evolution”.","en":"study the structural evolution","source":"由专业英语迁移"},{"id":"enphrase-568","category":"英文面试·科研表达","q":"如何用英文表达“揭示潜在机理”？","a":"reveal the underlying mechanism。示例：A useful research ex
